<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Küken Jump Final</title>
<style>
:root {
  --ink:#111;
  --ui:#f4ecd6;
  --orange:#ffb436;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif}
body{display:grid;place-items:center}
.frame{
  position:relative;
  width:min(100vw, calc(100vh * .62));
  height:min(100vh, calc(100vw / .62));
  border-radius:min(4.5vw, 34px);
  overflow:hidden;
  background:#111;
}
canvas{display:block;width:100%;height:100%}
.hud,.screens{position:absolute;inset:0}
.hud{pointer-events:none}
.btn,.pause,.mode,.menu-btn,.world-btn,.skin-btn,.back-btn {
  pointer-events:auto;cursor:pointer;border:none;background:rgba(244,236,214,.98);color:#111;
  box-shadow:0 2px 0 rgba(0,0,0,.08);border:3px solid rgba(0,0,0,.08);
  font-weight:900;
}
.pause,.mode {
  position:absolute;top:18px;height:56px;border-radius:18px;display:grid;place-items:center;
}
.pause{left:18px;width:56px;font-size:28px}
.pause:before{content:"II";letter-spacing:-3px;transform:translateX(-2px)}
.mode{left:84px;min-width:144px;padding:0 14px;font-size:16px}
.pill{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  background:var(--ui);border-radius:18px;padding:6px 18px;font-size:18px;font-weight:900;color:#111;
  box-shadow:0 2px 0 rgba(0,0,0,.08)
}
.coins{
  position:absolute;top:18px;right:18px;min-width:112px;height:56px;border-radius:20px;background:var(--orange);
  box-shadow:0 2px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:28px;font-weight:900;color:#111
}
.tip{
  position:absolute;left:18px;top:84px;background:rgba(255,255,255,.92);border-radius:14px;
  padding:6px 10px;font-size:13px;font-weight:800;display:none
}
.help{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  background:rgba(255,255,255,.93);color:#111;border:3px solid #111;border-radius:20px;
  padding:8px 12px;max-width:min(88%,430px);text-align:center;pointer-events:none;
  box-shadow:0 8px 26px rgba(0,0,0,.18);font-size:13px;line-height:1.35
}
.screen{position:absolute;inset:0;display:none;pointer-events:auto;background:rgba(0,0,0,.18)}
.screen.show{display:block}
.panel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(88%,480px);max-height:min(88%,900px);overflow:auto;
  background:rgba(255,255,255,.98);border:4px solid #111;border-radius:28px;padding:18px 18px 20px;
  box-shadow:0 20px 40px rgba(0,0,0,.18)
}
.panel h1{margin:0 0 8px;font-size:34px}
.panel h2{margin:0 0 10px;font-size:20px}
.panel p{margin:0 0 12px;color:#333}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;justify-content:space-between;gap:14px;margin:8px 0;padding:10px 12px;border-radius:14px;background:#f6f2e8;border:2px solid #111;font-weight:900}
.menu-btn,.world-btn,.skin-btn,.back-btn{border-radius:18px;padding:12px 14px;font-size:16px}
.menu-btn.big{font-size:20px;padding:16px}
.world-btn.active,.skin-btn.active{background:#ffdc71}
.preview{height:110px;border-radius:16px;border:2px dashed #999;background:#fafafa;display:grid;place-items:center;margin-bottom:12px}
.small{opacity:.7;font-size:13px}
.skin-card{display:flex;flex-direction:column;align-items:center;gap:8px}
.skin-thumb{width:80px;height:80px;object-fit:contain}
</style>
</head>
<body>
<div class="frame" id="frame">
  <canvas id="game"></canvas>

  <div class="hud">
    <button class="pause" id="pauseBtn" aria-label="Pause"></button>
    <button class="mode" id="modeBtn">⌨️ Tastatur</button>
    <div class="pill" id="scoreSmall">0</div>
    <div class="coins"><span id="coinCount">0</span><span>🪙</span></div>
    <div class="tip" id="tiltHint">↔︎ kippen</div>
    <div class="help" id="help">Tastatur: A/D oder ←/→ bewegen, W/↑ springen, Leertaste schießt. Handy/iPad: Button umschalten, Gerät kippen, antippen = springen + schießen.</div>
  </div>

  <div class="screens">
    <div class="screen show" id="mainMenu">
      <div class="panel">
        <h1>Küken Jump</h1>
        <div class="stat"><span>Coins gesamt</span><span id="menuCoins">0</span></div>
        <div class="stat"><span>Bester Score</span><span id="menuBest">0</span></div>
        <h2>Welt wählen</h2>
        <div class="grid2" id="worldGrid"></div>
        <div style="height:12px"></div>
        <div class="grid2">
          <button class="menu-btn big" id="playBtn">Spielen</button>
          <button class="menu-btn big" id="openShopBtn">Shop</button>
        </div>
      </div>
    </div>

    <div class="screen" id="shopMenu">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <h1>Shop</h1><button class="back-btn" id="closeShopBtn">Zurück</button>
        </div>
        <div class="stat"><span>Coins</span><span id="shopCoins">0</span></div>
        <div class="preview" id="skinPreview"></div>
        <div class="grid2" id="shopGrid"></div>
      </div>
    </div>

    <div class="screen" id="gameOverMenu">
      <div class="panel">
        <h1>Verloren</h1>
        <div class="stat"><span>Coins dieser Runde</span><span id="runCoins">0</span></div>
        <div class="stat"><span>Score dieser Runde</span><span id="runScore">0</span></div>
        <div class="stat"><span>Bester Score</span><span id="bestScore">0</span></div>
        <div style="height:10px"></div>
        <div class="grid2">
          <button class="menu-btn" id="retryBtn">Nochmal spielen</button>
          <button class="menu-btn" id="goMainBtn">Hauptmenü</button>
        </div>
      </div>
    </div>
  </div>
</div>

  const SKIN_META = {"football": [291, 432], "diver": [387, 477], "blue": [288, 416], "chef": [422, 452]};
  const WORLDS = {
    galaxy: {name:'Galaxie', paper:'#171b4b', grid:'#323985', green:'#7de13f', blue:'#876dff', brown:'#7e5b33', orange:'#ffd05a'},
    western:{name:'Western', paper:'#f6e7c7', grid:'#eddab3', green:'#b98946', blue:'#6aaed6', brown:'#8e5b2b', orange:'#ffb852'},

  };
  const SKINS = {
    football: {name:'Fußball', owned:true},
    diver: {name:'Taucher', owned:true},
    blue: {name:'Blau', owned:true},
    chef: {name:'Koch', owned:true}
  };

  const frame = document.getElementById('frame');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreSmallEl = document.getElementById('scoreSmall');
  const coinCountEl = document.getElementById('coinCount');
  const helpEl = document.getElementById('help');
  const tiltHintEl = document.getElementById('tiltHint');
  const modeBtn = document.getElementById('modeBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  const mainMenu = document.getElementById('mainMenu');
  const shopMenu = document.getElementById('shopMenu');
  const gameOverMenu = document.getElementById('gameOverMenu');
  const menuCoins = document.getElementById('menuCoins');
  const menuBest = document.getElementById('menuBest');
  const shopCoins = document.getElementById('shopCoins');
  const runCoins = document.getElementById('runCoins');
  const runScore = document.getElementById('runScore');
  const bestScore = document.getElementById('bestScore');
  const worldGrid = document.getElementById('worldGrid');
  const shopGrid = document.getElementById('shopGrid');
  const skinPreview = document.getElementById('skinPreview');

  const imgs = {};
  for (const [k,src] of Object.entries(SKIN_DATA)) {
    const im = new Image();
    im.src = src;
    imgs[k] = im;
  }

  const state = {
    dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
    viewW: 720, viewH: 1160,
    screen: 'main',
    gameState: 'idle',
    paused: false,
    controlMode: 'keyboard',
    camY: 0,
    bestY: 0,
    score: 0,
    coinsRun: 0,
    coinsTotal: 0,
    bestScore: 0,
    selectedWorld: 'galaxy',
    selectedSkin: 'football'
  };

  const input = {
    left:false,right:false,jump:false,shoot:false,
    tilt:0,tiltReady:false,tiltBaseline:null
  };

  const player = {x:0,y:0,vx:0,vy:0,w:50,h:56,facing:1,propeller:0,shootCd:0,anim:0};
  const platforms=[], monsters=[], bullets=[], enemyBullets=[], particles=[];

  function save() {
    localStorage.setItem('kueken_jump_final_save', JSON.stringify({
      coinsTotal: state.coinsTotal,
      bestScore: state.bestScore,
      selectedWorld: state.selectedWorld,
      selectedSkin: state.selectedSkin
    }));
  }
  function load() {
    try {
      const raw = localStorage.getItem('kueken_jump_final_save');
      if (!raw) return;
      const s = JSON.parse(raw);
      if (typeof s.coinsTotal === 'number') state.coinsTotal = s.coinsTotal;
      if (typeof s.bestScore === 'number') state.bestScore = s.bestScore;
      if (s.selectedWorld && WORLDS[s.selectedWorld]) state.selectedWorld = s.selectedWorld;
      if (s.selectedSkin && SKINS[s.selectedSkin]) state.selectedSkin = s.selectedSkin;
    } catch(e) {}
  }

  function resize() {
    const r = frame.getBoundingClientRect();
    canvas.width = Math.round(r.width * state.dpr);
    canvas.height = Math.round(r.height * state.dpr);
    state.viewW = r.width;
    state.viewH = r.height;
    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b) { return Math.random()*(b-a)+a; }
  function sy(y) { return y - state.camY; }
  function overlap(ax,ay,aw,ah,bx,by,bw,bh) {
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
  }

  function currentWorld() { return WORLDS[state.selectedWorld]; }

  function drawRoundRect(g,x,y,w,h,r,fill,stroke,line=3) {
    g.beginPath();
    g.moveTo(x+r,y);
    g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r);
    g.arcTo(x,y,x+w,y,r);
    if(fill) { g.fillStyle = fill; g.fill(); }
    if(stroke) { g.lineWidth=line; g.strokeStyle=stroke; g.stroke(); }
  }

  function updateUI() {
    scoreSmallEl.textContent = Math.floor(state.score);
    coinCountEl.textContent = state.coinsTotal + state.coinsRun;
    menuCoins.textContent = state.coinsTotal;
    menuBest.textContent = Math.floor(state.bestScore);
    shopCoins.textContent = state.coinsTotal;
    runCoins.textContent = state.coinsRun;
    runScore.textContent = Math.floor(state.score);
    bestScore.textContent = Math.floor(state.bestScore);
    modeBtn.textContent = state.controlMode === 'keyboard' ? '⌨️ Tastatur' : '📱 Handy/iPad';
    tiltHintEl.style.display = state.controlMode === 'tilt' ? 'block' : 'none';
  }

  function showScreen(name) {
    state.screen = name;
    mainMenu.classList.toggle('show', name==='main');
    shopMenu.classList.toggle('show', name==='shop');
    gameOverMenu.classList.toggle('show', name==='gameover');
    helpEl.style.display = name === 'none' ? 'block' : 'none';
  }

  function populateWorlds() {
    worldGrid.innerHTML = '';
    for (const [key,w] of Object.entries(WORLDS)) {
      const b = document.createElement('button');
      b.className = 'world-btn' + (state.selectedWorld===key ? ' active' : '');
      b.textContent = w.name;
      b.onclick = () => {
        state.selectedWorld = key;
        save();
        populateWorlds();
      };
      worldGrid.appendChild(b);
    }
  }

  function drawPreview() {
    skinPreview.innerHTML = '';
    const c = document.createElement('canvas');
    c.width = 180; c.height = 100;
    c.style.width = '180px'; c.style.height='100px';
    skinPreview.appendChild(c);
    const g = c.getContext('2d');
    g.clearRect(0,0,180,100);
    g.fillStyle = '#fafafa';
    g.fillRect(0,0,180,100);
    drawBird(g, 90, 56, state.selectedSkin, 1, false, 0);
  }

  function populateShop() {
    shopGrid.innerHTML = '';
    drawPreview();
    for (const [key,s] of Object.entries(SKINS)) {
      const btn = document.createElement('button');
      btn.className = 'skin-btn skin-card' + (state.selectedSkin===key ? ' active' : '');
      btn.innerHTML = `<img class="skin-thumb" src="${SKIN_DATA[key]}"><div>${s.name}</div><div class="small">gratis</div>`;
      btn.onclick = () => {
        state.selectedSkin = key;
        save();
        populateShop();
      };
      shopGrid.appendChild(btn);
    }
  }

  function addPlatform(x,y,type='green') {
    const p = {x,y,w:rand(88,132),h:26,type,vx:0,broken:false,hasSpring:false,hasProp:false,coin:false};
    if(type==='blue') p.vx = rand(44,68) * (Math.random()<.5 ? -1 : 1);
    if(type==='brown') p.w = rand(90,120);
    if(type==='green' && Math.random() < 0.08) p.hasSpring = true;
    if(type==='green' && Math.random() < 0.04) p.hasProp = true;
    if(Math.random() < 0.06) p.coin = true;
    platforms.push(p);
    return p;
  }

  function addMonster(y) {
    const base = platforms.find(p => Math.abs(p.y - y) < 60 && p.type !== 'brown');
    if(!base) return;
    monsters.push({
      x: base.x + base.w * 0.5,
      y: base.y - 28,
      w: 58, h: 46,
      vx: rand(18,34) * (Math.random()<.5 ? -1 : 1),
      shoot: rand(2.2,4.2)
    });
  }

  function generateInitial() {
    platforms.length = 0;
    monsters.length = 0;
    bullets.length = 0;
    enemyBullets.length = 0;
    particles.length = 0;
    let y = state.viewH - 100;
    addPlatform(state.viewW * .42, y, 'green');
    for(let i=1;i<26;i++) {
      y -= rand(92,118);
      const x = rand(18, state.viewW - 154);
      let type = 'green';
      const r = Math.random();
      if(i > 8 && r < 0.12) type = 'brown';
      else if(i > 11 && r < 0.22) type = 'blue';
      const p = addPlatform(x, y, type);
      if(i > 18 && Math.random() < 0.06) addMonster(p.y);
    }
  }

  function resetRun() {
    state.camY = 0;
    state.bestY = state.viewH - 160;
    state.score = 0;
    state.coinsRun = 0;
    state.paused = false;
    player.x = state.viewW * 0.5;
    player.y = state.viewH - 160;
    player.vx = 0;
    player.vy = -18;
    player.facing = 1;
    player.propeller = 0;
    player.shootCd = 0;
    player.anim = 0;
    generateInitial();
    updateUI();
  }

  function startRun() {
    resetRun();
    state.gameState = 'play';
    showScreen('none');
  }

  function finishRun() {
    state.gameState = 'over';
    state.coinsTotal += state.coinsRun;
    state.bestScore = Math.max(state.bestScore, state.score);
    save();
    updateUI();
    showScreen('gameover');
  }

  function die() {
    for(let i=0;i<14;i++) {
      particles.push({x:player.x,y:player.y,vx:rand(-2,2),vy:rand(-3,1),r:rand(2,4),life:rand(14,28),c:'#d8d8d8'});
    }
    finishRun();
  }

  function shoot() {
    if(player.shootCd > 0) return;
    player.shootCd = 10;
    bullets.push({x:player.x, y:player.y - player.h*0.55, vy:-13, r:4});
  }

  function bounce(power=18.5) { player.vy = -power; }

  function extendWorld() {
    let topY = Math.min(...platforms.map(p => p.y));
    while(topY > state.camY - 1300) {
      topY -= rand(90,118);
      const x = rand(18, state.viewW - 154);
      let type = 'green';
      const diff = Math.min(1, state.score / 3500);
      const r = Math.random();
      if(r < 0.12 + diff*0.08) type='brown';
      else if(r < 0.23 + diff*0.12) type='blue';
      const p = addPlatform(x, topY, type);
      if(state.score > 300 && Math.random() < 0.04 + diff*0.08) addMonster(p.y);
    }
    const killY = state.camY + state.viewH + 240;
    for(let i=platforms.length-1;i>=0;i--) if(platforms[i].y > killY || platforms[i].broken) platforms.splice(i,1);
    for(let i=monsters.length-1;i>=0;i--) if(monsters[i].y > killY) monsters.splice(i,1);
    for(let i=particles.length-1;i>=0;i--) if(particles[i].y > killY || particles[i].life<=0) particles.splice(i,1);
  }

  document.getElementById('playBtn').onclick = () => startRun();
  document.getElementById('retryBtn').onclick = () => startRun();
  document.getElementById('goMainBtn').onclick = () => {
    state.gameState = 'idle';
    updateUI();
    showScreen('main');
  };
  document.getElementById('openShopBtn').onclick = () => {
    populateShop();
    updateUI();
    showScreen('shop');
  };
  document.getElementById('closeShopBtn').onclick = () => {
    updateUI();
    showScreen('main');
  };

  pauseBtn.onclick = () => {
    if(state.screen === 'none') state.paused = !state.paused;
  };

  modeBtn.onclick = async () => {
    input.left = input.right = input.jump = input.shoot = false;
    input.tilt = 0;
    input.tiltBaseline = null;
    if(state.controlMode === 'keyboard') {
      state.controlMode = 'tilt';
      try {
        if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const res = await DeviceOrientationEvent.requestPermission();
          input.tiltReady = res === 'granted';
        } else {
          input.tiltReady = true;
        }
      } catch(e) {
        input.tiltReady = false;
      }
      helpEl.textContent = input.tiltReady
        ? '📱 Handy/iPad aktiv: Gerät gerade halten, dann links/rechts kippen. Antippen = springen + schießen.'
        : '📱 Bitte Bewegung/Ausrichtung im Browser erlauben und nochmal auf den Button tippen.';
    } else {
      state.controlMode = 'keyboard';
      input.tiltReady = false;
      helpEl.textContent = '⌨️ Tastatur aktiv: A/D oder ←/→ bewegen, W/↑ springen, Leertaste schießt.';
    }
    updateUI();
  };

  window.addEventListener('keydown', e => {
    if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code)) e.preventDefault();
    if(state.screen !== 'none') return;
    if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = true;
    if(e.code==='ArrowRight'||e.code==='KeyD') input.right = true;
    if(e.code==='ArrowUp'||e.code==='KeyW') input.jump = true;
    if(e.code==='Space') input.shoot = true;
    if(e.code==='KeyP') state.paused = !state.paused;
  });
  window.addEventListener('keyup', e => {
    if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = false;
    if(e.code==='ArrowRight'||e.code==='KeyD') input.right = false;
    if(e.code==='ArrowUp'||e.code==='KeyW') input.jump = false;
    if(e.code==='Space') input.shoot = false;
  });

  canvas.addEventListener('pointerdown', () => {
    if(state.screen !== 'none') return;
    if(state.controlMode === 'tilt') {
      input.jump = true;
      input.shoot = true;
      setTimeout(() => { input.jump = false; input.shoot = false; }, 140);
    }
  });

  window.addEventListener('deviceorientation', e => {
    if(state.controlMode !== 'tilt') return;
    const raw = typeof e.gamma === 'number' ? e.gamma : null;
    if(raw === null) return;
    if(input.tiltBaseline === null) input.tiltBaseline = raw;
    let delta = raw - input.tiltBaseline;
    if(screen.orientation && typeof screen.orientation.angle === 'number') {
      const a = screen.orientation.angle;
      if(a === 270 || a === -90) delta = -delta;
    }
    input.tilt = Math.max(-1, Math.min(1, delta / 16));
  });

  function tick() {
    if(state.paused || state.gameState !== 'play') return;

    if(input.shoot) shoot();
    if(player.shootCd > 0) player.shootCd--;
    player.anim += 1;

    let ax = 0;
    if(state.controlMode === 'tilt' && input.tiltReady) {
      ax = input.tilt;
    } else {
      if(input.left) ax -= 1;
      if(input.right) ax += 1;
    }

    if(ax > 0.05) player.facing = 1;
    else if(ax < -0.05) player.facing = -1;

    player.vx += ax * (player.propeller > 0 ? 0.68 : 0.5);
    player.vx *= 0.92;
    if(player.vx > 8.6) player.vx = 8.6;
    if(player.vx < -8.6) player.vx = -8.6;

    if(player.propeller > 0) {
      player.propeller--;
      player.vy = -11.5;
    } else {
      player.vy += 0.55;
      if(player.vy > 16) player.vy = 16;
    }

    const prevY = player.y;
    player.x += player.vx;
    player.y += player.vy;

    if(player.x < -30) player.x = state.viewW + 30;
    if(player.x > state.viewW + 30) player.x = -30;

    for(const p of platforms) {
      if(p.type==='blue') {
        p.x += p.vx * 0.12;
        if(p.x < 10 || p.x + p.w > state.viewW - 10) p.vx *= -1;
      }
    }

    if(player.vy > 0) {
      const px = player.x - player.w * 0.36;
      const pw = player.w * 0.72;
      for(const p of platforms) {
        const crossed = prevY + player.h*0.45 <= p.y && player.y + player.h*0.45 >= p.y;
        const onX = px + pw > p.x + 6 && px < p.x + p.w - 6;
        if(crossed && onX) {
          if(p.type==='brown') {
            if(!p.broken) {
              p.broken = true;
              for(let i=0;i<8;i++) particles.push({x:p.x+p.w/2,y:p.y,vx:rand(-2.5,2.5),vy:rand(-1.2,2.5),r:rand(2,5),life:rand(18,34),c:'#8a5d2a'});
            }
          } else {
            if(p.hasSpring) {
              p.hasSpring = false;
              bounce(30);
            } else {
              bounce(18.5);
            }
            if(p.hasProp) {
              p.hasProp = false;
              player.propeller = 125;
            }
            if(p.coin) {
              p.coin = false;
              state.coinsRun += 1;
            }
            break;
          }
        }
      }
    }

    for(const m of monsters) {
      m.x += m.vx * 0.08;
      if(m.x < 40 || m.x > state.viewW - 40) m.vx *= -1;
      m.shoot -= 1/60;
      const visible = sy(m.y) > -80 && sy(m.y) < state.viewH + 80;
      if(state.score > 900 && visible && m.shoot <= 0) {
        m.shoot = rand(2.4,4.2);
        enemyBullets.push({x:m.x,y:m.y,vy:rand(3.0,4.1),r:5});
      }
      if(overlap(player.x-player.w*.3, player.y-player.h*.45, player.w*.6, player.h*.82, m.x-m.w/2, m.y-m.h/2, m.w, m.h)) {
        die(); return;
      }
    }

    for(let i=bullets.length-1;i>=0;i--) {
      const b = bullets[i];
      b.y += b.vy;
      let hit = false;
      for(let j=monsters.length-1;j>=0;j--) {
        const m = monsters[j];
        if(overlap(b.x-b.r,b.y-b.r,b.r*2,b.r*2,m.x-m.w/2,m.y-m.h/2,m.w,m.h)) {
          bullets.splice(i,1);
          monsters.splice(j,1);
          hit = true;
          for(let k=0;k<12;k++) particles.push({x:m.x,y:m.y,vx:rand(-2.3,2.3),vy:rand(-2.3,2.3),r:rand(2,4),life:rand(18,30),c:'#4f8ecf'});
          break;
        }
      }
      if(!hit && b.y < state.camY - 80) bullets.splice(i,1);
    }

    for(let i=enemyBullets.length-1;i>=0;i--) {
      const b = enemyBullets[i];
      b.y += b.vy;
      if(overlap(player.x-player.w*.3, player.y-player.h*.45, player.w*.6, player.h*.82, b.x-b.r, b.y-b.r, b.r*2, b.r*2)) {
        die(); return;
      }
      if(b.y > state.camY + state.viewH + 60) enemyBullets.splice(i,1);
    }

    for(const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life--;
    }

    if(player.y < state.bestY) state.bestY = player.y;
    state.score = Math.max(0, ((state.viewH - 160) - state.bestY) * 0.52);

    const camTarget = Math.min(state.camY, player.y - state.viewH * 0.42);
    state.camY += (camTarget - state.camY) * 0.12;

    if(player.y > state.camY + state.viewH + 60) {
      die(); return;
    }

    extendWorld();
    updateUI();
  }

  function drawBackground() {
    const w = currentWorld();
    ctx.fillStyle = w.paper;
    ctx.fillRect(0,0,state.viewW,state.viewH);
    ctx.strokeStyle = w.grid;
    ctx.lineWidth = 1;
    for(let x=0;x<state.viewW;x+=20) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,state.viewH); ctx.stroke(); }
    for(let y=0;y<state.viewH;y+=20) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(state.viewW,y); ctx.stroke(); }

    if(state.selectedWorld === 'galaxy') {
      ctx.save();
      ctx.globalAlpha = 0.26;
      for(let i=0;i<40;i++) {
        const x = (i*83) % state.viewW;
        const y = (i*137 + Math.floor(state.camY*0.15)) % (state.viewH+80) - 40;
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(x,y,(i%3)+1.2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 0.08;
      ctx.fillStyle='#b8b4ff';
      for(let i=0;i<6;i++) {
        const y = ((i*180) + (state.camY*0.08 % 180));
        ctx.beginPath();
        ctx.arc((i*110)%state.viewW, y, 56, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    } else if(state.selectedWorld === 'western') {
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle='#cfb07c';
      for(let i=0;i<5;i++) {
        const bx = 18 + i*120;
        const by = 90 + (i%2)*180;
        ctx.fillRect(bx,by,46,28);
        ctx.fillStyle='#b8965a';
        ctx.fillRect(bx+4,by+4,38,20);
        ctx.strokeStyle='#8b6a37';
        ctx.lineWidth=2;
        for(let k=1;k<4;k++) {
          ctx.beginPath();
          ctx.moveTo(bx+k*10,by);
          ctx.lineTo(bx+k*10,by+28);
          ctx.stroke();
        }
        ctx.fillStyle='#cfb07c';
      }
      ctx.restore();
    } else if(state.selectedWorld === 'football') {
      ctx.save();
      ctx.globalAlpha = 0.14;
      ctx.strokeStyle='#1f7a1f';
      ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(state.viewW*0.5,0); ctx.lineTo(state.viewW*0.5,state.viewH); ctx.stroke();
      ctx.beginPath(); ctx.arc(state.viewW*0.5,state.viewH*0.5,60,0,Math.PI*2); ctx.stroke();
      const goalY = 120 + ((state.camY * 0.18) % 320);
      ctx.strokeStyle='#bfc7d1';
      ctx.lineWidth=3;
      ctx.strokeRect(state.viewW - 92, goalY, 54, 38);
      ctx.fillStyle='#ffffff22';
      ctx.fillRect(state.viewW - 92, goalY, 54, 38);
      ctx.restore();
    } else if(state.selectedWorld === 'ice') {
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle='#d8f6ff';
      for(let i=0;i<7;i++) {
        const x = 40 + i*90;
        const y = 120 + (i%3)*180;
        ctx.beginPath();
        ctx.moveTo(x,y); ctx.lineTo(x+16,y+34); ctx.lineTo(x-16,y+34);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawCoin(x,y) {
    ctx.fillStyle='#ffcc3c';
    ctx.strokeStyle='#111';
    ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f8e69c';
    ctx.beginPath(); ctx.arc(x-2,y-2,3,0,Math.PI*2); ctx.fill();
  }

  function drawPlatform(p) {
    const w = currentWorld();
    const y = sy(p.y);
    if(y < -80 || y > state.viewH + 80) return;

    if(p.type === 'brown') {
      drawRoundRect(ctx,p.x,y,p.w/2-6,24,14,w.brown,'#111');
      drawRoundRect(ctx,p.x+p.w/2+6,y,p.w/2-6,24,14,w.brown,'#111');
      ctx.strokeStyle='#fff';
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(p.x+p.w/2-4,y+3); ctx.lineTo(p.x+p.w/2-8,y+9); ctx.lineTo(p.x+p.w/2-2,y+15); ctx.lineTo(p.x+p.w/2-6,y+21);
      ctx.moveTo(p.x+p.w/2+4,y+3); ctx.lineTo(p.x+p.w/2+8,y+9); ctx.lineTo(p.x+p.w/2+2,y+15); ctx.lineTo(p.x+p.w/2+6,y+21);
      ctx.stroke();
    } else {
      drawRoundRect(ctx,p.x,y,p.w,26,14,p.type==='blue' ? w.blue : w.green,'#111');
    }

    if(p.hasSpring) {
      const cx = p.x + p.w/2;
      ctx.strokeStyle='#111'; ctx.lineWidth=3;
      ctx.beginPath();
      for(let i=0;i<5;i++) {
        const yy = y - 1 - i*5;
        ctx.moveTo(cx-13,yy);
        ctx.quadraticCurveTo(cx,yy-4,cx+13,yy);
      }
      ctx.stroke();
    }
    if(p.hasProp) {
      const cx = p.x + p.w/2, cy = y - 23;
      ctx.fillStyle='#ef5b37'; ctx.strokeStyle='#111'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#eee'; ctx.fillRect(cx-14,cy-3,28,6); ctx.strokeRect(cx-14,cy-3,28,6);
    }
    if(p.coin) drawCoin(p.x+p.w/2, y-18);
  }

  function drawMonster(m) {
    const y = sy(m.y);
    if(y < -100 || y > state.viewH + 100) return;
    ctx.save();
    ctx.translate(m.x, y);
    ctx.fillStyle='#9a6a32'; ctx.strokeStyle='#111'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(-18,20); ctx.bezierCurveTo(-34,8,-30,-22,-10,-28);
    ctx.bezierCurveTo(6,-34,26,-22,24,6); ctx.bezierCurveTo(22,20,10,24,-6,24); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f4c8d6';
    ctx.beginPath(); ctx.arc(-10,-2,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-9,-2,2.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4,14); ctx.lineTo(8,12); ctx.lineTo(13,17); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,24); ctx.lineTo(-8,34); ctx.moveTo(4,24); ctx.lineTo(5,34); ctx.stroke();
    ctx.restore();
  }

  function drawBird(g, x, y, skinKey, facing, shadow=true, propeller=0) {
    const img = imgs[skinKey];
    g.save();
    g.translate(x, y);
    const bob = Math.sin((player.anim || 0) * 0.13) * 1.8;
    const tilt = Math.max(-0.10, Math.min(0.10, player.vx * 0.015));
    g.translate(0, bob);
    g.rotate(tilt);
    if(facing < 0) g.scale(-1,1);

    if(shadow) {
      g.save();
      g.globalAlpha = 0.16;
      g.fillStyle = '#000';
      g.beginPath();
      g.ellipse(0, 26, 22, 7, 0, 0, Math.PI*2);
      g.fill();
      g.restore();
    }

    if(propeller > 0) {
      g.strokeStyle='#111';
      g.lineWidth=3;
      g.beginPath(); g.moveTo(0,-36); g.lineTo(0,-50); g.stroke();
      const r = performance.now()*0.03;
      g.save(); g.translate(0,-50); g.rotate(r);
      g.beginPath(); g.moveTo(-22,0); g.lineTo(22,0); g.moveTo(0,-4); g.lineTo(0,4); g.stroke();
      g.restore();
    }

    if(img.complete && img.naturalWidth > 0) {
      const drawW = 74;
      const drawH = drawW * (img.naturalHeight / img.naturalWidth);
      g.drawImage(img, -drawW/2, -drawH/2 + 1, drawW, drawH);
    } else {
      g.fillStyle = '#ffd93b';
      g.beginPath(); g.arc(0,0,20,0,Math.PI*2); g.fill();
    }
    g.restore();
  }

  function drawBullets() {
    for(const b of bullets) {
      const y = sy(b.y);
      if(y < -20 || y > state.viewH + 20) continue;
      ctx.fillStyle='#fff8ef';
      ctx.strokeStyle='#111';
      ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(b.x,y,4.2,5.6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    for(const b of enemyBullets) {
      const y = sy(b.y);
      if(y < -20 || y > state.viewH + 20) continue;
      ctx.fillStyle='#fff8ef';
      ctx.strokeStyle='#e84b37';
      ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(b.x,y,4.2,5.6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
  }

  function drawParticles() {
    for(const p of particles) {
      const y = sy(p.y);
      ctx.globalAlpha = Math.max(0, p.life/30);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x,y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBigScore() {
    ctx.fillStyle='#111';
    ctx.font='900 92px Arial';
    ctx.textAlign='center';
    ctx.fillText(String(Math.floor(state.score)), state.viewW*0.5, 128);
  }

  function render() {
    ctx.clearRect(0,0,state.viewW,state.viewH);
    drawBackground();
    for(const p of platforms) drawPlatform(p);
    for(const m of monsters) drawMonster(m);
    drawParticles();
    drawBullets();
    drawBird(ctx, player.x, sy(player.y)-2, state.selectedSkin, player.facing, true, player.propeller);
    drawBigScore();

    if(state.paused && state.screen==='none') {
      ctx.fillStyle='rgba(0,0,0,.15)';
      ctx.fillRect(0,0,state.viewW,state.viewH);
      ctx.fillStyle='#111';
      ctx.font='700 48px Arial';
      ctx.textAlign='center';
      ctx.fillText('Pause', state.viewW/2, state.viewH/2);
    }
  }

  load();
  populateWorlds();
  populateShop();
  updateUI();
  showScreen('main');

  let acc = 0, last = performance.now();
  function loop(now) {
    const dt = Math.min(33, now-last);
    last = now;
    acc += dt;
    while(acc >= 1000/60) {
      tick();
      acc -= 1000/60;
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
