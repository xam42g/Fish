<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spanisch Memory - Bild & Wort</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#102033;--muted:#64748b;--accent:#2563eb;--good:#16a34a;--bad:#dc2626;--shadow:0 12px 30px rgba(15,23,42,.12)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8fafc);color:var(--ink);min-height:100vh}.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 40px}header{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:18px}.title h1{margin:0;font-size:clamp(26px,4vw,44px);letter-spacing:-.04em}.title p{margin:7px 0 0;color:var(--muted)}.panel{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.78);border:1px solid rgba(148,163,184,.35);border-radius:22px;padding:12px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.stat{padding:10px 14px;border-radius:16px;background:#fff;border:1px solid #e2e8f0;font-weight:800}.stat span{color:var(--accent)}button{border:0;border-radius:16px;background:var(--accent);color:white;font-weight:900;padding:12px 16px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.24)}button:hover{filter:brightness(.96)}.game{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px}.card{height:154px;perspective:900px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.card.open .inner,.card.done .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);border:1px solid rgba(148,163,184,.32);overflow:hidden}.back{background:radial-gradient(circle at 20% 20%,#60a5fa,#1d4ed8 55%,#172554);color:white;font-size:44px;font-weight:1000}.back:after{content:'Español';position:absolute;bottom:14px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}.front{background:#fff;transform:rotateY(180deg);padding:12px}.word{font-size:clamp(18px,2vw,25px);font-weight:1000;text-align:center;color:#111827;line-height:1.12}.pic{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(#f8fafc,#eef2ff)}.pic svg{width:112px;height:112px}.done .face{border-color:rgba(22,163,74,.55)}.toast{margin:16px 0;color:var(--muted);font-weight:700}.small{font-size:12px;color:var(--muted);margin-top:16px;text-align:center}@media(max-width:520px){.card{height:132px}.game{grid-template-columns:repeat(3,1fr);gap:10px}header{display:block}.panel{margin-top:14px}.pic svg{width:90px;height:90px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="title"><h1>Spanisch Memory</h1><p>Finde immer das passende Paar: schönes Bild + spanisches Wort.</p></div><div class="panel"><div class="stat">Züge: <span id="moves">0</span></div><div class="stat">Paare: <span id="pairs">0</span>/<span id="total">0</span></div><div class="stat">Zeit: <span id="time">00:00</span></div><button onclick="newGame()">Neu mischen</button></div></header>
<div class="toast" id="msg">Klicke zwei Karten an.</div><main class="game" id="game"></main><div class="small">Alle Bilder sind direkt in der HTML-Datei als farbige SVG-Illustrationen eingebaut. Kein Internet nötig.</div></div>

'rizado':`<svg viewBox="0 0 120 120"><circle cx="60" cy="61" r="29" fill="#ffd7a3"/><g fill="#3b2416"><circle cx="34" cy="43" r="13"/><circle cx="47" cy="28" r="13"/><circle cx="65" cy="25" r="14"/><circle cx="82" cy="38" r="13"/><circle cx="91" cy="56" r="12"/><circle cx="28" cy="59" r="12"/></g><circle cx="49" cy="63" r="4"/><circle cx="71" cy="63" r="4"/><path d="M50 78c7 6 14 6 21 0" stroke="#92400e" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
'modelo':`<svg viewBox="0 0 120 120"><path d="M23 105h74" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="24" r="13" fill="#ffd7a3"/><path d="M43 46c8-12 26-12 34 0l-8 38H51z" fill="#ec4899"/><path d="M44 48l-21 18M76 48l21 18M52 84l-17 21M68 84l17 21" stroke="#334155" stroke-width="6" stroke-linecap="round"/><path d="M47 22c5-15 23-15 28 0-10-4-18-4-28 0z" fill="#111827"/><path d="M32 105c18 9 38 9 56 0" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/></svg>`,
'describir':`<svg viewBox="0 0 120 120"><rect x="26" y="17" width="58" height="78" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="5"/><path d="M38 39h34M38 53h34M38 67h22" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><path d="M77 80l24-24 9 9-24 24-14 5z" fill="#f59e0b"/><path d="M101 56l5-5a5 5 0 0 1 7 7l-4 7z" fill="#334155"/></svg>`,

};
const vocab=[
{key:'nino',word:'el niño / la niña'}, {key:'bajo',word:'bajo / baja'}, {key:'delgado',word:'delgado / delgada'}, {key:'pelo',word:'el pelo'}, {key:'largo',word:'largo / larga'}, {key:'castano',word:'castaño / castaña'}, {key:'rubio',word:'rubio / rubia'}, {key:'ojo',word:'el ojo'}, {key:'pelirrojo',word:'pelirrojo / pelirroja'}, {key:'liso',word:'liso / lisa'}, {key:'nadar',word:'nadar'}, {key:'alto',word:'alto / alta'}, {key:'gafas',word:'las gafas'}, {key:'rizado',word:'rizado / rizada'}, {key:'modelo',word:'el modelo / la modelo'}, {key:'describir',word:'describir'}, {key:'estatura',word:'la estatura'}, {key:'claro',word:'claro / clara'}, {key:'tatuaje',word:'el tatuaje'}, {key:'piercing',word:'el piercing'}, {key:'nariz',word:'la nariz'}, {key:'aspecto',word:'el aspecto físico'}
];
let first=null, second=null, lock=false, moves=0, pairs=0, started=false, timer=null, seconds=0;
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function formatTime(s){const m=String(Math.floor(s/60)).padStart(2,'0'); const r=String(s%60).padStart(2,'0'); return `${m}:${r}`}
function startTimer(){if(started)return; started=true; timer=setInterval(()=>{seconds++; document.getElementById('time').textContent=formatTime(seconds)},1000)}
function newGame(){clearInterval(timer); first=second=null; lock=false; moves=0; pairs=0; seconds=0; started=false; document.getElementById('moves').textContent=0; document.getElementById('pairs').textContent=0; document.getElementById('time').textContent='00:00'; document.getElementById('total').textContent=vocab.length; document.getElementById('msg').textContent='Klicke zwei Karten an.'; const cards=[]; vocab.forEach(v=>{cards.push({...v,type:'pic'}); cards.push({...v,type:'word'});}); const game=document.getElementById('game'); game.innerHTML=''; shuffle(cards).forEach((c,i)=>{const el=document.createElement('div'); el.className='card'; el.dataset.key=c.key; el.dataset.type=c.type; el.innerHTML=`<div class="inner"><div class="face back">?</div><div class="face front">${c.type==='pic'?`<div class="pic" aria-label="Bildkarte">${icons[c.key]}</div>`:`<div class="word">${c.word}</div>`}</div></div>`; el.onclick=()=>flip(el); game.appendChild(el);});}
function flip(card){if(lock || card.classList.contains('open') || card.classList.contains('done'))return; startTimer(); card.classList.add('open'); if(!first){first=card; return;} second=card; moves++; document.getElementById('moves').textContent=moves; const ok=first.dataset.key===second.dataset.key && first.dataset.type!==second.dataset.type; if(ok){first.classList.add('done'); second.classList.add('done'); first=null; second=null; pairs++; document.getElementById('pairs').textContent=pairs; document.getElementById('msg').textContent='Richtig!'; if(pairs===vocab.length){clearInterval(timer); document.getElementById('msg').textContent=`Fertig! Du hast ${moves} Züge gebraucht.`}} else {lock=true; document.getElementById('msg').textContent='Noch nicht richtig.'; setTimeout(()=>{first.classList.remove('open'); second.classList.remove('open'); first=null; second=null; lock=false; document.getElementById('msg').textContent='Versuch es weiter.'},850)}}
newGame();
</script>
</body>
</html>
