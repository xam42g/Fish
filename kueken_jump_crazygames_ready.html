<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Küken Jump Prototype</title>
<style>
  :root{
    --bg:#0a0a0a;
    --paper:#f7f7f5;
    --grid:#ececeb;
    --green:#71c70f;
    --blue:#1f95cf;
    --brown:#9a6a32;
    --yellow:#f1df2a;
    --orange:#ffb436;
    --ui:#f4ecd6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,Arial,sans-serif}
  body{display:grid;place-items:center}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .frame{
    position:relative;
    width:min(100vw, calc(100vh * .62));
    height:min(100vh, calc(100vw / .62));
    border-radius:min(4.5vw, 34px);
    overflow:hidden;
    background:#111;
    box-shadow:0 0 0 2px rgba(255,255,255,.03);
  }
  canvas{display:block;width:100%;height:100%}
  .hudLayer,.touchLayer{position:absolute;inset:0;pointer-events:none}
  .touchLayer{display:none}
  .pause{
    position:absolute;left:18px;top:18px;width:56px;height:56px;border-radius:50%;
    background:rgba(244,236,214,.98);border:3px solid rgba(0,0,0,.08);display:grid;place-items:center;
    font-weight:900;font-size:28px;color:#111;box-shadow:0 2px 0 rgba(0,0,0,.08);pointer-events:auto;cursor:pointer;
  }
  .pause:before{content:"II";letter-spacing:-3px;transform:translateX(-2px)}
  .overlay{
    position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
    background:rgba(255,255,255,.93);color:#111;border:3px solid #111;border-radius:20px;
    padding:14px 18px;max-width:min(92%, 480px);text-align:center;pointer-events:none;
    box-shadow:0 8px 26px rgba(0,0,0,.18)
  }
  .overlay h1{margin:0 0 6px;font-size:28px;line-height:1}
  .overlay p{margin:0;font-size:14px;line-height:1.35}
  .pill{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    background:var(--ui);border-radius:18px;padding:6px 18px;font-size:18px;font-weight:900;color:#111;
    box-shadow:0 2px 0 rgba(0,0,0,.08)
  }
  .stars{
    position:absolute;top:18px;right:18px;min-width:100px;height:56px;border-radius:20px;background:var(--orange);
    box-shadow:0 2px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:28px;font-weight:900;color:#111
  }
  .stars span:last-child{font-size:26px}
  .touchLeft,.touchRight,.touchJump,.touchShoot{
    position:absolute;pointer-events:auto;opacity:0;
  }
  .touchLeft{left:0;bottom:0;width:34%;height:24%}
  .touchRight{left:34%;bottom:0;width:34%;height:24%}
  .touchJump{right:0;bottom:0;width:20%;height:24%}
  .touchShoot{right:20%;bottom:0;width:12%;height:24%}
  @media (hover:none), (pointer:coarse){
    .touchLayer{display:block}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame" id="frame">
    <canvas id="game" width="720" height="1160"></canvas>

    <div class="hudLayer">
      <div class="pause" id="pauseBtn"></div>
      <div class="pill" id="smallScore">0</div>
      <div class="stars"><span id="starCount">0</span><span>⭐</span></div>
      <div class="overlay" id="overlay">
        <h1>Küken Jump</h1>
        <p>Leertaste / W / ↑ oder Tap zum Springen. A/D oder ←/→ bewegen. Shift schießt nach oben. Reine HTML-Datei, passend als Grundlage für Web-Upload.</p>
      </div>
    </div>

    <div class="touchLayer">
      <div class="touchLeft" id="touchLeft"></div>
      <div class="touchRight" id="touchRight"></div>
      <div class="touchJump" id="touchJump"></div>
      <div class="touchShoot" id="touchShoot"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');
  const overlay = document.getElementById('overlay');
  const smallScoreEl = document.getElementById('smallScore');
  const starCountEl = document.getElementById('starCount');
  const pauseBtn = document.getElementById('pauseBtn');

  let W = 720, H = 1160;
  let DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

  function resize(){
    const rect = frame.getBoundingClientRect();
    canvas.width = Math.round(rect.width * DPR);
    canvas.height = Math.round(rect.height * DPR);
    W = canvas.width;
    H = canvas.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(DPR, DPR);
    world.viewW = rect.width;
    world.viewH = rect.height;
  }
  const world = { viewW:720, viewH:1160, camY:0, bestY:0, score:0, stars:0, state:'intro', paused:false };
  resize();
  addEventListener('resize', resize);

  const input = { left:false, right:false, jump:false, shoot:false, jumpTap:false, shootTap:false };

  const player = {
    x: world.viewW * 0.5,
    y: world.viewH - 160,
    vx: 0,
    vy: -18,
    w: 52,
    h: 62,
    facing: 1,
    propeller: 0,
    shootCd: 0,
    invuln: 0
  };

  const platforms = [];
  const monsters = [];
  const bullets = [];
  const enemyBullets = [];
  const stars = [];
  const particles = [];
  const names = ["doodler-967","Bibi***y1509","HeatSeekingWr","DroopyDefenda","MeduzaTomaa4","JossAlf25","HolyBridge","being_sv","Sedusza","doodler-812"];

  function rand(a,b){ return Math.random()*(b-a)+a; }
  function irand(a,b){ return Math.floor(rand(a,b+1)); }

  function addPlatform(x,y,type='green'){
    const p = {x,y,w:rand(92,136),h:30,type,vx:0,broken:false,hasSpring:false,hasProp:false,star:false};
    if(type==='blue') p.vx = rand(42,68) * (Math.random()<.5?-1:1);
    if(type==='brown') p.w = rand(92,124);
    if(type==='green' && Math.random()<0.08) p.hasSpring = true;
    if(type==='green' && Math.random()<0.04) p.hasProp = true;
    if(Math.random()<0.05) p.star = true;
    platforms.push(p);
    return p;
  }

  function addMonster(y){
    const base = platforms.find(p => Math.abs(p.y - y) < 70 && p.type !== 'brown');
    if(!base) return;
    monsters.push({
      x: base.x + base.w * 0.5,
      y: base.y - 28,
      w: 76,
      h: 62,
      vx: rand(18,36) * (Math.random()<.5?-1:1),
      shoot: rand(1.8, 3.3)
    });
  }

  function generateInitial(){
    platforms.length = 0; monsters.length = 0; bullets.length = 0; enemyBullets.length = 0; stars.length = 0; particles.length = 0;
    const gap = 104;
    let y = world.viewH - 90;
    addPlatform(world.viewW * .42, y, 'green');
    for(let i=1;i<26;i++){
      y -= gap + rand(-12, 16);
      const x = rand(26, world.viewW - 160);
      let type = 'green';
      const r = Math.random();
      if(i > 7 && r < 0.12) type = 'brown';
      else if(i > 10 && r < 0.22) type = 'blue';
      const p = addPlatform(x, y, type);
      if(i > 16 && Math.random() < 0.08) addMonster(p.y);
    }
  }

  function extendWorld(){
    let topY = Math.min(...platforms.map(p => p.y));
    while(topY > world.camY - 1300){
      topY -= rand(88, 118);
      const x = rand(18, world.viewW - 158);
      let type = 'green';
      const diff = Math.min(1, world.score / 3500);
      const r = Math.random();
      if(r < 0.12 + diff * 0.08) type = 'brown';
      else if(r < 0.23 + diff * 0.12) type = 'blue';
      const p = addPlatform(x, topY, type);
      if(world.score > 260 && Math.random() < 0.06 + diff * 0.16) addMonster(p.y);
    }
    const killY = world.camY + world.viewH + 220;
    for(let i=platforms.length-1;i>=0;i--) if(platforms[i].y > killY) platforms.splice(i,1);
    for(let i=monsters.length-1;i>=0;i--) if(monsters[i].y > killY) monsters.splice(i,1);
    for(let i=stars.length-1;i>=0;i--) if(stars[i].y > killY) stars.splice(i,1);
    for(let i=particles.length-1;i>=0;i--) if(particles[i].y > killY || particles[i].life<=0) particles.splice(i,1);
  }

  function reset(){
    world.camY = 0; world.bestY = player.y; world.score = 0; world.stars = 0; world.state = 'intro'; world.paused = false;
    player.x = world.viewW * 0.5; player.y = world.viewH - 160; player.vx = 0; player.vy = -18; player.propeller = 0; player.shootCd = 0; player.invuln = 0;
    generateInitial();
    updateUI();
    overlay.style.display = 'block';
  }
  reset();

  function updateUI(){
    const s = Math.max(0, Math.floor(world.score));
    smallScoreEl.textContent = s;
    starCountEl.textContent = world.stars;
  }

  function bounce(power=19){ player.vy = -power; }
  function die(){
    for(let i=0;i<18;i++) particles.push({x:player.x,y:player.y,vx:rand(-2,2),vy:rand(-3,1),r:rand(2,4),life:rand(18,32),c:'#dcdcdc'});
    reset();
  }

  function shoot(){
    if(player.shootCd > 0) return;
    player.shootCd = 10;
    bullets.push({x:player.x + player.facing * 8, y:player.y - player.h*.55, vy:-13, r:5});
  }

  function pressSide(which, down){
    input[which] = down;
    if(down && world.state==='intro'){ world.state='play'; overlay.style.display='none'; }
  }

  addEventListener('keydown', e => {
    if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW','ShiftLeft','ShiftRight'].includes(e.code)) e.preventDefault();
    if(world.state==='intro'){ world.state='play'; overlay.style.display='none'; }
    if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = true;
    if(e.code==='ArrowRight'||e.code==='KeyD') input.right = true;
    if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') input.jump = true;
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') input.shoot = true;
    if(e.code==='KeyP') world.paused = !world.paused;
  });
  addEventListener('keyup', e => {
    if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = false;
    if(e.code==='ArrowRight'||e.code==='KeyD') input.right = false;
    if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') input.jump = false;
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') input.shoot = false;
  });
  pauseBtn.addEventListener('click', ()=> world.paused = !world.paused);

  function bindTouch(id, prop, tapOnly=false){
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); if(world.state==='intro'){ world.state='play'; overlay.style.display='none'; } tapOnly ? input[prop+'Tap']=true : input[prop]=true; };
    const off = e => { e.preventDefault(); if(!tapOnly) input[prop]=false; };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  }
  bindTouch('touchLeft','left');
  bindTouch('touchRight','right');
  bindTouch('touchJump','jump');
  bindTouch('touchShoot','shoot');

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
  }

  function tick(){
    if(world.paused) return;

    if(input.shoot) shoot();
    if(player.shootCd>0) player.shootCd--;

    let ax = 0;
    if(input.left) ax -= 1;
    if(input.right) ax += 1;
    if(ax) player.facing = ax;
    player.vx += ax * (player.propeller>0 ? 0.65 : 0.5);
    player.vx *= 0.92;
    if(player.vx > 8.5) player.vx = 8.5;
    if(player.vx < -8.5) player.vx = -8.5;

    if(player.propeller > 0){
      player.propeller--;
      player.vy = -11.5;
    }else{
      player.vy += 0.55;
      if(player.vy > 16) player.vy = 16;
    }

    const prevY = player.y;
    player.x += player.vx;
    player.y += player.vy;

    if(player.x < -30) player.x = world.viewW + 30;
    if(player.x > world.viewW + 30) player.x = -30;

    for(const p of platforms){
      if(p.type==='blue'){
        p.x += p.vx * 0.12;
        if(p.x < 10 || p.x + p.w > world.viewW - 10) p.vx *= -1;
      }
    }

    if(player.vy > 0){
      const px = player.x - player.w*.33;
      const pw = player.w*.66;
      for(const p of platforms){
        const crossed = prevY + player.h*.45 <= p.y && player.y + player.h*.45 >= p.y;
        const onX = px + pw > p.x + 8 && px < p.x + p.w - 8;
        if(crossed && onX){
          if(p.type==='brown'){
            if(!p.broken){
              p.broken = true;
              for(let i=0;i<8;i++) particles.push({x:p.x+p.w/2,y:p.y,vx:rand(-2.5,2.5),vy:rand(-1.2,2.5),r:rand(2,5),life:rand(18,36),c:'#8a5d2a'});
            }
          }else{
            if(p.hasSpring){
              p.hasSpring = false;
              bounce(30);
            }else{
              bounce(18.5);
            }
            if(p.hasProp){
              p.hasProp = false;
              player.propeller = 125;
            }
            if(p.star){
              p.star = false;
              world.stars++;
            }
            break;
          }
        }
      }
    }

    for(let i=platforms.length-1;i>=0;i--) if(platforms[i].broken) platforms.splice(i,1);

    for(const m of monsters){
      m.x += m.vx * 0.08;
      if(m.x < 50 || m.x > world.viewW - 50) m.vx *= -1;
      m.shoot -= 1/60;
      if(world.score > 700 && m.shoot <= 0){
        m.shoot = rand(1.3, 2.4);
        enemyBullets.push({x:m.x, y:m.y, vy:rand(4.2,5.7), r:6});
      }
      if(rectsOverlap(player.x-player.w*.28, player.y-player.h*.45, player.w*.56, player.h*.8, m.x-m.w/2, m.y-m.h/2, m.w, m.h) && player.invuln<=0){
        die(); return;
      }
    }

    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.y += b.vy;
      let hit = false;
      for(let j=monsters.length-1;j>=0;j--){
        const m = monsters[j];
        if(rectsOverlap(b.x-b.r,b.y-b.r,b.r*2,b.r*2,m.x-m.w/2,m.y-m.h/2,m.w,m.h)){
          bullets.splice(i,1); monsters.splice(j,1); hit = true;
          for(let k=0;k<14;k++) particles.push({x:m.x,y:m.y,vx:rand(-2.5,2.5),vy:rand(-2.5,2.5),r:rand(2,5),life:rand(18,32),c:'#4e8ccf'});
          break;
        }
      }
      if(!hit && b.y < world.camY - 80) bullets.splice(i,1);
    }

    for(let i=enemyBullets.length-1;i>=0;i--){
      const b = enemyBullets[i];
      b.y += b.vy;
      if(rectsOverlap(player.x-player.w*.28, player.y-player.h*.45, player.w*.56, player.h*.8, b.x-b.r, b.y-b.r, b.r*2, b.r*2) && player.invuln<=0){
        die(); return;
      }
      if(b.y > world.camY + world.viewH + 60) enemyBullets.splice(i,1);
    }

    for(const p of particles){
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--;
    }

    if(player.y < world.bestY) world.bestY = player.y;
    world.score = Math.max(0, ((world.viewH - 160) - world.bestY) * 0.52);

    const camTarget = Math.min(world.camY, player.y - world.viewH * 0.42);
    world.camY += (camTarget - world.camY) * 0.12;

    if(player.y > world.camY + world.viewH + 60){ die(); return; }

    extendWorld();
    updateUI();
  }

  function drawRoundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    if(fill){ ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){ ctx.lineWidth=3; ctx.strokeStyle=stroke; ctx.stroke(); }
  }

  function drawBackground(){
    const vw = world.viewW, vh = world.viewH;
    ctx.fillStyle = '#f7f7f5';
    ctx.fillRect(0,0,vw,vh);
    ctx.strokeStyle = '#ececeb';
    ctx.lineWidth = 1;
    for(let x=0;x<vw;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,vh); ctx.stroke(); }
    for(let y=0;y<vh;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(vw,y); ctx.stroke(); }
  }

  function sy(y){ return y - world.camY; }

  function drawPlatform(p){
    const y = sy(p.y);
    if(y < -80 || y > world.viewH + 80) return;
    if(p.type==='brown'){
      drawRoundRect(p.x,y,p.w/2-6,28,16,'#9a6a32','#111');
      drawRoundRect(p.x+p.w/2+6,y,p.w/2-6,28,16,'#9a6a32','#111');
      ctx.strokeStyle='#fff'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(p.x+p.w/2-4,y+4); ctx.lineTo(p.x+p.w/2-8,y+12); ctx.lineTo(p.x+p.w/2-2,y+18); ctx.lineTo(p.x+p.w/2-7,y+24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x+p.w/2+4,y+4); ctx.lineTo(p.x+p.w/2+8,y+12); ctx.lineTo(p.x+p.w/2+2,y+18); ctx.lineTo(p.x+p.w/2+7,y+24); ctx.stroke();
    }else{
      const fill = p.type==='blue' ? '#1f95cf' : '#71c70f';
      drawRoundRect(p.x,y,p.w,30,16,fill,'#111');
    }
    if(p.hasSpring){
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      let cx = p.x + p.w/2;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const yy = y - 2 - i*6;
        ctx.moveTo(cx-14,yy);
        ctx.quadraticCurveTo(cx,yy-5,cx+14,yy);
      }
      ctx.stroke();
    }
    if(p.hasProp){
      const cx = p.x + p.w/2, cy = y - 28;
      ctx.fillStyle='#ed4e2d'; ctx.strokeStyle='#111'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(cx,cy,12,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#eee'; ctx.fillRect(cx-16,cy-4,32,8); ctx.strokeRect(cx-16,cy-4,32,8);
    }
    if(p.star){
      const cx = p.x + p.w/2, cy = y - 26;
      drawStar(cx,cy,14,'#ffd84d','#111');
    }
  }

  function drawStar(x,y,r,fill,stroke){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i * Math.PI*2/5;
      const a2 = a + Math.PI/5;
      const x1 = x + Math.cos(a) * r;
      const y1 = y + Math.sin(a) * r;
      const x2 = x + Math.cos(a2) * r*0.45;
      const y2 = y + Math.sin(a2) * r*0.45;
      if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
      ctx.lineTo(x2,y2);
    }
    ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle=stroke; ctx.stroke();
  }

  function drawMonster(m){
    const y = sy(m.y);
    if(y < -120 || y > world.viewH + 120) return;
    ctx.save();
    ctx.translate(m.x, y);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#111';
    ctx.fillStyle = '#9a6a32';
    ctx.beginPath();
    ctx.moveTo(-22,24); ctx.quadraticCurveTo(-42,8,-34,-20); ctx.quadraticCurveTo(-30,-34,-18,-30);
    ctx.quadraticCurveTo(-4,-42,16,-28); ctx.quadraticCurveTo(32,-14,28,12); ctx.quadraticCurveTo(20,26,0,28); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f2c7d0'; ctx.beginPath(); ctx.arc(-14,-2,11,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-13,-2,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2,14); ctx.lineTo(8,12); ctx.lineTo(14,18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,28); ctx.lineTo(-8,38); ctx.moveTo(4,28); ctx.lineTo(6,38); ctx.stroke();
    for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(-24+i*8,-24+((i%2)*3)); ctx.lineTo(-20+i*8,-30-((i%3)*2)); ctx.stroke(); }
    ctx.restore();
  }

  function drawPlayer(){
    const x = player.x, y = sy(player.y);
    ctx.save();
    ctx.translate(x,y);
    if(player.facing < 0) ctx.scale(-1,1);

    if(player.propeller > 0){
      ctx.fillStyle='#ef5b37'; ctx.strokeStyle='#111'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(-8,-42); ctx.lineTo(0,-52); ctx.lineTo(8,-42); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(0,-50); ctx.stroke();
      const r = performance.now()*0.02;
      ctx.save(); ctx.translate(0,-54); ctx.rotate(r);
      ctx.beginPath(); ctx.moveTo(-22,0); ctx.lineTo(22,0); ctx.moveTo(0,-4); ctx.lineTo(0,4); ctx.stroke();
      ctx.restore();
    }

    ctx.strokeStyle='#111'; ctx.lineWidth=3;
    ctx.fillStyle='#f1df2a';
    ctx.beginPath();
    ctx.moveTo(-16,-18); ctx.quadraticCurveTo(-18,-40,10,-40); ctx.quadraticCurveTo(28,-39,28,-18);
    ctx.lineTo(28,8); ctx.quadraticCurveTo(26,28,6,30); ctx.lineTo(-8,30); ctx.quadraticCurveTo(-20,28,-18,10); ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle='#f1df2a';
    ctx.beginPath();
    ctx.moveTo(22,-15); ctx.quadraticCurveTo(44,-16,44,-4); ctx.quadraticCurveTo(44,8,22,6); ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(7,-12,2.4,0,Math.PI*2); ctx.arc(14,-12,2.4,0,Math.PI*2); ctx.fill();

    ctx.fillStyle='#74b942';
    drawRoundRect(-14,8,38,10,5,'#74b942','#111');
    drawRoundRect(-14,18,38,10,5,'#74b942','#111');
    ctx.beginPath();
    for(let i=0;i<4;i++){
      const lx = -10 + i*10;
      ctx.moveTo(lx,28); ctx.lineTo(lx-1,39);
    }
    ctx.stroke();

    ctx.restore();
  }

  function drawBullets(){
    ctx.fillStyle='#111';
    for(const b of bullets){
      const y = sy(b.y);
      if(y<-20||y>world.viewH+20) continue;
      ctx.beginPath(); ctx.arc(b.x,y,b.r,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='#e84b37';
    for(const b of enemyBullets){
      const y = sy(b.y);
      if(y<-20||y>world.viewH+20) continue;
      ctx.beginPath(); ctx.arc(b.x,y,b.r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.stroke();
    }
  }

  function drawParticles(){
    for(const p of particles){
      const y = sy(p.y);
      ctx.globalAlpha = Math.max(0, p.life / 32);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x,y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGhostNames(){
    ctx.save();
    ctx.font = '28px "Comic Sans MS", "Marker Felt", cursive';
    ctx.fillStyle = '#111';
    ctx.strokeStyle = '#a7d8e8';
    ctx.lineWidth = 2;
    const base = Math.floor(world.score / 55);
    for(let i=0;i<7;i++){
      const n = names[(base+i)%names.length];
      const y = 120 + (i*170 + base*7) % (world.viewH + 120) - 40;
      const x = world.viewW - 170 + ((i%2)*18);
      ctx.fillText(n, x, y);
      ctx.beginPath(); ctx.moveTo(x-4, y+8); ctx.lineTo(x+120, y+8); ctx.stroke();
    }
    ctx.restore();
  }

  function drawScoreBig(){
    const score = Math.max(0, Math.floor(world.score));
    ctx.fillStyle = '#111';
    ctx.font = '900 96px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(String(score), world.viewW * 0.5, 128);
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawBackground();
    drawGhostNames();
    for(const p of platforms) drawPlatform(p);
    for(const m of monsters) drawMonster(m);
    drawParticles();
    drawBullets();
    drawPlayer();
    drawScoreBig();

    if(world.paused){
      ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(0,0,world.viewW,world.viewH);
      ctx.fillStyle='#111'; ctx.font='700 48px Arial'; ctx.textAlign='center';
      ctx.fillText('Pause', world.viewW/2, world.viewH/2);
    }
  }

  let acc = 0, last = performance.now();
  function loop(now){
    const dt = Math.min(33, now-last); last = now; acc += dt;
    while(acc >= 1000/60){
      if(world.state==='play') tick();
      acc -= 1000/60;
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
