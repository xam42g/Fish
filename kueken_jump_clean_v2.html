<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Küken Jump Clean</title>
<style>
  :root{
    --bg:#000;
    --paper:#f7f7f5;
    --grid:#ececeb;
    --green:#71c70f;
    --blue:#1f95cf;
    --brown:#9a6a32;
    --yellow:#ffd93b;
    --orange:#ffb436;
    --ui:#f4ecd6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,Arial,sans-serif}
  body{display:grid;place-items:center}
  .wrap{position:fixed;inset:0;display:grid;place-items:center;background:#000}
  .frame{
    position:relative;
    width:min(100vw, calc(100vh * .62));
    height:min(100vh, calc(100vw / .62));
    border-radius:min(4.5vw, 34px);
    overflow:hidden;
    background:#111;
  }
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none}
  .pause,.mode{
    position:absolute;top:18px;height:56px;border-radius:18px;background:rgba(244,236,214,.98);
    border:3px solid rgba(0,0,0,.08);display:grid;place-items:center;color:#111;box-shadow:0 2px 0 rgba(0,0,0,.08);
    pointer-events:auto;cursor:pointer;font-weight:900;
  }
  .pause{left:18px;width:56px;font-size:28px}
  .pause:before{content:"II";letter-spacing:-3px;transform:translateX(-2px)}
  .mode{left:84px;min-width:126px;padding:0 14px;font-size:16px}
  .pill{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    background:var(--ui);border-radius:18px;padding:6px 18px;font-size:18px;font-weight:900;color:#111;
    box-shadow:0 2px 0 rgba(0,0,0,.08)
  }
  .stars{
    position:absolute;top:18px;right:18px;min-width:100px;height:56px;border-radius:20px;background:var(--orange);
    box-shadow:0 2px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:28px;font-weight:900;color:#111
  }
  .stars span:last-child{font-size:26px}
  .overlay{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    background:rgba(255,255,255,.93);color:#111;border:3px solid #111;border-radius:20px;
    padding:10px 14px;max-width:min(88%, 420px);text-align:center;pointer-events:none;
    box-shadow:0 8px 26px rgba(0,0,0,.18);font-size:14px;line-height:1.35
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame" id="frame">
    <canvas id="game" width="720" height="1160"></canvas>
    <div class="hud">
      <button class="pause" id="pauseBtn" aria-label="Pause"></button>
      <button class="mode" id="modeBtn" aria-label="Steuerung wechseln">Tastatur</button>
      <div class="pill" id="scoreSmall">0</div>
      <div class="stars"><span id="starCount">0</span><span>⭐</span></div>
      <div class="overlay" id="overlay">Leertaste / W / ↑ springen, A/D oder ←/→ bewegen, Shift schießt nach oben. Im Handy-Modus Gerät kippen und tippen zum Springen.</div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');
  const overlay = document.getElementById('overlay');
  const scoreSmallEl = document.getElementById('scoreSmall');
  const starCountEl = document.getElementById('starCount');
  const pauseBtn = document.getElementById('pauseBtn');
  const modeBtn = document.getElementById('modeBtn');

  const world = {viewW:720, viewH:1160, camY:0, bestY:0, score:0, stars:0, state:'intro', paused:false, controlMode:'keyboard'};
  let DPR = Math.max(1, Math.min(2, devicePixelRatio || 1));

  function resize(){
    const rect = frame.getBoundingClientRect();
    canvas.width = Math.round(rect.width * DPR);
    canvas.height = Math.round(rect.height * DPR);
    world.viewW = rect.width;
    world.viewH = rect.height;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  addEventListener('resize', resize);

  const input = {left:false,right:false,jump:false,shoot:false,tilt:0,tiltReady:false};

  const player = {
    x: world.viewW * 0.5, y: world.viewH - 160,
    vx:0, vy:-18, w:42, h:42, facing:1,
    propeller:0, shootCd:0
  };

  const platforms = [], monsters = [], bullets = [], enemyBullets = [], particles = [];

  function rand(a,b){ return Math.random()*(b-a)+a; }
  function sy(y){ return y - world.camY; }

  function drawRoundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    if(fill){ ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){ ctx.lineWidth=3; ctx.strokeStyle=stroke; ctx.stroke(); }
  }

  function addPlatform(x,y,type='green'){
    const p = {x,y,w:rand(88,132),h:26,type,vx:0,broken:false,hasSpring:false,hasProp:false,star:false};
    if(type==='blue') p.vx = rand(44,68) * (Math.random()<.5?-1:1);
    if(type==='brown') p.w = rand(90,120);
    if(type==='green' && Math.random() < 0.08) p.hasSpring = true;
    if(type==='green' && Math.random() < 0.04) p.hasProp = true;
    if(Math.random() < 0.045) p.star = true;
    platforms.push(p);
    return p;
  }

  function addMonster(y){
    const base = platforms.find(p => Math.abs(p.y - y) < 60 && p.type !== 'brown');
    if(!base) return;
    monsters.push({
      x: base.x + base.w * 0.5, y: base.y - 30, w:60, h:48,
      vx: rand(18,34) * (Math.random() < .5 ? -1 : 1), shoot: rand(1.6,2.7)
    });
  }

  function generateInitial(){
    platforms.length = monsters.length = bullets.length = enemyBullets.length = particles.length = 0;
    let y = world.viewH - 100;
    addPlatform(world.viewW * .42, y, 'green');
    for(let i=1;i<26;i++){
      y -= rand(92, 118);
      const x = rand(18, world.viewW - 154);
      let type = 'green';
      const r = Math.random();
      if(i > 8 && r < 0.12) type = 'brown';
      else if(i > 11 && r < 0.22) type = 'blue';
      const p = addPlatform(x, y, type);
      if(i > 16 && Math.random() < 0.08) addMonster(p.y);
    }
  }

  function extendWorld(){
    let topY = Math.min(...platforms.map(p => p.y));
    while(topY > world.camY - 1300){
      topY -= rand(90, 118);
      const x = rand(18, world.viewW - 154);
      let type = 'green';
      const diff = Math.min(1, world.score / 3500);
      const r = Math.random();
      if(r < 0.12 + diff*0.08) type = 'brown';
      else if(r < 0.23 + diff*0.12) type = 'blue';
      const p = addPlatform(x, topY, type);
      if(world.score > 260 && Math.random() < 0.05 + diff*0.15) addMonster(p.y);
    }
    const killY = world.camY + world.viewH + 220;
    for(let i=platforms.length-1;i>=0;i--) if(platforms[i].y > killY || platforms[i].broken) platforms.splice(i,1);
    for(let i=monsters.length-1;i>=0;i--) if(monsters[i].y > killY) monsters.splice(i,1);
    for(let i=particles.length-1;i>=0;i--) if(particles[i].y > killY || particles[i].life<=0) particles.splice(i,1);
  }

  function updateUI(){
    scoreSmallEl.textContent = Math.max(0, Math.floor(world.score));
    starCountEl.textContent = world.stars;
    modeBtn.textContent = world.controlMode === 'keyboard' ? 'Tastatur' : 'Handy/iPad';
  }

  function reset(){
    world.camY = 0; world.bestY = player.y; world.score = 0; world.stars = 0; world.state='intro'; world.paused=false;
    player.x = world.viewW * 0.5; player.y = world.viewH - 160; player.vx=0; player.vy=-18; player.propeller=0; player.shootCd=0;
    generateInitial();
    updateUI();
    overlay.style.display = 'block';
  }

  function bounce(power=18.5){ player.vy = -power; }
  function die(){
    for(let i=0;i<16;i++) particles.push({x:player.x,y:player.y,vx:rand(-2,2),vy:rand(-3,1),r:rand(2,4),life:rand(16,28),c:'#d8d8d8'});
    reset();
  }
  function shoot(){
    if(player.shootCd > 0) return;
    player.shootCd = 10;
    bullets.push({x:player.x, y:player.y - player.h*.6, vy:-13, r:4});
  }

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
  }

  function startPlay(){
    if(world.state === 'intro'){
      world.state = 'play';
      overlay.style.display = 'none';
    }
  }

  addEventListener('keydown', e => {
    if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW','ShiftLeft','ShiftRight'].includes(e.code)) e.preventDefault();
    startPlay();
    if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = true;
    if(e.code==='ArrowRight'||e.code==='KeyD') input.right = true;
    if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') input.jump = true;
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') input.shoot = true;
    if(e.code==='KeyP') world.paused = !world.paused;
  });
  addEventListener('keyup', e => {
    if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = false;
    if(e.code==='ArrowRight'||e.code==='KeyD') input.right = false;
    if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') input.jump = false;
    if(e.code==='ShiftLeft'||e.code==='ShiftRight') input.shoot = false;
  });

  canvas.addEventListener('pointerdown', e => {
    startPlay();
    if(world.controlMode === 'tilt') input.jump = true;
  });
  addEventListener('pointerup', ()=> input.jump = false);

  pauseBtn.addEventListener('click', () => world.paused = !world.paused);

  async function switchMode(){
    if(world.controlMode === 'keyboard'){
      world.controlMode = 'tilt';
      try{
        if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
          const res = await DeviceOrientationEvent.requestPermission();
          input.tiltReady = res === 'granted';
        }else{
          input.tiltReady = true;
        }
      }catch(err){
        input.tiltReady = false;
      }
      overlay.style.display = 'block';
      overlay.textContent = input.tiltReady
        ? 'Handy/iPad-Modus aktiv: Gerät nach links oder rechts kippen. Ein Tipp auf den Bildschirm springt.'
        : 'Handy/iPad-Modus: Falls nichts passiert, erlaube Bewegungssensoren im Browser und tippe erneut auf den Modus-Button.';
    }else{
      world.controlMode = 'keyboard';
      overlay.style.display = 'block';
      overlay.textContent = 'Tastatur-Modus aktiv: A/D oder ←/→ bewegen, Leertaste / W / ↑ springen, Shift schießt nach oben.';
    }
    updateUI();
  }
  modeBtn.addEventListener('click', switchMode);

  addEventListener('deviceorientation', e => {
    if(world.controlMode !== 'tilt') return;
    const gamma = typeof e.gamma === 'number' ? e.gamma : 0;
    input.tilt = Math.max(-1, Math.min(1, gamma / 22));
  });

  function tick(){
    if(world.paused) return;

    if(input.shoot) shoot();
    if(player.shootCd > 0) player.shootCd--;

    let ax = 0;
    if(world.controlMode === 'tilt' && input.tiltReady){
      ax = input.tilt;
    }else{
      if(input.left) ax -= 1;
      if(input.right) ax += 1;
    }

    if(ax > 0.05) player.facing = 1;
    else if(ax < -0.05) player.facing = -1;

    player.vx += ax * (player.propeller > 0 ? 0.68 : 0.5);
    player.vx *= 0.92;
    if(player.vx > 8.6) player.vx = 8.6;
    if(player.vx < -8.6) player.vx = -8.6;

    if(player.propeller > 0){
      player.propeller--;
      player.vy = -11.5;
    }else{
      player.vy += 0.55;
      if(player.vy > 16) player.vy = 16;
    }

    const prevY = player.y;
    player.x += player.vx;
    player.y += player.vy;

    if(player.x < -30) player.x = world.viewW + 30;
    if(player.x > world.viewW + 30) player.x = -30;

    for(const p of platforms){
      if(p.type === 'blue'){
        p.x += p.vx * 0.12;
        if(p.x < 10 || p.x + p.w > world.viewW - 10) p.vx *= -1;
      }
    }

    if(player.vy > 0){
      const px = player.x - player.w*.36;
      const pw = player.w*.72;
      for(const p of platforms){
        const crossed = prevY + player.h*.45 <= p.y && player.y + player.h*.45 >= p.y;
        const onX = px + pw > p.x + 6 && px < p.x + p.w - 6;
        if(crossed && onX){
          if(p.type === 'brown'){
            if(!p.broken){
              p.broken = true;
              for(let i=0;i<8;i++) particles.push({x:p.x+p.w/2,y:p.y,vx:rand(-2.5,2.5),vy:rand(-1.2,2.5),r:rand(2,5),life:rand(18,34),c:'#8a5d2a'});
            }
          }else{
            if(p.hasSpring){ p.hasSpring = false; bounce(30); }
            else bounce(18.5);
            if(p.hasProp){ p.hasProp = false; player.propeller = 125; }
            if(p.star){ p.star = false; world.stars++; }
            break;
          }
        }
      }
    }

    for(const m of monsters){
      m.x += m.vx * 0.08;
      if(m.x < 40 || m.x > world.viewW - 40) m.vx *= -1;
      m.shoot -= 1/60;
      if(world.score > 700 && m.shoot <= 0){
        m.shoot = rand(1.4, 2.3);
        enemyBullets.push({x:m.x, y:m.y, vy:rand(4.2,5.6), r:5});
      }
      if(rectsOverlap(player.x-player.w*.3, player.y-player.h*.45, player.w*.6, player.h*.82, m.x-m.w/2, m.y-m.h/2, m.w, m.h)){
        die(); return;
      }
    }

    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.y += b.vy;
      let hit = false;
      for(let j=monsters.length-1;j>=0;j--){
        const m = monsters[j];
        if(rectsOverlap(b.x-b.r,b.y-b.r,b.r*2,b.r*2,m.x-m.w/2,m.y-m.h/2,m.w,m.h)){
          bullets.splice(i,1); monsters.splice(j,1); hit = true;
          for(let k=0;k<12;k++) particles.push({x:m.x,y:m.y,vx:rand(-2.3,2.3),vy:rand(-2.3,2.3),r:rand(2,4),life:rand(18,30),c:'#4f8ecf'});
          break;
        }
      }
      
      if(!hit && b.y < world.camY - 80) bullets.splice(i,1);
    }

    for(let i=enemyBullets.length-1;i>=0;i--){
      const b = enemyBullets[i];
      b.y += b.vy;
      if(rectsOverlap(player.x-player.w*.3, player.y-player.h*.45, player.w*.6, player.h*.82, b.x-b.r, b.y-b.r, b.r*2, b.r*2)){
        die(); return;
      }
      if(b.y > world.camY + world.viewH + 60) enemyBullets.splice(i,1);
    }

    for(const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life--;
    }

    if(player.y < world.bestY) world.bestY = player.y;
    world.score = Math.max(0, ((world.viewH - 160) - world.bestY) * 0.52);

    const camTarget = Math.min(world.camY, player.y - world.viewH * 0.42);
    world.camY += (camTarget - world.camY) * 0.12;

    if(player.y > world.camY + world.viewH + 60){
      die(); return;
    }

    extendWorld();
    updateUI();
  }

  function drawBackground(){
    const vw = world.viewW, vh = world.viewH;
    ctx.fillStyle = '#f7f7f5';
    ctx.fillRect(0,0,vw,vh);
    ctx.strokeStyle = '#ececeb';
    ctx.lineWidth = 1;
    for(let x=0;x<vw;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,vh); ctx.stroke(); }
    for(let y=0;y<vh;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(vw,y); ctx.stroke(); }
  }

  function drawStar(x,y,r,fill,stroke){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i * Math.PI*2/5;
      const a2 = a + Math.PI/5;
      const x1 = x + Math.cos(a) * r;
      const y1 = y + Math.sin(a) * r;
      const x2 = x + Math.cos(a2) * r*0.45;
      const y2 = y + Math.sin(a2) * r*0.45;
      if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
      ctx.lineTo(x2,y2);
    }
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.stroke();
  }

  function drawPlatform(p){
    const y = sy(p.y);
    if(y < -80 || y > world.viewH + 80) return;
    if(p.type === 'brown'){
      drawRoundRect(p.x,y,p.w/2-6,24,14,'#9a6a32','#111');
      drawRoundRect(p.x+p.w/2+6,y,p.w/2-6,24,14,'#9a6a32','#111');
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x+p.w/2-4,y+3); ctx.lineTo(p.x+p.w/2-8,y+9); ctx.lineTo(p.x+p.w/2-2,y+15); ctx.lineTo(p.x+p.w/2-6,y+21);
      ctx.moveTo(p.x+p.w/2+4,y+3); ctx.lineTo(p.x+p.w/2+8,y+9); ctx.lineTo(p.x+p.w/2+2,y+15); ctx.lineTo(p.x+p.w/2+6,y+21);
      ctx.stroke();
    } else {
      drawRoundRect(p.x,y,p.w,26,14,p.type==='blue' ? '#1f95cf' : '#71c70f','#111');
    }
    if(p.hasSpring){
      const cx = p.x + p.w/2;
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const yy = y - 1 - i*5;
        ctx.moveTo(cx-13,yy);
        ctx.quadraticCurveTo(cx,yy-4,cx+13,yy);
      }
      ctx.stroke();
    }
    if(p.hasProp){
      const cx = p.x + p.w/2, cy = y - 23;
      ctx.fillStyle = '#ef5b37'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#eee'; ctx.fillRect(cx-14,cy-3,28,6); ctx.strokeRect(cx-14,cy-3,28,6);
    }
    if(p.star){
      drawStar(p.x+p.w/2, y-20, 12, '#ffd84d', '#111');
    }
  }

  function drawMonster(m){
    const y = sy(m.y);
    if(y < -100 || y > world.viewH + 100) return;
    ctx.save();
    ctx.translate(m.x, y);
    ctx.fillStyle = '#9a6a32'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-18,20); ctx.quadraticCurveTo(-34,6,-28,-18); ctx.quadraticCurveTo(-24,-30,-10,-26);
    ctx.quadraticCurveTo(4,-34,18,-22); ctx.quadraticCurveTo(28,-12,24,10); ctx.quadraticCurveTo(18,22,0,24); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f4c8d6';
    ctx.beginPath(); ctx.arc(-10,-2,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-9,-2,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-3,14); ctx.lineTo(7,12); ctx.lineTo(12,16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,24); ctx.lineTo(-8,34); ctx.moveTo(4,24); ctx.lineTo(5,34); ctx.stroke();
    ctx.restore();
  }

  function drawPlayer(){
    const x = player.x, y = sy(player.y);
    ctx.save();
    ctx.translate(x, y);
    if(player.facing < 0) ctx.scale(-1,1);

    if(player.propeller > 0){
      ctx.fillStyle='#ef5b37'; ctx.strokeStyle='#111'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(-7,-34); ctx.lineTo(0,-43); ctx.lineTo(7,-34); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(0,-42); ctx.stroke();
      const r = performance.now() * 0.02;
      ctx.save(); ctx.translate(0,-46); ctx.rotate(r);
      ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(20,0); ctx.moveTo(0,-4); ctx.lineTo(0,4); ctx.stroke();
      ctx.restore();
    }

    ctx.lineWidth = 3;
    ctx.strokeStyle = '#111';
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath();
    ctx.arc(-4,-4,18,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffd93b';
    ctx.beginPath();
    ctx.arc(-18,0,7,0,Math.PI*2);
    ctx.arc(6,16,11,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-8,-7,2.1,0,Math.PI*2);
    ctx.arc(-1,-7,2.1,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#f4a23d';
    ctx.beginPath();
    ctx.moveTo(10,-4); ctx.lineTo(28,1); ctx.lineTo(10,6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#74b942';
    drawRoundRect(-18,14,28,8,4,'#74b942','#111');
    drawRoundRect(-18,22,28,8,4,'#74b942','#111');

    ctx.beginPath();
    ctx.moveTo(-14,30); ctx.lineTo(-14,39);
    ctx.moveTo(-6,30); ctx.lineTo(-5,40);
    ctx.moveTo(2,30); ctx.lineTo(2,39);
    ctx.moveTo(10,30); ctx.lineTo(10,38);
    ctx.stroke();

    ctx.restore();
  }

  function drawBullets(){
    for(const b of bullets){
      const y = sy(b.y);
      if(y < -20 || y > world.viewH + 20) continue;
      ctx.fillStyle = '#fff8ef';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(b.x, y, 4.2, 5.6, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }
    for(const b of enemyBullets){
      const y = sy(b.y);
      if(y < -20 || y > world.viewH + 20) continue;
      ctx.fillStyle = '#fff8ef';
      ctx.strokeStyle = '#e84b37';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(b.x, y, 4.2, 5.6, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawParticles(){
    for(const p of particles){
      const y = sy(p.y);
      ctx.globalAlpha = Math.max(0, p.life / 30);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBigScore(){
    const score = Math.max(0, Math.floor(world.score));
    ctx.fillStyle = '#111';
    ctx.font = '900 92px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(String(score), world.viewW * 0.5, 128);
  }

  function render(){
    ctx.clearRect(0,0,world.viewW,world.viewH);
    drawBackground();
    for(const p of platforms) drawPlatform(p);
    for(const m of monsters) drawMonster(m);
    drawParticles();
    drawBullets();
    drawPlayer();
    drawBigScore();

    if(world.paused){
      ctx.fillStyle = 'rgba(0,0,0,.15)';
      ctx.fillRect(0,0,world.viewW,world.viewH);
      ctx.fillStyle = '#111';
      ctx.font = '700 48px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Pause', world.viewW/2, world.viewH/2);
    }
  }

  reset();

  let acc = 0, last = performance.now();
  function loop(now){
    const dt = Math.min(33, now - last);
    last = now;
    acc += dt;
    while(acc >= 1000/60){
      if(world.state === 'play') tick();
      acc -= 1000/60;
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
