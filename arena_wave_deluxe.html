<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Arena Wave Deluxe</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05080d;font-family:Arial,sans-serif;color:#f2f6fb;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:10;min-width:220px;background:rgba(11,20,31,.86);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px 14px;backdrop-filter:blur(10px);display:none;box-shadow:0 18px 38px rgba(0,0,0,.34)}
#hud .small{margin-top:4px;color:#bdc8d7;font-size:13px}
#hudActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#hudActions button{appearance:none;-webkit-appearance:none;border:none;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;background:#23374f;touch-action:manipulation}
#hudActions button.primary{background:linear-gradient(180deg,#7fe0ff,#19b9ff);color:#082033}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 15%,rgba(55,99,146,.18),transparent 45%),linear-gradient(rgba(5,9,16,.72),rgba(5,9,16,.82))}
.card{width:min(92vw,760px);background:linear-gradient(180deg,rgba(18,32,50,.98),rgba(14,25,39,.98));border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.48)}
h1,h2,h3,p{margin:0}.title{font-size:40px;margin-bottom:10px}.subtitle{font-size:17px;line-height:1.5;color:#bdc8d7;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.panel,.choice{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px}
.choice h3,.panel h3{margin-bottom:8px;font-size:22px}.choice p,.panel p,.list{line-height:1.5;color:#bdc8d7}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}.pill{display:inline-block;border-radius:999px;padding:6px 10px;margin:6px 6px 0 0;background:rgba(255,255,255,.08);font-size:12px;font-weight:700;color:#dce7f4}
.btn{appearance:none;-webkit-appearance:none;border:none;border-radius:16px;padding:14px 18px;min-width:170px;cursor:pointer;font-size:17px;font-weight:700;touch-action:manipulation;background:#fff;color:#111}
.btn.primary{background:linear-gradient(180deg,#7fe0ff,#19b9ff);color:#082033}.btn.alt{background:#23374f;color:#fff}
#toast{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);z-index:14;background:rgba(9,14,21,.90);border:1px solid rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:12px 16px;font-weight:700;display:none;box-shadow:0 16px 34px rgba(0,0,0,.32);white-space:nowrap}
@media (max-width:700px){.title{font-size:34px}.row{flex-direction:column}.btn{width:100%}.card{padding:20px}}
</style></head>
<body><canvas id="game"></canvas><div id="hud"></div><div id="toast"></div><div id="overlay"></div>
<script>
(()=>{const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),hud=document.getElementById("hud"),toast=document.getElementById("toast"),overlay=document.getElementById("overlay"),DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1)),TAU=Math.PI*2;
const keys={};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
const touch={active:false,sx:0,sy:0,dx:0,dy:0};
const S={screen:"menu",running:false,observing:false,mode:"bots",fillBots:true,queueTime:0,round:1,phase:"idle",phaseTime:0,side:"left",board:null,player:null,actors:[],botCount:3,toastTime:0};
function showToast(t,s=1.3){toast.textContent=t;toast.style.display="block";S.toastTime=s}
function setOverlay(html){overlay.innerHTML=html;overlay.style.display="flex"}
function bindBtn(id,fn){const el=document.getElementById(id);if(!el)return;el.addEventListener("click",fn);el.addEventListener("touchend",e=>{e.preventDefault();fn()},{passive:false})}
function renderMenu(){S.screen="menu";S.running=false;S.observing=false;hud.style.display="none";setOverlay('<div class="card"><h1 class="title">Arena Wave</h1><p class="subtitle">Sauberer Flow, ruhiger Start, flüssigeres Movement und robustere Grafik. Die Stämme stoppen sauber an den Blöcken, und Beobachten kann jederzeit wieder verlassen werden.</p><div class="grid"><div class="choice"><h3>Online-Spiel</h3><p>Suche nach Spielern. Wenn nicht genug da sind, wird das Match automatisch mit Bots aufgefüllt.</p><div><span class="pill">Matchmaking</span><span class="pill">Bots auffüllen</span><span class="pill">Lobby Flow</span></div><div class="row"><button class="btn primary" id="queueBtn">Spiel suchen</button></div></div><div class="choice"><h3>Sofort spielen</h3><p>Direkt starten mit Bots. Gut zum Testen von Grafik, Deckung und Spielgefühl.</p><div><span class="pill">1 Spieler</span><span class="pill">3 Bots</span><span class="pill">Schnellstart</span></div><div class="row"><button class="btn alt" id="soloBtn">Mit Bots starten</button></div></div></div><div class="panel" style="margin-top:14px"><h3>Diese Version fokussiert sich auf</h3><p class="list">- keine HUD-Kreise mehr<br>- Beobachter-Modus mit Exit<br>- glatteres Movement<br>- stabilere, sauber stoppende Angriffsstämme<br>- aufgeräumteres Menü</p></div></div>');bindBtn("queueBtn",renderQueueMenu);bindBtn("soloBtn",()=>startMatch("bots"))}
function renderQueueMenu(){S.screen="queue";setOverlay('<div class="card"><h1 class="title">Spielersuche</h1><p class="subtitle">Das ist ein HTML-Prototyp ohne echten Server. Der Ablauf ist aber schon wie bei einem Online-Spiel aufgebaut.</p><div class="panel"><h3>Lobby</h3><p>Gesucht werden 4 Spieler. Wenn nicht genug gefunden werden, wird mit Bots aufgefüllt.</p><div class="row"><button class="btn primary" id="searchBtn">Suchen + Bots auffüllen</button><button class="btn alt" id="botsBtn">Nur mit Bots starten</button><button class="btn alt" id="backBtn">Zurück</button></div></div></div>');bindBtn("searchBtn",()=>startQueue(true));bindBtn("botsBtn",()=>startMatch("bots"));bindBtn("backBtn",renderMenu)}
function startQueue(fillBots){S.screen="queueing";S.fillBots=fillBots;S.queueTime=0;setOverlay('<div class="card"><h1 class="title">Suche läuft …</h1><p class="subtitle">Spieler werden gesucht. Falls nötig, wird mit Bots aufgefüllt.</p><div class="panel"><p id="queueStatus" class="list" style="font-size:18px">Suche nach Spielern …</p><div class="row"><button class="btn alt" id="cancelBtn">Abbrechen</button></div></div></div>');bindBtn("cancelBtn",renderQueueMenu)}
function finishQueue(){startMatch("queue")}
function resize(){canvas.width=Math.floor(innerWidth*DPR);canvas.height=Math.floor(innerHeight*DPR);canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(DPR,0,0,DPR,0,0);layoutBoard()}addEventListener("resize",resize);
function tileRect(c,r){const b=S.board,p=b.tile*.05;return{x:b.innerX+c*b.tile+p,y:b.innerY+r*b.tile+p,w:b.tile-p*2,h:b.tile-p*2,c,r}}
function tileCenter(c,r){const b=S.board;return{x:b.innerX+(c+.5)*b.tile,y:b.innerY+(r+.5)*b.tile}}
function layoutBoard(){const size=Math.min(innerWidth*.58,innerHeight*.76,620),x=(innerWidth-size)/2,y=(innerHeight-size)/2,wall=size*.08,pad=size*.05,inner=size-wall*2-pad*2,tile=inner/4;S.board={x,y,size,wall,pad,inner,tile,innerX:x+wall+pad,innerY:y+wall+pad};S.board.blocks=[tileRect(0,0),tileRect(2,1),tileRect(3,3)];if(S.running)seedActors()}
function actor(kind,color,crown=false){return{kind,color,crown,x:0,y:0,vx:0,vy:0,r:18,alive:true,facing:-Math.PI/2,handsKick:0,trail:[]}}
function seedActors(){const player=actor("player","#15baff",true),pp=tileCenter(1,2);player.x=pp.x;player.y=pp.y;const spawns=[tileCenter(2,2),tileCenter(3,1),tileCenter(1,3)],colors=["#ff6058","#f2a11f","#63d88f"],bots=[];for(let i=0;i<S.botCount;i++){const b=actor("bot",colors[i],false);b.x=spawns[i].x;b.y=spawns[i].y;b.facing=Math.PI;bots.push(b)}S.player=player;S.actors=[player,...bots]}
function randomSide(){const arr=["left","right","top","bottom"];return arr[(Math.random()*arr.length)|0]}
function startMatch(mode){S.mode=mode;S.running=true;S.observing=false;S.round=1;S.side=randomSide();S.phase="intro";S.phaseTime=2.2;layoutBoard();overlay.style.display="none";hud.style.display="block";if(mode==="queue")showToast("Lobby erstellt: 1 Spieler + 3 Bots",1.8);else showToast("Runde startet",1.2)}
function showDeathMenu(){S.observing=false;setOverlay('<div class="card"><h1 class="title">Du bist raus</h1><p class="subtitle">Du kannst beobachten oder direkt zurück ins Menü gehen.</p><div class="panel"><p>Runde <strong>'+S.round+'</strong></p><div class="row"><button class="btn primary" id="observeBtn">Beobachten</button><button class="btn alt" id="menuBtn">Menü</button></div></div></div>');bindBtn("observeBtn",()=>{S.observing=true;overlay.style.display="none";showToast("Beobachter-Modus",1.1)});bindBtn("menuBtn",renderMenu)}
function updateHud(){if(!S.running){hud.style.display="none";return}hud.style.display="block";const aliveBots=S.actors.filter(a=>a.kind==="bot"&&a.alive).length,status=S.player&&S.player.alive?(S.observing?"Beobachten":"Aktiv"):"Raus",phase=S.phase==="intro"?"Start":S.phase==="wait"?"Warnung":S.phase==="attack"?"Angriff":"Pause";hud.innerHTML='<div><strong>Runde:</strong> '+S.round+'</div><div><strong>Status:</strong> '+status+'</div><div><strong>Bots:</strong> '+aliveBots+'</div><div><strong>Phase:</strong> '+phase+'</div><div class="small">WASD / Pfeile / Touch ziehen</div><div id="hudActions">'+(S.observing?'<button class="primary" id="leaveObserveBtn">Beobachten verlassen</button>':'')+'<button id="menuHudBtn">Menü</button></div>';bindBtn("menuHudBtn",renderMenu);if(S.observing)bindBtn("leaveObserveBtn",renderMenu)}
function point(e){const p=e.touches?e.touches[0]:e;return{x:p.clientX,y:p.clientY}}
canvas.addEventListener("mousedown",e=>{if(!S.running||S.observing||!S.player||!S.player.alive)return;const p=point(e);touch.active=true;touch.sx=p.x;touch.sy=p.y;touch.dx=0;touch.dy=0;e.preventDefault()});
window.addEventListener("mousemove",e=>{if(!touch.active)return;const p=point(e);touch.dx=p.x-touch.sx;touch.dy=p.y-touch.sy});
window.addEventListener("mouseup",()=>{touch.active=false;touch.dx=0;touch.dy=0});
canvas.addEventListener("touchstart",e=>{if(!S.running||S.observing||!S.player||!S.player.alive)return;const p=point(e);touch.active=true;touch.sx=p.x;touch.sy=p.y;touch.dx=0;touch.dy=0;e.preventDefault()},{passive:false});
window.addEventListener("touchmove",e=>{if(!touch.active)return;const p=point(e);touch.dx=p.x-touch.sx;touch.dy=p.y-touch.sy;e.preventDefault()},{passive:false});
window.addEventListener("touchend",()=>{touch.active=false;touch.dx=0;touch.dy=0});
function clampActor(a){const b=S.board;a.x=Math.max(b.innerX+a.r,Math.min(b.innerX+b.inner-a.r,a.x));a.y=Math.max(b.innerY+a.r,Math.min(b.innerY+b.inner-a.r,a.y))}
function circleRect(ax,ay,ar,r){const nx=Math.max(r.x,Math.min(ax,r.x+r.w)),ny=Math.max(r.y,Math.min(ay,r.y+r.h)),dx=ax-nx,dy=ay-ny;return dx*dx+dy*dy<ar*ar}
function resolveBlocks(a){for(const b of S.board.blocks){if(!circleRect(a.x,a.y,a.r,b))continue;const left=Math.abs((a.x+a.r)-b.x),right=Math.abs((b.x+b.w)-(a.x-a.r)),top=Math.abs((a.y+a.r)-b.y),bottom=Math.abs((b.y+b.h)-(a.y-a.r)),m=Math.min(left,right,top,bottom);if(m===left)a.x=b.x-a.r;else if(m===right)a.x=b.x+b.w+a.r;else if(m===top)a.y=b.y-a.r;else a.y=b.y+b.h+a.r}clampActor(a)}
function pushActors(){const alive=S.actors.filter(a=>a.alive);for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){const a=alive[i],b=alive[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,minD=a.r+b.r+8;if(d<minD){const nx=dx/d,ny=dy/d,ov=minD-d;a.x-=nx*ov*.5;a.y-=ny*ov*.5;b.x+=nx*ov*.5;b.y+=ny*ov*.5;a.vx-=nx*ov*20;a.vy-=ny*ov*20;b.vx+=nx*ov*20;b.vy+=ny*ov*20;a.handsKick=.10;b.handsKick=.10}}}
function safeSpot(side,block){const pad=S.board.tile*.30;if(side==="left")return{x:block.x+block.w+pad,y:block.y+block.h*.5};if(side==="right")return{x:block.x-pad,y:block.y+block.h*.5};if(side==="top")return{x:block.x+block.w*.5,y:block.y+block.h+pad};return{x:block.x+block.w*.5,y:block.y-pad}}
function actorSafe(a){for(const b of S.board.blocks){if(S.side==="left"&&a.x>=b.x+b.w&&a.y>=b.y&&a.y<=b.y+b.h)return true;if(S.side==="right"&&a.x<=b.x&&a.y>=b.y&&a.y<=b.y+b.h)return true;if(S.side==="top"&&a.y>=b.y+b.h&&a.x>=b.x&&a.x<=b.x+b.w)return true;if(S.side==="bottom"&&a.y<=b.y&&a.x>=b.x&&a.x<=b.x+b.w)return true}return false}
function chooseBotTarget(bot){const spots=S.board.blocks.map(b=>safeSpot(S.side,b));let best=spots[0],bestD=1e9;for(const s of spots){const d=Math.hypot(bot.x-s.x,bot.y-s.y);if(d<bestD){bestD=d;best=s}}return best}
function killActor(a){a.alive=false;a.vx=0;a.vy=0;if(a.kind==="player")showDeathMenu()}
function updateActors(dt){const p=S.player;if(p&&p.alive&&!S.observing){let mx=0,my=0;if(keys["w"]||keys["arrowup"])my-=1;if(keys["s"]||keys["arrowdown"])my+=1;if(keys["a"]||keys["arrowleft"])mx-=1;if(keys["d"]||keys["arrowright"])mx+=1;if(touch.active){mx+=Math.max(-1,Math.min(1,touch.dx/42));my+=Math.max(-1,Math.min(1,touch.dy/42))}const len=Math.hypot(mx,my);if(len>0){p.facing=Math.atan2(my/len,mx/len);p.vx+=(mx/len)*840*dt;p.vy+=(my/len)*840*dt}}for(const a of S.actors){if(!a.alive||a.kind!=="bot")continue;const t=chooseBotTarget(a),dx=t.x-a.x,dy=t.y-a.y,len=Math.hypot(dx,dy);if(len>1){a.facing=Math.atan2(dy/len,dx/len);a.vx+=(dx/len)*680*dt;a.vy+=(dy/len)*680*dt}}pushActors();for(const a of S.actors){if(!a.alive)continue;a.handsKick=Math.max(0,a.handsKick-dt);a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.80;a.vy*=.80;if(Math.hypot(a.vx,a.vy)>8)a.facing=Math.atan2(a.vy,a.vx);resolveBlocks(a);a.trail.push({x:a.x,y:a.y,t:.20});if(a.trail.length>6)a.trail.shift();for(const tr of a.trail)tr.t-=dt;a.trail=a.trail.filter(tr=>tr.t>0)}}
function updateQueue(dt){if(S.screen!=="queueing")return;S.queueTime+=dt;const el=document.getElementById("queueStatus");if(!el)return;if(S.queueTime<1.2)el.innerHTML="Suche nach Spielern …<br><strong>1 / 4 gefunden</strong>";else if(S.queueTime<2.2)el.innerHTML="Suche nach Spielern …<br><strong>2 / 4 gefunden</strong>";else if(S.queueTime<3.2)el.innerHTML="Nicht genug Spieler gefunden.<br><strong>Fülle mit Bots auf …</strong>";else finishQueue()}
function updateGame(dt){if(!S.running)return;updateActors(dt);S.phaseTime-=dt;if(S.phase==="intro"){if(S.phaseTime<=0){S.phase="wait";S.phaseTime=1.35;showToast("Such Deckung",1.0)}}else if(S.phase==="wait"){if(S.phaseTime<=0){S.phase="attack";S.phaseTime=.95}}else if(S.phase==="attack"){if(S.phaseTime<=.16){for(const a of S.actors)if(a.alive&&!actorSafe(a))killActor(a)}if(S.phaseTime<=0){S.phase="recover";S.phaseTime=.75}}else if(S.phase==="recover"){if(S.phaseTime<=0){S.round+=1;S.side=randomSide();S.phase="wait";S.phaseTime=1.15}}}
function update(dt){if(S.toastTime>0){S.toastTime-=dt;if(S.toastTime<=0)toast.style.display="none"}updateQueue(dt);updateGame(dt);updateHud()}
function drawBackground(){ctx.fillStyle="#000";ctx.fillRect(0,0,innerWidth,innerHeight)}
function rr(x,y,w,h,r,fill=true,stroke=false){r=Math.min(r,w*.5,h*.5);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke()}
function drawBoard(){const b=S.board,off=b.size*.03;ctx.fillStyle="#223a55";ctx.fillRect(b.x+off,b.y+off,b.size,b.size);ctx.fillStyle="#3c6484";ctx.fillRect(b.x,b.y,b.size,b.size);ctx.fillStyle="#000";ctx.fillRect(b.x+b.wall,b.y+b.wall,b.size-b.wall*2,b.size-b.wall*2);for(let r=0;r<4;r++)for(let c=0;c<4;c++){const x=b.innerX+c*b.tile,y=b.innerY+r*b.tile;ctx.fillStyle=((r+c)%2===0)?"#efad7b":"#d89388";ctx.fillRect(x,y,b.tile,b.tile);ctx.fillStyle="rgba(255,255,255,.08)";ctx.fillRect(x+b.tile*.12,y+b.tile*.12,b.tile*.6,b.tile*.6);ctx.fillStyle="rgba(0,0,0,.08)";ctx.beginPath();ctx.moveTo(x+b.tile*.72,y+b.tile*.1);ctx.lineTo(x+b.tile*.90,y+b.tile*.1);ctx.lineTo(x+b.tile*.90,y+b.tile*.28);ctx.closePath();ctx.fill()}}
function drawBlock(rect){const sh=S.board.tile*.13;ctx.fillStyle="rgba(0,0,0,.25)";rr(rect.x+sh,rect.y+sh,rect.w,rect.h,rect.w*.20,true,false);ctx.fillStyle="#54445e";rr(rect.x,rect.y+rect.h*.12,rect.w,rect.h*.88,rect.w*.20,true,false);ctx.fillStyle="#857086";rr(rect.x,rect.y,rect.w,rect.h*.90,rect.w*.20,true,false)}
function drawBlocks(){for(const b of S.board.blocks)drawBlock(b)}
function drawTrail(a){for(const tr of a.trail){const alpha=Math.max(0,tr.t/.20)*.16;ctx.fillStyle="rgba(130,95,70,"+alpha+")";ctx.save();ctx.translate(tr.x,tr.y);ctx.rotate(a.facing+Math.PI/4);ctx.fillRect(-4,-4,8,8);ctx.restore()}}
function drawCrown(x,y){ctx.fillStyle="#efe170";ctx.strokeStyle="#0d0d11";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-10,y+12);ctx.lineTo(x-7,y-1);ctx.lineTo(x+1,y+6);ctx.lineTo(x+8,y-4);ctx.lineTo(x+15,y+12);ctx.closePath();ctx.fill();ctx.stroke()}
function drawActor(a){if(!a.alive)return;drawTrail(a);const x=a.x,y=a.y,r=a.r,dx=Math.cos(a.facing),dy=Math.sin(a.facing),px=-dy,py=dx,kick=a.handsKick>0?4:0;ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(x+2,y+r*.93,r*.86,r*.48,0,0,TAU);ctx.fill();const armBaseX=x+dx*(r*.50),armBaseY=y+dy*(r*.50),handDist=r*.92+kick,spread=r*.46,h1x=x+dx*handDist+px*spread,h1y=y+dy*handDist+py*spread,h2x=x+dx*handDist-px*spread,h2y=y+dy*handDist-py*spread;ctx.strokeStyle="#0c0c10";ctx.lineWidth=4;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(armBaseX+px*4,armBaseY+py*4);ctx.lineTo(h1x,h1y);ctx.moveTo(armBaseX-px*4,armBaseY-py*4);ctx.lineTo(h2x,h2y);ctx.stroke();ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle="#0b0b0f";ctx.stroke();ctx.fillStyle="#0c0c10";ctx.beginPath();ctx.ellipse(x+dx*3,y+dy*3,r*.62,r*.50,a.facing,0,TAU);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+dx*6.2-px*2.4,y+dy*6.2-py*2.4,3.5,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(x+dx*6.2+px*2.4,y+dy*6.2+py*2.4,3.5,0,TAU);ctx.fill();ctx.fillStyle="#0a0c10";ctx.beginPath();ctx.arc(x+dx*7.4-px*2.0,y+dy*7.4-py*2.0,1.35,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(x+dx*7.4+px*2.0,y+dy*7.4+py*2.0,1.35,0,TAU);ctx.fill();for(const hand of [[h1x,h1y],[h2x,h2y]]){ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(hand[0],hand[1],r*.32,0,TAU);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#0c0c10";ctx.stroke()}if(a.crown)drawCrown(x-1,y-r-7)}
function drawActors(){for(const a of S.actors)drawActor(a)}
function getLaneSpan(side,lane){const b=S.board,t=b.tile;if(side==="left"||side==="right")return{x:b.innerX,y:b.innerY+lane*t+t*.16,w:b.inner,h:t*.68};return{x:b.innerX+lane*t+t*.16,y:b.innerY,w:t*.68,h:b.inner}}
function laneBlockLimit(side,lane){const span=getLaneSpan(side,lane),hits=S.board.blocks.filter(b=>{if(side==="left"||side==="right")return !(span.y+span.h<=b.y||span.y>=b.y+b.h);return !(span.x+span.w<=b.x||span.x>=b.x+b.w)});if(!hits.length)return null;if(side==="left")return Math.min(...hits.map(b=>b.x));if(side==="right")return Math.max(...hits.map(b=>b.x+b.w));if(side==="top")return Math.min(...hits.map(b=>b.y));return Math.max(...hits.map(b=>b.y+b.h))}
function logProgress(){if(S.phase!=="attack")return 0;return 1-(S.phaseTime/.95)}
function drawLog(side,lane,active){const b=S.board,t=b.tile,bodyLen=t*1.22,tip=t*.29,p=active?logProgress():0;let baseX,baseY,w,h;if(side==="left"||side==="right"){h=t*.68;w=bodyLen;baseY=b.innerY+lane*t+t*.16;baseX=side==="left"?b.x-w*.18:b.x+b.size-w*.82}else{w=t*.68;h=bodyLen;baseX=b.innerX+lane*t+t*.16;baseY=side==="top"?b.y-h*.18:b.y+b.size-h*.82}let x=baseX,y=baseY,drawW=w,drawH=h,tipPath=null;if(active){const maxTravel=t*1.34*p,limit=laneBlockLimit(side,lane);if(side==="left"){const tipX=limit===null?(b.innerX+maxTravel):Math.min(limit,b.innerX+maxTravel),bodyEnd=tipX-tip;drawW=Math.max(0,bodyEnd-x);tipPath=[[bodyEnd,y+h*.08],[tipX,y+h*.5],[bodyEnd,y+h*.92]]}else if(side==="right"){const tipX=limit===null?(b.innerX+b.inner-maxTravel):Math.max(limit,b.innerX+b.inner-maxTravel),bodyStart=tipX+tip;x=bodyStart;drawW=Math.max(0,baseX+w-bodyStart);tipPath=[[bodyStart,y+h*.08],[tipX,y+h*.5],[bodyStart,y+h*.92]]}else if(side==="top"){const tipY=limit===null?(b.innerY+maxTravel):Math.min(limit,b.innerY+maxTravel),bodyEnd=tipY-tip;drawH=Math.max(0,bodyEnd-y);tipPath=[[x+w*.08,bodyEnd],[x+w*.5,tipY],[x+w*.92,bodyEnd]]}else{const tipY=limit===null?(b.innerY+b.inner-maxTravel):Math.max(limit,b.innerY+b.inner-maxTravel),bodyStart=tipY+tip;y=bodyStart;drawH=Math.max(0,baseY+h-bodyStart);tipPath=[[x+w*.08,bodyStart],[x+w*.5,tipY],[x+w*.92,bodyStart]]}}if(drawW<=0||drawH<=0)return;ctx.fillStyle="rgba(0,0,0,.28)";ctx.fillRect(x+8,y+9,drawW,drawH);ctx.fillStyle="#8d4b1d";rr(x,y,drawW,drawH,9,true,false);ctx.fillStyle="#b76726";if(side==="left"||side==="right")rr(x+8,y+2,Math.max(0,drawW-12),Math.max(0,drawH-4),7,true,false);else rr(x+2,y+8,Math.max(0,drawW-4),Math.max(0,drawH-12),7,true,false);ctx.strokeStyle="rgba(133,72,28,.38)";ctx.lineWidth=7;ctx.lineCap="round";if(side==="left"||side==="right"){for(const pr of [.18,.61]){const xx=x+drawW*pr;ctx.beginPath();ctx.moveTo(xx,y+drawH*.26);ctx.lineTo(xx+drawW*.06,y+drawH*.26);ctx.stroke()}ctx.fillStyle="rgba(132,71,26,.4)";for(const pr of [.22,.73]){ctx.beginPath();ctx.arc(x+drawW*pr,y+drawH*.63,6,0,TAU);ctx.fill()}}else{for(const pr of [.18,.61]){const yy=y+drawH*pr;ctx.beginPath();ctx.moveTo(x+drawW*.28,yy);ctx.lineTo(x+drawW*.28,yy+drawH*.06);ctx.stroke()}ctx.fillStyle="rgba(132,71,26,.4)";for(const pr of [.22,.73]){ctx.beginPath();ctx.arc(x+drawW*.63,y+drawH*pr,6,0,TAU);ctx.fill()}}ctx.fillStyle="#1f232a";if(side==="left"&&tipPath)rr(tipPath[0][0]-12,y-2,12,drawH+4,4,true,false);else if(side==="right"&&tipPath)rr(x,y-2,12,drawH+4,4,true,false);else if(side==="top"&&tipPath)rr(x-2,tipPath[0][1]-12,drawW+4,12,4,true,false);else if(side==="bottom"&&tipPath)rr(x-2,y,drawW+4,12,4,true,false);if(tipPath){ctx.fillStyle="#edf3f5";ctx.strokeStyle="#96a7b2";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tipPath[0][0],tipPath[0][1]);ctx.lineTo(tipPath[1][0],tipPath[1][1]);ctx.lineTo(tipPath[2][0],tipPath[2][1]);ctx.closePath();ctx.fill();ctx.stroke()}}
function drawLogs(){for(let i=0;i<4;i++){drawLog("left",i,S.side==="left");drawLog("right",i,S.side==="right");drawLog("top",i,S.side==="top");drawLog("bottom",i,S.side==="bottom")}}
function drawWarning(){if(S.phase!=="wait")return;const b=S.board,pulse=.45+.55*Math.sin(performance.now()*0.013);ctx.save();ctx.globalAlpha=.85*pulse;ctx.fillStyle="#ff312f";if(S.side==="left")ctx.fillRect(b.x+b.wall*.18,b.innerY,b.wall*.48,b.inner);else if(S.side==="right")ctx.fillRect(b.x+b.size-b.wall*.66,b.innerY,b.wall*.48,b.inner);else if(S.side==="top")ctx.fillRect(b.innerX,b.y+b.wall*.18,b.inner,b.wall*.48);else ctx.fillRect(b.innerX,b.y+b.size-b.wall*.66,b.inner,b.wall*.48);ctx.restore()}
function drawTopText(){if(!S.running)return;ctx.textAlign="center";if(S.phase==="intro"){ctx.fillStyle="rgba(255,255,255,.95)";ctx.font="bold 34px Arial";ctx.fillText("Runde startet …",innerWidth*.5,Math.max(48,S.board.y-26))}else if(S.phase==="wait"){ctx.fillStyle="rgba(255,255,255,.95)";ctx.font="bold 30px Arial";ctx.fillText("Such Deckung",innerWidth*.5,Math.max(48,S.board.y-26))}}
function drawTouch(){if(!touch.active||S.observing||!S.player||!S.player.alive)return;ctx.save();ctx.globalAlpha=.22;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(touch.sx,touch.sy,34,0,TAU);ctx.fill();ctx.globalAlpha=.34;ctx.beginPath();ctx.arc(touch.sx+Math.max(-28,Math.min(28,touch.dx)),touch.sy+Math.max(-28,Math.min(28,touch.dy)),20,0,TAU);ctx.fill();ctx.restore()}
function draw(){drawBackground();if(S.board){drawBoard();drawLogs();drawWarning();drawBlocks();drawActors();drawTopText();drawTouch()}}
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
resize();renderMenu();requestAnimationFrame(loop);
})();</script></body></html>
