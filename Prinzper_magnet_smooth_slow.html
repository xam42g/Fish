<script>
(function(){
  function fixMagnet(){
    if(!window.magnetAbility) return;

    // kleinerer radius
    magnetAbility.range = 180;
    magnetAbility.pullSpeed = 900;

    if(typeof update === "function" && !window.__magnetFix2){
      const oldUpdate = update;
      update = function(dt){
        const res = oldUpdate.apply(this, arguments);

        try{
          if(state === "play" && magnetAbility.active > 0 && Array.isArray(coins)){
            for(const c of coins){
              const dx = player.x - c.x;
              const dy = player.y - c.y;
              const dist = Math.hypot(dx, dy) || 1;

              if(dist < magnetAbility.range){
                const force = (1 - dist / magnetAbility.range) * 2;
                c.x += (dx / dist) * magnetAbility.pullSpeed * force * dt;
                c.y += (dy / dist) * magnetAbility.pullSpeed * force * dt;
              }
            }
          }
        }catch(e){}

        return res;
      };
      window.__magnetFix2 = true;
    }

    if(typeof drawGame === "function" && !window.__magnetDrawFix2){
      const oldDraw = drawGame;
      drawGame = function(){
        const res = oldDraw.apply(this, arguments);

        try{
          if(state === "play" && magnetAbility.active > 0){
            gameCtx.save();
            gameCtx.strokeStyle = "rgba(255,216,90,0.5)";
            gameCtx.lineWidth = 2;
            gameCtx.beginPath();
            gameCtx.arc(player.x, player.y, magnetAbility.range, 0, Math.PI*2);
            gameCtx.stroke();
            gameCtx.restore();
          }
        }catch(e){}

        return res;
      };
      window.__magnetDrawFix2 = true;
    }
  }

  setInterval(fixMagnet, 300);
  window.addEventListener("load", fixMagnet);
})();
</script>


<!-- MAGNET SMOOTH UPGRADE -->
<script>
(function(){
  function upgradeMagnet(){
    if(!window.magnetAbility) return;

    magnetAbility.range = 180;
    magnetAbility.pullSpeed = 700;

    if(typeof update === "function" && !window.__magnetSmooth){
      const oldUpdate = update;
      update = function(dt){
        const res = oldUpdate.apply(this, arguments);

        try{
          if(state === "play" && magnetAbility.active > 0 && Array.isArray(coins)){
            for(const c of coins){
              const dx = player.x - c.x;
              const dy = player.y - c.y;
              const dist = Math.hypot(dx, dy) || 1;

              if(dist < magnetAbility.range){
                // smoother easing
                const t = 1 - (dist / magnetAbility.range);
                const ease = t * t; // quadratic easing

                // leichte Spiralbewegung
                const angle = Math.atan2(dy, dx) + 0.5 * t;

                c.x += Math.cos(angle) * magnetAbility.pullSpeed * ease * dt;
                c.y += Math.sin(angle) * magnetAbility.pullSpeed * ease * dt;
              }
            }
          }
        }catch(e){}

        return res;
      };
      window.__magnetSmooth = true;
    }
  }

  setInterval(upgradeMagnet, 300);
  window.addEventListener("load", upgradeMagnet);
})();
</script>

<script id="keep-left-remove-bottom-abilities-script">
(function(){
  function fixAbilityUi(){
    const bottom = document.getElementById("abilityHudBar");
    if (bottom) {
      bottom.style.display = "none";
      bottom.style.visibility = "hidden";
      bottom.style.pointerEvents = "none";
    }

    const left = document.getElementById("touchAbilities");
    if (left) {
      try {
        const inGame = typeof state !== "undefined" && state === "play";
        left.style.display = inGame ? "flex" : "none";
      } catch(e) {
        left.style.display = "flex";
      }
      left.style.visibility = "visible";
      left.style.pointerEvents = "auto";

      left.querySelectorAll(".touchAbilityBtn").forEach(function(btn){
        btn.style.display = "block";
        btn.style.visibility = "visible";
        btn.style.pointerEvents = "auto";
      });
    }
  }

  // If previous patch emptied the left buttons, rebuild them.
  function rebuildLeftButtonsIfNeeded(){
    const left = document.getElementById("touchAbilities");
    if (!left) return;

    if (left.children.length === 0) {
      left.innerHTML = `
        <button id="dashTouchBtn" class="touchAbilityBtn" type="button">Dash (Space)</button>
        <button id="shieldTouchBtn" class="touchAbilityBtn" type="button">Shield (Q)</button>
        <button id="teleportTouchBtn" class="touchAbilityBtn" type="button">Teleport (E)</button>
        <button id="speedTouchBtn" class="touchAbilityBtn" type="button">Speed (Shift)</button>
        <button id="magnetTouchBtn" class="touchAbilityBtn" type="button">Magnet (M)</button>
      `;

      const bind = (id, fn) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener("click", function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          try { fn(); } catch(e){}
        }, true);
        btn.addEventListener("touchstart", function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          try { fn(); } catch(e){}
        }, { passive:false });
      };

      bind("dashTouchBtn", function(){ if (typeof tryDash === "function") tryDash(); });
      bind("shieldTouchBtn", function(){
        if (typeof useShield === "function") return useShield();
        if (typeof abilityState !== "undefined" && save.ownedAbilities && save.ownedAbilities.shield && abilityState.shieldCooldown <= 0) {
          player.invuln = Math.max(player.invuln, 3.05);
          abilityState.shieldActive = 3.0;
          abilityState.shieldCooldown = 18.0;
          if (typeof updateAbilityUI === "function") updateAbilityUI();

      bind("teleportTouchBtn", function(){
        if (typeof useTeleport === "function") return useTeleport();
        if (typeof abilityState !== "undefined" && save.ownedAbilities && save.ownedAbilities.teleport && abilityState.teleportCooldown <= 0) {
          const pos = randomFreeCircle(player.r + 8);
          player.x = pos.x;
          player.y = pos.y;
          abilityState.teleportCooldown = 10.0;
          if (typeof updateAbilityUI === "function") updateAbilityUI();
        }
      });
      bind("speedTouchBtn", function(){
        if (typeof useSpeed === "function") return useSpeed();
        if (typeof abilityState !== "undefined" && save.ownedAbilities && save.ownedAbilities.speed && abilityState.speedCooldown <= 0) {
          abilityState.speedActive = 3.0;
          abilityState.speedCooldown = 14.0;
          if (typeof updateAbilityUI === "function") updateAbilityUI();
        }
      });
      bind("magnetTouchBtn", function(){
        const ev = new KeyboardEvent("keydown", { code:"KeyM", key:"m", bubbles:true });
        document.dispatchEvent(ev);
      });
    }
  }

  function run(){

    fixAbilityUi();
  }

  document.addEventListener("DOMContentLoaded", run);
  window.addEventListener("load", run);
  setInterval(run, 250);
})();

<!-- FINAL UI + DASH DIRECTION FIX -->
<style id="final-ui-dash-fix-style">
  /* Linke Ability-Buttons nur im echten Spiel sichtbar */
  body:not(.ga-playing) #touchAbilities,
  body.ga-overlay-open #touchAbilities {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
</style>

<script id="final-ui-dash-fix-script">
(function(){
  window.__lastMoveDir = window.__lastMoveDir || { x: 1, y: 0 };

  function overlayOpen(){
    const ids = ["menuOverlay", "shopOverlay", "leaderboardOverlay", "gameOverOverlay", "lbSetupOverlay"];
    return ids.some(function(id){
      const el = document.getElementById(id);
      return el && el.classList && el.classList.contains("show");
    });
  }

  function updateBodyState(){
    let playing = false;
    try { playing = state === "play" && !overlayOpen(); } catch(e){}
    document.body.classList.toggle("ga-playing", playing);
    document.body.classList.toggle("ga-overlay-open", overlayOpen());

    const touch = document.getElementById("touchAbilities");
    if (touch) {
      touch.style.display = playing ? "flex" : "none";
      touch.style.visibility = playing ? "visible" : "hidden";
      touch.style.pointerEvents = playing ? "auto" : "none";
    }
  }

  function getJoystickDir(){
    const wrap = document.getElementById("joystickWrap");
    const knob = document.getElementById("joystickKnob");
    if (!wrap || !knob) return null;

    const wr = wrap.getBoundingClientRect();
    const kr = knob.getBoundingClientRect();

    if (wr.width <= 0 || kr.width <= 0) return null;

    const wx = wr.left + wr.width / 2;
    const wy = wr.top + wr.height / 2;
    const kx = kr.left + kr.width / 2;
    const ky = kr.top + kr.height / 2;

    const dx = kx - wx;
    const dy = ky - wy;
    const len = Math.hypot(dx, dy);

    if (len < 8) return null;
    return { x: dx / len, y: dy / len };
  }

  function keyboardDir(){
    let dx = 0;
    let dy = 0;

    try {
      if (keys["w"] || keys["W"] || keys["ArrowUp"]) dy -= 1;
      if (keys["s"] || keys["S"] || keys["ArrowDown"]) dy += 1;
      if (keys["a"] || keys["A"] || keys["ArrowLeft"]) dx -= 1;
      if (keys["d"] || keys["D"] || keys["ArrowRight"]) dx += 1;
    } catch(e){}

    const len = Math.hypot(dx, dy);
    if (len < 0.01) return null;
    return { x: dx / len, y: dy / len };
  }

  function currentMoveDir(){
    const joy = getJoystickDir();
    const key = keyboardDir();
    const dir = joy || key;

    if (dir) {
      window.__lastMoveDir.x = dir.x;
      window.__lastMoveDir.y = dir.y;
      return dir;
    }

    return window.__lastMoveDir || { x: 1, y: 0 };
  }

  function patchMovementMemory(){
    try {
      if (typeof update === "function" && !window.__dashMoveMemoryPatched) {
        const oldUpdate = update;
        update = function(dt){
          const dir = getJoystickDir() || keyboardDir();
          if (dir) {
            window.__lastMoveDir.x = dir.x;
            window.__lastMoveDir.y = dir.y;
          }
          const result = oldUpdate.apply(this, arguments);
          updateBodyState();
          return result;
        };
        window.__dashMoveMemoryPatched = true;
      }
    } catch(e){}
  }

  function patchDash(){
    try {
      if (typeof tryDash === "function" && !window.__dashAnyDirectionPatched) {
        tryDash = function(){
          try {
            if (state !== "play" || overlayOpen()) return;
            if (player.dashCooldown > 0) return;

            const dir = currentMoveDir();
            const len = Math.hypot(dir.x, dir.y) || 1;

            player.dashDx = dir.x / len;
            player.dashDy = dir.y / len;
            player.dashTime = GAME.dashDuration;
            player.dashCooldown = GAME.dashCooldown;

            for (let i = 0; i < 12; i++) {
              if (typeof makeParticle === "function") {
                particles.push(makeParticle(player.x, player.y, (typeof currentSkin === "function" ? currentSkin().color : "#31e8ff"), 190));
              }
            }

            if (typeof updateHud === "function") updateHud();
          } catch(e){}
        };
        window.__dashAnyDirectionPatched = true;
      }
    } catch(e){}
  }

  function fixAbilityVisibility(){
    updateBodyState();

    // Auch dynamische Buttons nur im Spiel sichtbar halten
    document.querySelectorAll("#touchAbilities, .touchAbilityBtn").forEach(function(el){
      let playing = document.body.classList.contains("ga-playing") && !document.body.classList.contains("ga-overlay-open");
      if (el.id === "touchAbilities") {
        el.style.display = playing ? "flex" : "none";
      } else {
        el.style.display = playing ? "block" : "none";
      }
      el.style.visibility = playing ? "visible" : "hidden";
      el.style.pointerEvents = playing ? "auto" : "none";
    });
  }

  function install(){
    patchMovementMemory();
    patchDash();
    fixAbilityVisibility();
  }

  install();
  document.addEventListener("DOMContentLoaded", install);
  window.addEventListener("load", install);
  document.addEventListener("click", function(){ setTimeout(install, 40); }, true);
  document.addEventListener("touchstart", function(){ setTimeout(install, 40); }, true);
  setInterval(install, 200);
})();
</script>
<!-- END FINAL UI + DASH DIRECTION FIX -->

<script>
(function(){
  // remove aggressive interval changes
  if(window.__magnetFlickerFixed) return;
  window.__magnetFlickerFixed = true;

  function stabilizeMagnet(){
    try{
      if(!window.magnetAbility) return;

      magnetAbility.range = 90;

      // ensure smooth constant state (no toggling)
      if(typeof update === "function" && !window.__magnetDrawPatched){
        const oldUpdate = update;
        update = function(dt){
          const res = oldUpdate.apply(this, arguments);

          // draw ONLY if active (prevents flicker)
          if(state === "play" && magnetAbility.active > 0){
            magnetAbility._visible = true;
          } else {
            magnetAbility._visible = false;
          }

          return res;
        };

        window.__magnetDrawPatched = true;
      }
    }catch(e){}
  }

  stabilizeMagnet();
  window.addEventListener("load", stabilizeMagnet);
})();
</script>


<!-- SMOOTHER + SLOWER MAGNET PULL -->
<script>
(function(){
  if(window.__magnetSmoothSlow) return;
  window.__magnetSmoothSlow = true;

  function patchMagnet(){
    try{
      if(typeof update === "function" && !window.__magnetSlowPatched){
        const oldUpdate = update;

        update = function(dt){
          const res = oldUpdate.apply(this, arguments);

          try{
            if(state === "play" && magnetAbility && magnetAbility.active > 0 && Array.isArray(coins)){
              for(const c of coins){
                const dx = player.x - c.x;
                const dy = player.y - c.y;
                const dist = Math.hypot(dx, dy) || 1;

                if(dist < magnetAbility.range){
                  // softer pull (langsamer + smooth)
                  const t = 1 - (dist / magnetAbility.range);
                  const ease = t * t * 0.6; // deutlich langsamer

                  const nx = dx / dist;
                  const ny = dy / dist;

                  c.x += nx * 300 * ease * dt; // langsamer speed
                  c.y += ny * 300 * ease * dt;
                }
              }
            }
          }catch(e){}

          return res;
        };

        window.__magnetSlowPatched = true;
      }
    }catch(e){}
  }

  patchMagnet();
  window.addEventListener("load", patchMagnet);
})();
</script>
