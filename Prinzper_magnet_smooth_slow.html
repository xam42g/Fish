  }
  function setCoins(v){
    v=Math.max(0,Math.floor(v));
    try{if(typeof save!=="undefined"){save.totalCoins=v;if(typeof saveGame==="function")saveGame()}}catch(e){}
    data.coins=v;saveLocal();
  }
  function sync(){
    try{
      if(typeof save!=="undefined"){
        save.unlockedSkins=Object.assign(save.unlockedSkins||{},data.skins);
        save.unlockedBackgrounds=Object.assign(save.unlockedBackgrounds||{},data.bgs);
        save.ownedAbilities=Object.assign(save.ownedAbilities||{},data.abilities);
        save.selectedSkin=data.skin;
        save.selectedBackground=data.bg;
        if(typeof saveGame==="function")saveGame();
      }
    }catch(e){}
  }

  function itemHtml(name,desc,preview,btn){
    return '<div class="shopPatchItem"><div class="shopPatchPreview" style="'+preview+'"></div><div class="shopPatchName">'+name+'</div><div class="shopPatchDesc">'+desc+'</div>'+btn+'</div>';
  }

  function render(tab){
    tab=tab||"skins";
    sync();
    const overlay=document.getElementById("shopOverlay");
    if(!overlay)return;
    const card=overlay.querySelector(".card");
    if(!card)return;
    card.innerHTML='<div class="shopPatchHead"><h2>Shop</h2><div class="shopPatchCoins">Coins: <span id="patchCoins">'+coins()+'</span></div></div><div class="shopPatchTabs"><button id="patchTabSkins" class="secondary">Skins</button><button id="patchTabBgs" class="secondary">Backgrounds</button><button id="patchTabAbs" class="secondary">Abilities</button></div><div id="patchGrid" class="shopPatchGrid"></div><button id="closeShopBtn" class="secondary" style="margin-top:14px">Close</button>';
    document.getElementById("patchTabSkins").classList.toggle("active",tab==="skins");
    document.getElementById("patchTabBgs").classList.toggle("active",tab==="bgs");
    document.getElementById("patchTabAbs").classList.toggle("active",tab==="abs");
    document.getElementById("patchTabSkins").onclick=()=>render("skins");
    document.getElementById("patchTabBgs").onclick=()=>render("bgs");
    document.getElementById("patchTabAbs").onclick=()=>render("abs");
    document.getElementById("closeShopBtn").onclick=()=>{overlay.classList.remove("show");try{if(typeof state!=="undefined"&&state==="pause")state="play"}catch(e){}};
    const grid=document.getElementById("patchGrid");
    if(tab==="skins"){
      SKINS.forEach(x=>{
        const owned=!!data.skins[x[0]], selected=data.skin===x[0];
        const div=document.createElement("div");
        const txt=selected?"Equipped":owned?"Equip":x[2]+" Coins";
        div.innerHTML=itemHtml(x[1],x[4],"background:radial-gradient(circle at 35% 30%,#fff,"+x[3]+" 35%,#08111d 100%)",'<button class="'+(selected?"active":"")+'">'+txt+'</button>');
        div.firstChild.querySelector("button").onclick=()=>{if(!owned){if(coins()<x[2])return;setCoins(coins()-x[2]);data.skins[x[0]]=true}data.skin=x[0];saveLocal();sync();try{if(typeof updateHud==="function")updateHud();if(typeof drawGame==="function")drawGame()}catch(e){}render("skins")};
        grid.appendChild(div.firstChild);
      });
    }
    if(tab==="bgs"){
      BGS.forEach(x=>{
        const owned=!!data.bgs[x[0]], selected=data.bg===x[0];
        const div=document.createElement("div");
        const txt=selected?"Active":owned?"Use":x[2]+" Coins";
        div.innerHTML=itemHtml(x[1],x[4],"background:"+x[3],'<button class="'+(selected?"active":"")+'">'+txt+'</button>');
        div.firstChild.querySelector("button").onclick=()=>{if(!owned){if(coins()<x[2])return;setCoins(coins()-x[2]);data.bgs[x[0]]=true}data.bg=x[0];saveLocal();sync();try{if(typeof drawStarfield==="function")drawStarfield();if(typeof drawGame==="function")drawGame();if(typeof updateHud==="function")updateHud()}catch(e){}render("bgs")};
        grid.appendChild(div.firstChild);
      });
    }
    if(tab==="abs"){
      ABS.forEach(x=>{
        const owned=!!data.abilities[x[0]];
        const div=document.createElement("div");
        const txt=owned?"Bought":x[2]+" Coins";
        div.innerHTML=itemHtml(x[1],x[4],"background:radial-gradient(circle at 35% 30%,#fff,"+x[3]+" 35%,#08111d 100%)",'<button class="'+(owned?"active":"")+'" '+(owned?"disabled":"")+'>'+txt+'</button>');
        div.firstChild.querySelector("button").onclick=()=>{if(owned)return;if(coins()<x[2])return;setCoins(coins()-x[2]);data.abilities[x[0]]=true;if(x[0]==="heart"){try{if(typeof player!=="undefined"&&player&&player.lives<5)player.lives++}catch(e){}}saveLocal();sync();try{if(typeof updateHud==="function")updateHud();if(typeof updateAbilityUI==="function")updateAbilityUI()}catch(e){}render("abs")};
        grid.appendChild(div.firstChild);
      });
    }
  }

  function openShop(ev){
    if(ev){ev.preventDefault();ev.stopPropagation()}
    render("skins");
    const overlay=document.getElementById("shopOverlay");
    if(overlay)overlay.classList.add("show");
    try{if(typeof state!=="undefined"&&state==="play")state="pause"}catch(e){}
  }

  function install(){
    sync();
    ["openShopFromMenu","shopBtn"].forEach(id=>{
      const b=document.getElementById(id);
      if(b&&!b.dataset.patchShop){b.dataset.patchShop="1";b.addEventListener("click",openShop,true)}
    });
  }

  install();
  document.addEventListener("DOMContentLoaded",install);
  window.addEventListener("load",install);
  window.openFinalShop=openShop;
})();
</script>

<!-- FORCE ONE SHOP ONLY PATCH -->
<script id="force-one-shop-only">
(function () {
  function findShopOverlay() {
    return document.getElementById("shopOverlay");
  }

  function closeGameOverBeforeShop() {
    const go = document.getElementById("gameOverOverlay");
    if (go) go.classList.remove("show");
  }

  function openOnlyNewShop(ev) {
    if (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();
    }

    closeGameOverBeforeShop();

    if (typeof window.openFinalShop === "function") {
      window.openFinalShop();
      return false;
    }

    if (typeof window.finalShopRender === "function") {
      window.finalShopRender("skins");
      const overlay = findShopOverlay();
      if (overlay) overlay.classList.add("show");
      return false;
    }

    const overlay = findShopOverlay();
    if (overlay) overlay.classList.add("show");
    return false;
  }

  function patchShopButtons() {
    const buttons = Array.from(document.querySelectorAll("button"));
    buttons.forEach(function (btn) {
      const txt = (btn.textContent || "").trim().toLowerCase();
      if (
        btn.id === "shopBtn" ||
        btn.id === "openShopFromMenu" ||
        btn.id === "shopBtn2" ||
        txt === "shop"
      ) {
        if (btn.dataset.oneShopOnly === "1") return;
        btn.dataset.oneShopOnly = "1";

        const clone = btn.cloneNode(true);
        btn.parentNode.replaceChild(clone, btn);
        clone.dataset.oneShopOnly = "1";
        clone.addEventListener("click", openOnlyNewShop, true);
      }
    });
  }

  const oldShowShop = window.showShop;
  window.showShop = function () {
    return openOnlyNewShop();
  };

  document.addEventListener("click", function (ev) {
    const btn = ev.target.closest && ev.target.closest("button");
    if (!btn) return;

    const txt = (btn.textContent || "").trim().toLowerCase();
    if (
      btn.id === "shopBtn" ||
      btn.id === "openShopFromMenu" ||
      btn.id === "shopBtn2" ||
      txt === "shop"
    ) {
      openOnlyNewShop(ev);
    }
  }, true);

  patchShopButtons();
  document.addEventListener("DOMContentLoaded", patchShopButtons);
  window.addEventListener("load", patchShopButtons);
  setInterval(patchShopButtons, 500);
})();
</script>
<!-- END FORCE ONE SHOP ONLY PATCH -->

<script id="ads-shop-fourth-tab-script">
(function(){
  const ADS_KEY = "final_ads_shop_v1";

  function loadAds(){
    try { return JSON.parse(localStorage.getItem(ADS_KEY)) || {}; }
    catch(e){ return {}; }
  }

  function saveAds(){
    localStorage.setItem(ADS_KEY, JSON.stringify(adsData));
  }

  let adsData = loadAds();
  adsData.adsWatched = Number(adsData.adsWatched || 0);
  adsData.doubleNextRun = !!adsData.doubleNextRun;
  adsData.skins = adsData.skins || {};
  adsData.bgs = adsData.bgs || {};
  adsData.selectedSkin = adsData.selectedSkin || "";
  adsData.selectedBg = adsData.selectedBg || "";

  const AD_SKINS = [
    ["rainbow", "Rainbow Skin", 3, "linear-gradient(90deg,#ff004c,#ffb300,#4dff4d,#00d5ff,#8a5cff,#ff4df0)", "Animierter Regenbogen-Look"],
    ["plasma", "Plasma Core", 6, "radial-gradient(circle,#ffffff,#7df9ff 20%,#742cff 55%,#06111d 100%)", "Extremer Neon-Core"],
    ["blackhole", "Black Hole", 10, "radial-gradient(circle,#ffffff 0%,#111 18%,#6b21a8 42%,#020617 100%)", "Dunkler Premium-Skin"]
  ];

  const AD_BACKGROUNDS = [
    ["rainbowrift", "Rainbow Rift", 5, "linear-gradient(135deg,#ff004c,#ffb300,#4dff4d,#00d5ff,#8a5cff)", "Bunter Energy-Rift"],
    ["crystalstorm", "Crystal Storm", 8, "radial-gradient(circle at 35% 25%,#ffffff,#7df9ff 18%,#1d4ed8 45%,#050816 100%)", "Kristall-Sturm"],
    ["voidlux", "Void Lux", 12, "radial-gradient(circle at 50% 50%,#ffd86b,#7c3aed 28%,#020617 72%)", "Gold/Void Hintergrund"]
  ];

  function getCoins(){
    try {
      if (typeof save !== "undefined" && typeof save.totalCoins === "number") return save.totalCoins;
    } catch(e){}
    try {
      const raw = localStorage.getItem("final_shop_patch_v2");
      const obj = raw ? JSON.parse(raw) : {};
      return Number(obj.coins || 0);
    } catch(e){}
    return 0;
  }

  function setCoins(v){
    v = Math.max(0, Math.floor(v));
    try {
      if (typeof save !== "undefined") {
        save.totalCoins = v;
        if (typeof saveGame === "function") saveGame();
      }
    } catch(e){}

    try {
      const key = "final_shop_patch_v2";
      const raw = localStorage.getItem(key);
      const obj = raw ? JSON.parse(raw) : {};
      obj.coins = v;
      localStorage.setItem(key, JSON.stringify(obj));
    } catch(e){}
  }

  function syncAdUnlocks(){
    try {
      if (typeof save !== "undefined") {
        save.rewardDoubleCoinsNextRun = adsData.doubleNextRun;
        save.unlockedSkins = Object.assign(save.unlockedSkins || {}, adsData.skins);
        save.unlockedBackgrounds = Object.assign(save.unlockedBackgrounds || {}, adsData.bgs);
        if (adsData.selectedSkin) save.selectedSkin = adsData.selectedSkin;
        if (adsData.selectedBg) save.selectedBackground = adsData.selectedBg;
        if (typeof saveGame === "function") saveGame();
      }
    } catch(e){}
  }

  function fakeWatchAd(callback){
    const btns = document.querySelectorAll("#patchGrid button");
    btns.forEach(b => b.disabled = true);
    setTimeout(function(){
      callback();
      saveAds();
      syncAdUnlocks();
      if (typeof renderShopWithAds === "function") renderShopWithAds("ads");
      try {
        if (typeof updateHud === "function") updateHud();
        if (typeof drawStarfield === "function") drawStarfield();
        if (typeof drawGame === "function") drawGame();
      } catch(e){}
    }, 350);
  }

  function adItemHtml(name, desc, preview, badge, btnText, disabled){
    return '<div class="shopPatchItem">' +
      '<div class="adRewardBadge">' + badge + '</div>' +
      '<div class="shopPatchPreview" style="background:' + preview + '"></div>' +
      '<div class="shopPatchName">' + name + '</div>' +
      '<div class="shopPatchDesc">' + desc + '</div>' +
      '<button ' + (disabled ? 'disabled' : '') + '>' + btnText + '</button>' +
    '</div>';
  }

  function renderAdsPanel(){
    const grid = document.getElementById("patchGrid");
    if (!grid) return;
    grid.innerHTML = "";

    const doubleBox = document.createElement("div");
    doubleBox.innerHTML = adItemHtml(
      "x2 Next Run",
      "Nächste Runde: alle Run-Coins werden verdoppelt.",
      "linear-gradient(135deg,#ffd86b,#ff8a00,#3b1b00)",
      "Reward Ad",
      adsData.doubleNextRun ? "Bereit" : "Ad ansehen",
      adsData.doubleNextRun
    );
    doubleBox.firstChild.querySelector("button").onclick = function(){
      if (adsData.doubleNextRun) return;
      fakeWatchAd(function(){
        adsData.adsWatched += 1;
        adsData.doubleNextRun = true;
      });
    };
    grid.appendChild(doubleBox.firstChild);

    const coinsBox = document.createElement("div");
    coinsBox.innerHTML = adItemHtml(
      "+30 Coins",
      "Ein Ad ansehen und direkt 30 Coins bekommen.",
      "radial-gradient(circle,#fff,#ffd85a 28%,#7a4b00 100%)",
      "Reward Ad",
      "Ad ansehen",
      false
    );
    coinsBox.firstChild.querySelector("button").onclick = function(){
      fakeWatchAd(function(){
        adsData.adsWatched += 1;
        setCoins(getCoins() + 30);
      });
    };
    grid.appendChild(coinsBox.firstChild);

    AD_SKINS.forEach(function(s){
      const unlocked = !!adsData.skins[s[0]];
      const selected = adsData.selectedSkin === s[0];
      const progress = Math.min(adsData.adsWatched, s[2]);
      const btnText = selected ? "Equipped" : unlocked ? "Equip" : "Ads " + progress + "/" + s[2];

      const box = document.createElement("div");
      box.innerHTML = adItemHtml(
        s[1],
        s[4],
        s[3],
        "Skin Reward",
        btnText,
        false
      );

      const btn = box.firstChild.querySelector("button");
      if (selected) btn.classList.add("active");

      btn.onclick = function(){
        if (!unlocked) {
          fakeWatchAd(function(){
            adsData.adsWatched += 1;
            if (adsData.adsWatched >= s[2]) adsData.skins[s[0]] = true;
          });
          return;
        }
        adsData.selectedSkin = s[0];
        saveAds();
        syncAdUnlocks();
        try {
          if (typeof updateHud === "function") updateHud();
          if (typeof drawGame === "function") drawGame();
        } catch(e){}
        renderShopWithAds("ads");
      };

      grid.appendChild(box.firstChild);
    });

    AD_BACKGROUNDS.forEach(function(b){
      const unlocked = !!adsData.bgs[b[0]];
      const selected = adsData.selectedBg === b[0];
      const progress = Math.min(adsData.adsWatched, b[2]);
      const btnText = selected ? "Active" : unlocked ? "Use" : "Ads " + progress + "/" + b[2];

      const box = document.createElement("div");
      box.innerHTML = adItemHtml(
        b[1],
        b[4],
        b[3],
        "Background Reward",
        btnText,
        false
      );

      const btn = box.firstChild.querySelector("button");
      if (selected) btn.classList.add("active");

      btn.onclick = function(){
        if (!unlocked) {
          fakeWatchAd(function(){
            adsData.adsWatched += 1;
            if (adsData.adsWatched >= b[2]) adsData.bgs[b[0]] = true;
          });
          return;
        }
        adsData.selectedBg = b[0];
        saveAds();
        syncAdUnlocks();
        try {
          if (typeof drawStarfield === "function") drawStarfield();
          if (typeof drawGame === "function") drawGame();
        } catch(e){}
        renderShopWithAds("ads");
      };

      grid.appendChild(box.firstChild);
    });
  }

  function addAdsTabToRenderedShop(activeTab){
    const tabs = document.querySelector(".shopPatchTabs");
    if (!tabs || document.getElementById("patchTabAds")) return;

    const btn = document.createElement("button");
    btn.id = "patchTabAds";
    btn.className = "secondary" + (activeTab === "ads" ? " active" : "");
    btn.textContent = "Ads";
    btn.onclick = function(){ renderShopWithAds("ads"); };
    tabs.appendChild(btn);
  }

  const oldOpenFinalShop = window.openFinalShop;
  const oldFinalShopRender = window.finalShopRender;

  window.renderShopWithAds = function(tab){
    tab = tab || "skins";

    if (tab === "ads") {
      if (typeof oldFinalShopRender === "function") oldFinalShopRender("skins");
      else if (typeof oldOpenFinalShop === "function") oldOpenFinalShop();

      addAdsTabToRenderedShop("ads");

      const tabButtons = document.querySelectorAll(".shopPatchTabs button");
      tabButtons.forEach(function(b){ b.classList.remove("active"); });
      const adBtn = document.getElementById("patchTabAds");
      if (adBtn) adBtn.classList.add("active");

      renderAdsPanel();
      const coin = document.getElementById("patchCoins");
      if (coin) coin.textContent = getCoins();
      return;
    }

    if (typeof oldFinalShopRender === "function") oldFinalShopRender(tab);
    else if (typeof oldOpenFinalShop === "function") oldOpenFinalShop();

    addAdsTabToRenderedShop(tab);
  };

  window.finalShopRender = window.renderShopWithAds;

  window.openFinalShop = function(){
    window.renderShopWithAds("skins");
    const overlay = document.getElementById("shopOverlay");
    if (overlay) overlay.classList.add("show");
    try {
      if (typeof state !== "undefined" && state === "play") state = "pause";
    } catch(e){}
  };

  syncAdUnlocks();

  document.addEventListener("click", function(ev){
    const btn = ev.target.closest && ev.target.closest("button");
    if (!btn) return;
    const txt = (btn.textContent || "").trim().toLowerCase();
    if (txt === "shop" || btn.id === "shopBtn" || btn.id === "openShopFromMenu" || btn.id === "shopBtn2") {
      setTimeout(function(){
        addAdsTabToRenderedShop("skins");
      }, 20);
    }
  }, true);
})();
</script>
<!-- END ADS SHOP FOURTH TAB PATCH -->


<!-- FIX AD SKIN/BACKGROUND APPLY IN GAME -->
<script id="fix-ad-rewards-apply">
(function(){
  const ADS_KEY = "final_ads_shop_v1";
  const SHOP_KEY = "final_shop_patch_v2";

  const EXTRA_SKINS = [
    { id:"rainbow", name:"Rainbow Skin", color:"#ffffff", price:0 },
    { id:"plasma", name:"Plasma Core", color:"#7df9ff", price:0 },
    { id:"blackhole", name:"Black Hole", color:"#111111", price:0 }
  ];

  const EXTRA_BACKGROUNDS = [
    { id:"rainbowrift", name:"Rainbow Rift", price:0 },
    { id:"crystalstorm", name:"Crystal Storm", price:0 },
    { id:"voidlux", name:"Void Lux", price:0 }
  ];

  function loadJson(key){
    try { return JSON.parse(localStorage.getItem(key)) || {}; }
    catch(e){ return {}; }
  }

  function saveJson(key, obj){
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e){}
  }

  function addMissingShopItems(){
    try {
      if (typeof skins !== "undefined" && Array.isArray(skins)) {
        EXTRA_SKINS.forEach(function(s){
          if (!skins.find(function(x){ return x.id === s.id; })) skins.push(s);
        });
      }
    } catch(e){}

    try {
      if (typeof backgrounds !== "undefined" && Array.isArray(backgrounds)) {
        EXTRA_BACKGROUNDS.forEach(function(b){
          if (!backgrounds.find(function(x){ return x.id === b.id; })) backgrounds.push(b);
        });
      }
    } catch(e){}
  }

  function applyAdSelection(){
    addMissingShopItems();

    const ads = loadJson(ADS_KEY);
    const shop = loadJson(SHOP_KEY);

    if (!ads.skins) ads.skins = {};
    if (!ads.bgs) ads.bgs = {};

    // Important: also write the selection into the normal shop save,
    // because the normal shop sync can overwrite the ad selection.
    if (ads.selectedSkin) {
      shop.skin = ads.selectedSkin;
      shop.skins = shop.skins || {};
      shop.skins[ads.selectedSkin] = true;
    }

    if (ads.selectedBg) {
      shop.bg = ads.selectedBg;
      shop.bgs = shop.bgs || {};
      shop.bgs[ads.selectedBg] = true;
    }

    saveJson(SHOP_KEY, shop);

    try {
      if (typeof save !== "undefined") {
        save.unlockedSkins = Object.assign(save.unlockedSkins || {}, ads.skins || {}, shop.skins || {});
        save.unlockedBackgrounds = Object.assign(save.unlockedBackgrounds || {}, ads.bgs || {}, shop.bgs || {});
        if (ads.selectedSkin) save.selectedSkin = ads.selectedSkin;
        if (ads.selectedBg) save.selectedBackground = ads.selectedBg;
        if (typeof saveGame === "function") saveGame();
      }
    } catch(e){}
  }

  function paintAdBackground(ctx){
    try {
      if (typeof save === "undefined" || !save || !save.selectedBackground) return false;
      const bg = save.selectedBackground;
      if (!["rainbowrift","crystalstorm","voidlux"].includes(bg)) return false;

      ctx.clearRect(0, 0, GAME.w, GAME.h);

      if (bg === "rainbowrift") {
        const g = ctx.createLinearGradient(0, 0, GAME.w, GAME.h);
        g.addColorStop(0, "#ff004c");
        g.addColorStop(.18, "#ffb300");
        g.addColorStop(.38, "#4dff4d");
        g.addColorStop(.58, "#00d5ff");
        g.addColorStop(.78, "#8a5cff");
        g.addColorStop(1, "#070914");
        ctx.fillStyle = g;
        ctx.fillRect(0,0,GAME.w,GAME.h);
        for (let i=0;i<10;i++){
          ctx.strokeStyle = "rgba(255,255,255,.10)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(GAME.w/2, GAME.h/2, 90+i*55, 0, Math.PI*2);
          ctx.stroke();
        }
      }

      if (bg === "crystalstorm") {
        const g = ctx.createRadialGradient(GAME.w*.35,GAME.h*.25,20,GAME.w*.5,GAME.h*.5,720);
        g.addColorStop(0, "#ffffff");
        g.addColorStop(.14, "#7df9ff");
        g.addColorStop(.38, "#1d4ed8");
        g.addColorStop(1, "#050816");
        ctx.fillStyle = g;
        ctx.fillRect(0,0,GAME.w,GAME.h);
        for (let i=0;i<26;i++){
          ctx.fillStyle = "rgba(180,245,255,.18)";
          ctx.beginPath();
          const x = (i*97)%GAME.w;
          const y = (i*61)%GAME.h;
          ctx.moveTo(x,y-18);
          ctx.lineTo(x+14,y);
          ctx.lineTo(x,y+18);
          ctx.lineTo(x-14,y);
          ctx.closePath();
          ctx.fill();
        }
      }

      if (bg === "voidlux") {
        const g = ctx.createRadialGradient(GAME.w*.5,GAME.h*.5,20,GAME.w*.5,GAME.h*.5,690);
        g.addColorStop(0, "#ffd86b");
        g.addColorStop(.25, "#7c3aed");
        g.addColorStop(.62, "#111827");
        g.addColorStop(1, "#020617");
        ctx.fillStyle = g;
        ctx.fillRect(0,0,GAME.w,GAME.h);
      }

      // stars / particles on top
      for (let i=0;i<110;i++){
        const x = (i*83 + (performance.now()*.012)) % GAME.w;
        const y = (i*47) % GAME.h;
        ctx.fillStyle = "rgba(255,255,255," + (.16 + (i%5)*.06) + ")";
        ctx.beginPath();
        ctx.arc(x,y,1+(i%3),0,Math.PI*2);
        ctx.fill();
      }

      return true;
    } catch(e){
      return false;
    }
  }

  function installDrawPatches(){
    try {
      if (typeof drawBackgroundScene === "function" && !window.__adBgDrawPatched) {
        const oldBg = drawBackgroundScene;
        drawBackgroundScene = function(ctx){
          applyAdSelection();
          if (paintAdBackground(ctx)) return;
          return oldBg.apply(this, arguments);
        };
        window.__adBgDrawPatched = true;
      }
    } catch(e){}

    try {
      if (typeof drawPlayer === "function" && !window.__adSkinDrawPatched) {
        const oldPlayer = drawPlayer;
        drawPlayer = function(){
          applyAdSelection();

          if (typeof save === "undefined" || !save) return oldPlayer.apply(this, arguments);

          const id = save.selectedSkin;
          if (!["rainbow","plasma","blackhole"].includes(id)) {
            return oldPlayer.apply(this, arguments);
          }

          const visible = !(player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 0);
          if (!visible) return;

          let fill = "#31e8ff";
          if (id === "rainbow") {
            fill = "hsl(" + ((performance.now()/8)%360) + "deg 95% 60%)";
          } else if (id === "plasma") {
            fill = "#7df9ff";
          } else if (id === "blackhole") {
            fill = "#111827";
          }

          if (id === "plasma") {
            gameCtx.beginPath();
            gameCtx.fillStyle = "rgba(125,249,255,.25)";
            gameCtx.arc(player.x, player.y, player.r + 14, 0, Math.PI * 2);
            gameCtx.fill();
          }

          if (id === "blackhole") {
            gameCtx.beginPath();
            gameCtx.fillStyle = "rgba(124,58,237,.28)";
            gameCtx.arc(player.x, player.y, player.r + 13, 0, Math.PI * 2);
            gameCtx.fill();
          }

          gameCtx.beginPath();
          gameCtx.fillStyle = fill;
          gameCtx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
          gameCtx.fill();

          gameCtx.fillStyle = "#fff";
          gameCtx.beginPath();
          gameCtx.arc(player.x - 5, player.y - 4, 4, 0, Math.PI * 2);
          gameCtx.arc(player.x + 6, player.y - 4, 4, 0, Math.PI * 2);
          gameCtx.fill();

          gameCtx.fillStyle = "#07101d";
          gameCtx.beginPath();
          gameCtx.arc(player.x - 4, player.y - 4, 2, 0, Math.PI * 2);
          gameCtx.arc(player.x + 7, player.y - 4, 2, 0, Math.PI * 2);
          gameCtx.fill();

          gameCtx.strokeStyle = "#07101d";
          gameCtx.lineWidth = 3;
          gameCtx.beginPath();
          gameCtx.arc(player.x, player.y + 5, 6, 0, Math.PI);
          gameCtx.stroke();
        };
        window.__adSkinDrawPatched = true;
      }
    } catch(e){}
  }

  // Fix x2 multiplier application if the ad multiplier was selected.
  function installStartAndEndPatches(){
    try {
      if (typeof startGame === "function" && !window.__adStartPatched) {
        const oldStart = startGame;
        startGame = function(){
          applyAdSelection();
          return oldStart.apply(this, arguments);
        };
        window.__adStartPatched = true;
      }
    } catch(e){}

    try {
      if (typeof endRun === "function" && !window.__adEndPatched) {
        const oldEnd = endRun;
        endRun = async function(){
          const ads = loadJson(ADS_KEY);
          if (ads.doubleNextRun) {
            try { runCoins *= 2; } catch(e){}
            ads.doubleNextRun = false;
            saveJson(ADS_KEY, ads);
            try {
              if (typeof save !== "undefined") {
                save.rewardDoubleCoinsNextRun = false;
                if (typeof saveGame === "function") saveGame();
              }
            } catch(e){}
          }
          return await oldEnd.apply(this, arguments);
        };
        window.__adEndPatched = true;
      }
    } catch(e){}
  }

  // Patch ad equip buttons: whenever a rewarded skin/bg is equipped, copy it into normal shop storage too.
  function installClickSync(){
    document.addEventListener("click", function(){
      setTimeout(function(){
        applyAdSelection();
        try {
          if (typeof updateHud === "function") updateHud();
          if (typeof drawStarfield === "function") drawStarfield();
          if (typeof drawGame === "function") drawGame();
        } catch(e){}
      }, 80);
    }, true);
  }

  applyAdSelection();
  installDrawPatches();
  installStartAndEndPatches();
  installClickSync();

  document.addEventListener("DOMContentLoaded", function(){
    applyAdSelection();
    installDrawPatches();
    installStartAndEndPatches();
  });

  window.addEventListener("load", function(){
    applyAdSelection();
    installDrawPatches();
    installStartAndEndPatches();
    try {
      if (typeof drawStarfield === "function") drawStarfield();
      if (typeof drawGame === "function") drawGame();
    } catch(e){}
  });
})();
</script>

<!-- FIX ADS TAB NEVER DISAPPEARS -->
<script id="fix-ads-tab-persistent">
(function(){
  function ensureAdsTab(active){
    const tabs = document.querySelector(".shopPatchTabs");
    if (!tabs) return;

    let adsBtn = document.getElementById("patchTabAds");
    if (!adsBtn) {
      adsBtn = document.createElement("button");
      adsBtn.id = "patchTabAds";
      adsBtn.className = "secondary";
      adsBtn.textContent = "Ads";
      tabs.appendChild(adsBtn);
    }

    adsBtn.onclick = function(e){
      e.preventDefault();
      e.stopPropagation();
      if (typeof window.renderShopWithAds === "function") {
        window.renderShopWithAds("ads");
      } else if (typeof window.finalShopRender === "function") {
        window.finalShopRender("ads");
      }
    };

    if (active === "ads") {
      Array.from(tabs.querySelectorAll("button")).forEach(b => b.classList.remove("active"));
      adsBtn.classList.add("active");
    }
  }

  function wrapRender(name){
    const fn = window[name];
    if (typeof fn !== "function" || fn.__adsTabPersistent) return;

    const wrapped = function(tab){
      const result = fn.apply(this, arguments);
      setTimeout(function(){
        ensureAdsTab(tab);
      }, 0);
      return result;
    };

    wrapped.__adsTabPersistent = true;
    window[name] = wrapped;
  }

  function install(){
    wrapRender("finalShopRender");
    wrapRender("renderShopWithAds");

    const oldOpen = window.openFinalShop;
    if (typeof oldOpen === "function" && !oldOpen.__adsTabPersistent) {
      const wrappedOpen = function(){
        const result = oldOpen.apply(this, arguments);
        setTimeout(function(){ ensureAdsTab("skins"); }, 0);
        return result;
      };
      wrappedOpen.__adsTabPersistent = true;
      window.openFinalShop = wrappedOpen;
    }

    ensureAdsTab();
  }

  document.addEventListener("click", function(ev){
    const btn = ev.target.closest && ev.target.closest("button");
    if (!btn) return;

    const id = btn.id || "";
    if (id === "patchTabSkins" || id === "patchTabBgs" || id === "patchTabAbs") {
      setTimeout(function(){ ensureAdsTab(); }, 0);
      setTimeout(function(){ ensureAdsTab(); }, 80);
    }
  }, true);

  install();
  document.addEventListener("DOMContentLoaded", install);
  window.addEventListener("load", install);
  setInterval(function(){
    const shop = document.getElementById("shopOverlay");
    if (shop && shop.classList.contains("show")) ensureAdsTab();
  }, 300);
})();
</script>

<!-- FIX RETURN FROM SHOP/LEADERBOARD AFTER GAME OVER -->
<script id="fix-return-after-gameover">
(function(){
  function resetInputs(){
    try {
      if (typeof keys !== "undefined") {
        for (const k in keys) keys[k] = false;
      }
    } catch(e){}
    try { lastTime = performance.now(); } catch(e){}
  }

  function startFreshRun(){
    resetInputs();

    try {
      if (typeof resetRun === "function") resetRun();
    } catch(e){}

    try {
      const go = document.getElementById("gameOverOverlay");
      if (go) go.classList.remove("show");
      const shop = document.getElementById("shopOverlay");
      if (shop) shop.classList.remove("show");
      const lb = document.getElementById("leaderboardOverlay");
      if (lb) lb.classList.remove("show");
      const menu = document.getElementById("menuOverlay");
      if (menu) menu.classList.remove("show");
    } catch(e){}

    try { if (typeof hudTop !== "undefined") hudTop.style.display = "flex"; } catch(e){}
    try { if (typeof dock !== "undefined") dock.style.display = "none"; } catch(e){}
    try { state = "play"; } catch(e){}
  }

  function cameFromGameOver(){
    try {
      return !!window.__fromGameOverMenu || state === "gameover";
    } catch(e) {
      return !!window.__fromGameOverMenu;
    }
  }

  function markIfGameOver(){
    try {
      if (state === "gameover") window.__fromGameOverMenu = true;
    } catch(e){}
  }

  function closeOverlayFixed(type, ev){
    if (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();
    }

    const overlay = document.getElementById(type === "shop" ? "shopOverlay" : "leaderboardOverlay");
    if (overlay) overlay.classList.remove("show");

    if (cameFromGameOver()) {
      window.__fromGameOverMenu = false;
      startFreshRun();
      return false;
    }

    resetInputs();
    try {
      if (typeof menuOverlay !== "undefined" && menuOverlay.classList.contains("show")) return false;
    } catch(e){}

    try { state = "play"; } catch(e){}
    return false;
  }

  function patchButtons(){
    Array.from(document.querySelectorAll("button")).forEach(function(btn){
      const text = (btn.textContent || "").trim().toLowerCase();

      if (text === "shop" || btn.id === "shopBtn2" || btn.id === "shopBtn") {
        if (!btn.dataset.returnFixOpenShop) {
          btn.dataset.returnFixOpenShop = "1";
          btn.addEventListener("click", function(){ markIfGameOver(); }, true);
        }
      }

      if (text === "leaderboard" || btn.id === "leaderboardBtn2" || btn.id === "leaderboardBtn") {
        if (!btn.dataset.returnFixOpenLb) {
          btn.dataset.returnFixOpenLb = "1";
          btn.addEventListener("click", function(){ markIfGameOver(); }, true);
        }
      }

      if ((text === "close" || text === "zurück") && btn.closest("#shopOverlay")) {
        if (!btn.dataset.returnFixCloseShop) {
          btn.dataset.returnFixCloseShop = "1";
          btn.addEventListener("click", function(ev){ return closeOverlayFixed("shop", ev); }, true);
        }
      }

      if ((text === "close" || text === "zurück") && btn.closest("#leaderboardOverlay")) {
        if (!btn.dataset.returnFixCloseLb) {
          btn.dataset.returnFixCloseLb = "1";
          btn.addEventListener("click", function(ev){ return closeOverlayFixed("leaderboard", ev); }, true);
        }
      }
    });
  }

  const oldShowShop = window.showShop;
  if (typeof oldShowShop === "function" && !oldShowShop.__returnFix) {
    const wrapped = function(){
      markIfGameOver();
      return oldShowShop.apply(this, arguments);
    };
    wrapped.__returnFix = true;
    window.showShop = wrapped;
  }

  const oldShowLeaderboard = window.showLeaderboard;
  if (typeof oldShowLeaderboard === "function" && !oldShowLeaderboard.__returnFix) {
    const wrapped = async function(){
      markIfGameOver();
      return await oldShowLeaderboard.apply(this, arguments);
    };
    wrapped.__returnFix = true;
    window.showLeaderboard = wrapped;
  }

  const oldOpenFinalShop = window.openFinalShop;
  if (typeof oldOpenFinalShop === "function" && !oldOpenFinalShop.__returnFix) {
    const wrapped = function(){
      markIfGameOver();
      return oldOpenFinalShop.apply(this, arguments);
    };
    wrapped.__returnFix = true;
    window.openFinalShop = wrapped;
  }

  document.addEventListener("click", function(ev){
    const btn = ev.target.closest && ev.target.closest("button");
    if (!btn) return;
    const text = (btn.textContent || "").trim().toLowerCase();

    if (btn.closest("#shopOverlay") && (text === "close" || text === "zurück")) {
      closeOverlayFixed("shop", ev);
    }

    if (btn.closest("#leaderboardOverlay") && (text === "close" || text === "zurück")) {
      closeOverlayFixed("leaderboard", ev);
    }
  }, true);

  patchButtons();
  document.addEventListener("DOMContentLoaded", patchButtons);
  window.addEventListener("load", patchButtons);
  setInterval(patchButtons, 400);
})();
</script>
<!-- END FIX RETURN FROM SHOP/LEADERBOARD AFTER GAME OVER -->


<!-- VISUAL POLISH: NO SKIN EYES + REAL BLACK HOLE + COIN ABSORB ANIMATION -->
<script id="visual-polish-no-eyes-blackhole-coins">
(function(){
  const ADS_KEY = "final_ads_shop_v1";
  const SHOP_KEY = "final_shop_patch_v2";
  window.__coinAbsorbFx = window.__coinAbsorbFx || [];

  function loadJson(key){
    try { return JSON.parse(localStorage.getItem(key)) || {}; }
    catch(e){ return {}; }
  }

  function getSelectedSkinId(){
    try {
      const ads = loadJson(ADS_KEY);
      if (ads.selectedSkin) return ads.selectedSkin;
    } catch(e){}
    try {
      const shop = loadJson(SHOP_KEY);
      if (shop.skin) return shop.skin;
    } catch(e){}
    try {
      if (typeof save !== "undefined" && save.selectedSkin) return save.selectedSkin;
    } catch(e){}
    return "cyan";
  }

  function skinColor(id){
    if (id === "rainbow") return "rainbow";
    if (id === "plasma") return "#7df9ff";
    if (id === "blackhole") return "#030712";
    if (id === "lime") return "#63ff9d";
    if (id === "violet") return "#b77cff";
    if (id === "ruby") return "#ff4e73";
    if (id === "gold") return "#ffd85a";
    if (id === "orange") return "#ff9f43";
    return "#31e8ff";
  }

  function drawCleanPlayer(){
    if (typeof player === "undefined" || !player) return false;
    if (player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 0) return true;

    const id = getSelectedSkinId();
    const r = player.r || 14;
    const t = performance.now();

    // Special real black-hole skin
    if (id === "blackhole") {
      const rot = t / 450;

      gameCtx.save();
      gameCtx.translate(player.x, player.y);
      gameCtx.rotate(rot);

      // gravitational glow
      let glow = gameCtx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 3.1);
      glow.addColorStop(0, "rgba(255,255,255,0.12)");
      glow.addColorStop(0.22, "rgba(168,85,247,0.50)");
      glow.addColorStop(0.48, "rgba(59,130,246,0.24)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      gameCtx.fillStyle = glow;
      gameCtx.beginPath();
      gameCtx.arc(0, 0, r * 3.1, 0, Math.PI * 2);
      gameCtx.fill();

      // accretion disk
      for (let i = 0; i < 4; i++) {
        gameCtx.rotate(Math.PI / 8);
        gameCtx.strokeStyle = i % 2 === 0 ? "rgba(255,216,90,0.72)" : "rgba(124,58,237,0.70)";
        gameCtx.lineWidth = Math.max(2, r * 0.18);
        gameCtx.beginPath();
        gameCtx.ellipse(0, 0, r * (1.9 + i * 0.14), r * (0.58 + i * 0.06), 0, 0, Math.PI * 2);
        gameCtx.stroke();
      }

      // event horizon
      let core = gameCtx.createRadialGradient(-r * .25, -r * .25, 1, 0, 0, r * 1.18);
      core.addColorStop(0, "#111827");
      core.addColorStop(0.55, "#020617");
      core.addColorStop(1, "#000000");
      gameCtx.fillStyle = core;
      gameCtx.beginPath();
      gameCtx.arc(0, 0, r * 1.05, 0, Math.PI * 2);
      gameCtx.fill();

      // thin edge
      gameCtx.strokeStyle = "rgba(255,255,255,0.18)";
      gameCtx.lineWidth = 1.5;
      gameCtx.beginPath();
      gameCtx.arc(0, 0, r * 1.08, 0, Math.PI * 2);
      gameCtx.stroke();

      gameCtx.restore();
      return true;
    }

    // Normal skins: clean orb WITHOUT eyes/face
    let fill = skinColor(id);
    if (fill === "rainbow") fill = "hsl(" + ((t / 8) % 360) + "deg 95% 60%)";

    gameCtx.save();

    gameCtx.beginPath();
    gameCtx.fillStyle = "rgba(255,255,255,0.10)";
    gameCtx.arc(player.x, player.y, r + 8, 0, Math.PI * 2);
    gameCtx.fill();

    const grad = gameCtx.createRadialGradient(
      player.x - r * .45, player.y - r * .45, 2,
      player.x, player.y, r * 1.25
    );
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.18, fill);
    grad.addColorStop(1, "rgba(4,10,24,0.92)");

    gameCtx.shadowColor = fill;
    gameCtx.shadowBlur = 18;
    gameCtx.fillStyle = grad;
    gameCtx.beginPath();
    gameCtx.arc(player.x, player.y, r, 0, Math.PI * 2);
    gameCtx.fill();

    gameCtx.shadowBlur = 0;
    gameCtx.strokeStyle = "rgba(255,255,255,0.30)";
    gameCtx.lineWidth = 1.5;
    gameCtx.beginPath();
    gameCtx.arc(player.x, player.y, r, 0, Math.PI * 2);
    gameCtx.stroke();

    // tiny highlight only, no eyes
    gameCtx.fillStyle = "rgba(255,255,255,0.38)";
    gameCtx.beginPath();
    gameCtx.arc(player.x - r * .34, player.y - r * .36, r * .18, 0, Math.PI * 2);
    gameCtx.fill();

    gameCtx.restore();
    return true;
  }

  function drawCoinAbsorbFx(){
    if (!window.__coinAbsorbFx || !window.__coinAbsorbFx.length) return;

    for (let i = window.__coinAbsorbFx.length - 1; i >= 0; i--) {
      const fx = window.__coinAbsorbFx[i];
      fx.t += 0.055;
      const p = Math.min(1, fx.t);
      const ease = 1 - Math.pow(1 - p, 3);

      const x = fx.x + (fx.tx - fx.x) * ease;
      const y = fx.y + (fx.ty - fx.y) * ease + Math.sin(p * Math.PI) * fx.arc;
      const size = fx.size * (1 - p * .72);
      const alpha = 1 - p;

      gameCtx.save();
      gameCtx.globalAlpha = Math.max(0, alpha);

      gameCtx.shadowColor = "#ffd85a";
      gameCtx.shadowBlur = 16;

      gameCtx.fillStyle = "#ffd85a";
      gameCtx.beginPath();
      gameCtx.arc(x, y, size, 0, Math.PI * 2);
      gameCtx.fill();

      gameCtx.fillStyle = "#7a4b00";
      gameCtx.font = "bold " + Math.max(8, size * 1.1) + "px Arial";
      gameCtx.textAlign = "center";
      gameCtx.textBaseline = "middle";
      gameCtx.fillText("C", x, y + 0.5);

      // trail
      gameCtx.strokeStyle = "rgba(255,216,90,0.55)";
      gameCtx.lineWidth = 2;
      gameCtx.beginPath();
      gameCtx.moveTo(x, y);
      gameCtx.lineTo(fx.x + (fx.tx - fx.x) * Math.max(0, ease - .16), fx.y + (fx.ty - fx.y) * Math.max(0, ease - .16));
      gameCtx.stroke();

      gameCtx.restore();

      if (p >= 1) window.__coinAbsorbFx.splice(i, 1);
    }
  }

  function spawnCoinAbsorb(x, y){
    const tx = (typeof player !== "undefined" && player) ? player.x : x;
    const ty = (typeof player !== "undefined" && player) ? player.y : y;

    for (let i = 0; i < 7; i++) {
      window.__coinAbsorbFx.push({
        x: x + (Math.random() - .5) * 18,
        y: y + (Math.random() - .5) * 18,
        tx: tx + (Math.random() - .5) * 10,
        ty: ty + (Math.random() - .5) * 10,
        t: Math.random() * .12,
        arc: -18 - Math.random() * 28,
        size: 4 + Math.random() * 6
      });
    }
  }

  function patchPlayerDraw(){
    try {
      if (typeof drawPlayer === "function" && !window.__noEyesPlayerPatched) {
        drawPlayer = function(){
          drawCleanPlayer();
        };
        window.__noEyesPlayerPatched = true;
      }
    } catch(e){}
  }

  function patchCoinPickup(){
    try {
      if (typeof update === "function" && !window.__coinAbsorbUpdatePatched) {
        const oldUpdate = update;
        update = function(dt){
          const before = [];
          try {
            if (Array.isArray(coins)) {
              coins.forEach(c => before.push({x:c.x, y:c.y}));
            }
          } catch(e){}

          const result = oldUpdate.apply(this, arguments);

          try {
            if (state === "play" && before.length && Array.isArray(coins)) {
              if (coins.length < before.length) {
                const current = new Set(coins.map(c => Math.round(c.x) + ":" + Math.round(c.y)));
                before.forEach(c => {
                  const key = Math.round(c.x) + ":" + Math.round(c.y);
                  if (!current.has(key)) spawnCoinAbsorb(c.x, c.y);
                });
              }
            }
          } catch(e){}

          return result;
        };
        window.__coinAbsorbUpdatePatched = true;
      }
    } catch(e){}
  }

  function patchDrawFxLayer(){
    try {
      if (typeof drawGame === "function" && !window.__coinAbsorbDrawPatched) {

<script id="fix-gameover-multiplier-status-display">

    try {
      if (typeof save !== "undefined" && save && save.rewardDoubleCoinsNextRun) return true;

  function updateGameOverMultiplier(applied){

    const card = overlay.querySelector(".card");
    if (!card) return;

    const boxes = Array.from(card.querySelectorAll(".hudBox, div"));

      const txt = (box.textContent || "").toLowerCase();
      if (txt.includes("multiplier status")) {
        statusBox = box;
        break;
      }
    }

    if (!statusBox) return;

    statusBox.style.background = applied
      ? "linear-gradient(180deg, rgba(255,215,64,0.35), rgba(255,170,0,0.18))"
      : "rgba(10,16,30,0.86)";

      ? "1px solid rgba(255,220,120,0.75)"
      : "1px solid rgba(255,255,255,0.09)";

      ? "0 0 22px rgba(255,200,60,0.28)"
      : "none";

      </div>
    `;
  }

  function install(){
    if (typeof endRun === "function" && !window.__multiplierStatusDisplayPatched) {
      const oldEndRun = endRun;

      endRun = async function(){
        const hadMultiplier = multiplierIsArmed();
        window.__lastRunHadMultiplier = hadMultiplier;

        const result = await oldEndRun.apply(this, arguments);

        setTimeout(function(){

        setTimeout(function(){

        }, 120);

        return result;

<!-- FINAL BLACK HOLE + COIN PULL FIX -->
<script id="final-blackhole-coin-pull-fix">
(function(){
  const ADS_KEY = "final_ads_shop_v1";
  const SHOP_KEY = "final_shop_patch_v2";
  window.__coinPullFx = window.__coinPullFx || [];

  function loadJson(key){
    try { return JSON.parse(localStorage.getItem(key)) || {}; }
    catch(e){ return {}; }
  }

  function selectedSkin(){
    try {
      const ads = loadJson(ADS_KEY);
      if (ads.selectedSkin) return ads.selectedSkin;
    } catch(e){}
    try {
      const shop = loadJson(SHOP_KEY);
      if (shop.skin) return shop.skin;
    } catch(e){}
    try {
      if (typeof save !== "undefined" && save.selectedSkin) return save.selectedSkin;
    } catch(e){}
    return "cyan";
  }

  function normalSkinColor(id){
    if(id === "rainbow") return "rainbow";
    if(id === "plasma") return "#7df9ff";
    if(id === "lime") return "#63ff9d";
    if(id === "violet") return "#b77cff";
    if(id === "ruby") return "#ff4e73";
    if(id === "gold") return "#ffd85a";
    if(id === "orange") return "#ff9f43";
    return "#31e8ff";
  }

  function drawBlackHolePlayer(){
    if (typeof player === "undefined" || !player) return;
    const r = player.r || 14;
    const t = performance.now();

    gameCtx.save();
    gameCtx.translate(player.x, player.y);

    // outer gravity lens
    const lens = gameCtx.createRadialGradient(0, 0, r * .2, 0, 0, r * 4.4);
    lens.addColorStop(0.00, "rgba(0,0,0,1)");
    lens.addColorStop(0.22, "rgba(0,0,0,.95)");
    lens.addColorStop(0.34, "rgba(120,70,255,.45)");
    lens.addColorStop(0.52, "rgba(255,190,60,.22)");
    lens.addColorStop(1.00, "rgba(0,0,0,0)");
    gameCtx.fillStyle = lens;
    gameCtx.beginPath();
    gameCtx.arc(0, 0, r * 4.4, 0, Math.PI * 2);
    gameCtx.fill();

    // rotating accretion disk
    gameCtx.rotate(t / 520);
    for (let i = 0; i < 5; i++) {
      gameCtx.save();
      gameCtx.rotate(i * Math.PI / 5);
      gameCtx.strokeStyle = i % 2 === 0 ? "rgba(255,220,90,.82)" : "rgba(150,80,255,.75)";
      gameCtx.lineWidth = Math.max(2, r * .16);
      gameCtx.beginPath();
      gameCtx.ellipse(0, 0, r * (2.1 + i * .13), r * (.52 + i * .035), 0, 0, Math.PI * 2);
      gameCtx.stroke();
      gameCtx.restore();
    }

    // black event horizon
    const core = gameCtx.createRadialGradient(-r*.25, -r*.25, 1, 0, 0, r * 1.25);
    core.addColorStop(0, "#111827");
    core.addColorStop(.35, "#020617");
    core.addColorStop(.82, "#000000");
    core.addColorStop(1, "#000000");
    gameCtx.fillStyle = core;
    gameCtx.beginPath();
    gameCtx.arc(0, 0, r * 1.08, 0, Math.PI * 2);
    gameCtx.fill();

    // thin bright rim
    gameCtx.strokeStyle = "rgba(255,235,160,.75)";
    gameCtx.lineWidth = 1.5;
    gameCtx.beginPath();
    gameCtx.arc(0, 0, r * 1.16, 0, Math.PI * 2);
    gameCtx.stroke();

    gameCtx.restore();
  }

  function drawCleanOrb(){
    if (typeof player === "undefined" || !player) return;
    if (player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 0) return;

    const id = selectedSkin();
    if (id === "blackhole") {
      drawBlackHolePlayer();
      return;
    }

    const r = player.r || 14;
    let c = normalSkinColor(id);
    if (c === "rainbow") c = "hsl(" + ((performance.now()/8)%360) + "deg 95% 58%)";

    gameCtx.save();
    const g = gameCtx.createRadialGradient(player.x-r*.35, player.y-r*.35, 2, player.x, player.y, r*1.35);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(.22, c);
    g.addColorStop(1, "#020617");

    gameCtx.shadowColor = c;
    gameCtx.shadowBlur = 18;
    gameCtx.fillStyle = g;
    gameCtx.beginPath();
    gameCtx.arc(player.x, player.y, r, 0, Math.PI*2);
    gameCtx.fill();

    gameCtx.shadowBlur = 0;
    gameCtx.strokeStyle = "rgba(255,255,255,.28)";
    gameCtx.lineWidth = 1.4;
    gameCtx.beginPath();
    gameCtx.arc(player.x, player.y, r, 0, Math.PI*2);
    gameCtx.stroke();

    // highlight only, no eyes/face
    gameCtx.fillStyle = "rgba(255,255,255,.35)";
    gameCtx.beginPath();
    gameCtx.arc(player.x-r*.34, player.y-r*.36, r*.18, 0, Math.PI*2);
    gameCtx.fill();
    gameCtx.restore();
  }

  function addCoinPull(x, y){
    const tx = (typeof player !== "undefined" && player) ? player.x : x;
    const ty = (typeof player !== "undefined" && player) ? player.y : y;

    // several little coin/cross fragments get sucked in
    for (let i=0; i<10; i++){
      window.__coinPullFx.push({
        x: x + (Math.random()-.5)*26,
        y: y + (Math.random()-.5)*26,
        tx: tx + (Math.random()-.5)*8,
        ty: ty + (Math.random()-.5)*8,
        t: Math.random()*0.08,
        spin: Math.random()*Math.PI*2,
        size: 6 + Math.random()*5,
        curve: -24 - Math.random()*34
      });
    }
  }

  function drawCoinPull(){
    if (!window.__coinPullFx.length) return;

    for (let i=window.__coinPullFx.length-1; i>=0; i--){
      const f = window.__coinPullFx[i];
      f.t += 0.06;
      const p = Math.min(1, f.t);
      const ease = 1 - Math.pow(1-p, 3);

      const x = f.x + (f.tx - f.x) * ease;
      const y = f.y + (f.ty - f.y) * ease + Math.sin(p*Math.PI)*f.curve;
      const s = f.size * (1 - p*.78);
      const a = Math.max(0, 1-p);

      gameCtx.save();
      gameCtx.globalAlpha = a;
      gameCtx.translate(x, y);
      gameCtx.rotate(f.spin + p*7);

      gameCtx.shadowColor = "#ffd85a";
      gameCtx.shadowBlur = 14;

      // small glowing cross/star instead of just dot
      gameCtx.strokeStyle = "#ffd85a";
      gameCtx.lineWidth = Math.max(1.5, s*.28);
      gameCtx.beginPath();
      gameCtx.moveTo(-s, 0);
      gameCtx.lineTo(s, 0);
      gameCtx.moveTo(0, -s);
      gameCtx.lineTo(0, s);
      gameCtx.stroke();

      gameCtx.fillStyle = "#fff2a8";
      gameCtx.beginPath();
      gameCtx.arc(0, 0, Math.max(1.5, s*.28), 0, Math.PI*2);
      gameCtx.fill();

      gameCtx.restore();

      if (p >= 1) window.__coinPullFx.splice(i,1);
    }
  }

  function install(){
    // Hard override, after every older patch: black hole stays black, no eyes.
    try {
      drawPlayer = drawCleanOrb;
    } catch(e){}

    // Detect collected coins before old update removes them.
    try {
      if (typeof update === "function" && !window.__finalCoinPullUpdate) {
        const oldUpdate = update;
        update = function(dt){
          let before = [];
          try {
            if (Array.isArray(coins)) before = coins.map(c => ({x:c.x, y:c.y}));
          } catch(e){}

          const res = oldUpdate.apply(this, arguments);

          try {
            if (state === "play" && before.length && Array.isArray(coins) && coins.length < before.length) {
              const after = new Set(coins.map(c => Math.round(c.x)+":"+Math.round(c.y)));
              before.forEach(c => {
                const key = Math.round(c.x)+":"+Math.round(c.y);
                if (!after.has(key)) addCoinPull(c.x, c.y);
              });
            }
          } catch(e){}

          return res;
        };
        window.__finalCoinPullUpdate = true;
      }
    } catch(e){}

    // Draw pull particles above the game.
    try {
      if (typeof drawGame === "function" && !window.__finalCoinPullDraw) {
        const oldDraw = drawGame;
        drawGame = function(){
          const res = oldDraw.apply(this, arguments);
          drawCoinPull();
          return res;
        };
        window.__finalCoinPullDraw = true;
      }
    } catch(e){}
  }

  install();
  window.addEventListener("load", install);
  document.addEventListener("click", function(){ setTimeout(install, 30); }, true);
  setInterval(function(){
    try { drawPlayer = drawCleanOrb; } catch(e){}
  }, 250);
})();
</script>
<!-- END FINAL BLACK HOLE + COIN PULL FIX -->


<!-- FINAL EQUIP PERSISTENCE FIX -->
<script id="final-equip-persistence-fix">
(function(){
  const ADS_KEY = "final_ads_shop_v1";
  const SHOP_KEY = "final_shop_patch_v2";
  const MAIN_SAVE_KEYS = [
    "galaxy_arena_save_v4",
    "galaxy_arena_save",
    "stack_style_controls_v1",
    "stack_style_control_version_v1"
  ];

  function loadJson(key){
    try { return JSON.parse(localStorage.getItem(key)) || {}; }
    catch(e){ return {}; }
  }

  function saveJson(key, obj){
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e){}
  }

  function getWantedSelection(){
    const ads = loadJson(ADS_KEY);
    const shop = loadJson(SHOP_KEY);

    let skin = "";
    let bg = "";

    if (ads.selectedSkin) skin = ads.selectedSkin;
    if (shop.skin) skin = shop.skin;

    if (ads.selectedBg) bg = ads.selectedBg;
    if (shop.bg) bg = shop.bg;

    // Prefer the most recently clicked equip buttons if present.
    if (localStorage.getItem("ga_last_equipped_skin")) skin = localStorage.getItem("ga_last_equipped_skin");
    if (localStorage.getItem("ga_last_equipped_bg")) bg = localStorage.getItem("ga_last_equipped_bg");

    return { skin, bg, ads, shop };
  }

  function registerMissingItems(){
    try {
      if (typeof skins !== "undefined" && Array.isArray(skins)) {
        [
          { id:"rainbow", name:"Rainbow Skin", color:"#ffffff", price:0 },
          { id:"plasma", name:"Plasma Core", color:"#7df9ff", price:0 },
          { id:"blackhole", name:"Black Hole", color:"#000000", price:0 },
          { id:"lime", name:"Lime", color:"#63ff9d", price:40 },
          { id:"ruby", name:"Ruby", color:"#ff4e73", price:150 },
          { id:"void", name:"Void", color:"#1d2448", price:500 }
        ].forEach(function(s){
          if (!skins.find(x => x.id === s.id)) skins.push(s);
        });
      }
    } catch(e){}

    try {
      if (typeof backgrounds !== "undefined" && Array.isArray(backgrounds)) {
        [
          { id:"rainbowrift", name:"Rainbow Rift", price:0 },
          { id:"crystalstorm", name:"Crystal Storm", price:0 },
          { id:"voidlux", name:"Void Lux", price:0 },
          { id:"solar", name:"Solar Dust", price:0 }
        ].forEach(function(b){
          if (!backgrounds.find(x => x.id === b.id)) backgrounds.push(b);
        });
      }
    } catch(e){}
  }

  function hardApplySelection(){
    registerMissingItems();

    const sel = getWantedSelection();
    const skin = sel.skin;
    const bg = sel.bg;
    const ads = sel.ads;
    const shop = sel.shop;

    shop.skins = shop.skins || {};
    shop.bgs = shop.bgs || {};
    ads.skins = ads.skins || {};
    ads.bgs = ads.bgs || {};

    if (skin) {
      shop.skin = skin;
      shop.skins[skin] = true;
      ads.selectedSkin = skin;
      ads.skins[skin] = true;
    }

    if (bg) {
      shop.bg = bg;
      shop.bgs[bg] = true;
      ads.selectedBg = bg;
      ads.bgs[bg] = true;
    }

    saveJson(SHOP_KEY, shop);
    saveJson(ADS_KEY, ads);

    try {
      if (typeof save !== "undefined" && save) {
        save.unlockedSkins = Object.assign(save.unlockedSkins || {}, shop.skins, ads.skins);
        save.unlockedBackgrounds = Object.assign(save.unlockedBackgrounds || {}, shop.bgs, ads.bgs);
        if (skin) save.selectedSkin = skin;
        if (bg) save.selectedBackground = bg;
        if (typeof saveGame === "function") saveGame();
      }
    } catch(e){}

    MAIN_SAVE_KEYS.forEach(function(key){
      const obj = loadJson(key);
      if (!obj || typeof obj !== "object") return;
      obj.unlockedSkins = Object.assign(obj.unlockedSkins || {}, shop.skins, ads.skins);
      obj.unlockedBackgrounds = Object.assign(obj.unlockedBackgrounds || {}, shop.bgs, ads.bgs);
      if (skin) obj.selectedSkin = skin;
      if (bg) obj.selectedBackground = bg;
      saveJson(key, obj);
    });
  }

  function rememberClickedEquip(btn){
    const card = btn.closest(".shopPatchItem, .finalShopCard, .shopItem");
    if (!card) return;
    const name = (card.querySelector(".shopPatchName,.finalItemName,strong")?.textContent || card.textContent || "").toLowerCase();

    const skinMap = {
      "cyan":"cyan",
      "lime":"lime",
      "violet":"violet",
      "ruby":"ruby",
      "gold":"gold",
      "orange":"orange",
      "rainbow":"rainbow",
      "plasma":"plasma",
      "black hole":"blackhole",
      "blackhole":"blackhole",
      "void":"void"
    };

    const bgMap = {
      "nebula":"nebula",
      "purple":"purple",
      "solar":"solar",
      "emerald":"emerald",
      "rainbow rift":"rainbowrift",
      "rainbowrift":"rainbowrift",
      "crystal storm":"crystalstorm",
      "crystalstorm":"crystalstorm",
      "void lux":"voidlux",
      "voidlux":"voidlux"
    };

    for (const k in skinMap) {
      if (name.includes(k)) {
        localStorage.setItem("ga_last_equipped_skin", skinMap[k]);
      }
    }

    for (const k in bgMap) {
      if (name.includes(k)) {
        localStorage.setItem("ga_last_equipped_bg", bgMap[k]);
      }
    }

    setTimeout(hardApplySelection, 0);
    setTimeout(hardApplySelection, 80);
  }

  function patchStart(){
    try {
      if (typeof startGame === "function" && !window.__equipStartFinalPatched) {
        const oldStart = startGame;
        startGame = function(){
          hardApplySelection();
          const result = oldStart.apply(this, arguments);
          hardApplySelection();
          try {
            if (typeof drawStarfield === "function") drawStarfield();
            if (typeof drawGame === "function") drawGame();
          } catch(e){}
          return result;
        };
        window.__equipStartFinalPatched = true;
      }
    } catch(e){}
  }

  function patchShopRender(){
    ["finalShopRender", "renderShopWithAds", "openFinalShop"].forEach(function(name){
      try {
        const fn = window[name];
        if (typeof fn === "function" && !fn.__equipPersistenceWrapped) {
          const wrapped = function(){
            hardApplySelection();
            const result = fn.apply(this, arguments);
            setTimeout(hardApplySelection, 0);
            return result;
          };
          wrapped.__equipPersistenceWrapped = true;
          window[name] = wrapped;
        }
      } catch(e){}
    });
  }

  document.addEventListener("click", function(ev){
    const btn = ev.target.closest && ev.target.closest("button");
    if (!btn) return;

    const txt = (btn.textContent || "").trim().toLowerCase();
    if (
      txt === "equip" ||
      txt === "equipped" ||
      txt === "use" ||
      txt === "active" ||
      txt.includes("equip") ||
      txt.includes("use") ||
      txt.includes("active")
    ) {
      rememberClickedEquip(btn);
    }

    if (txt === "start" || txt === "restart" || txt === "nochmal" || txt === "spiel starten") {
      hardApplySelection();
    }
  }, true);

  hardApplySelection();
  patchStart();
  patchShopRender();

  document.addEventListener("DOMContentLoaded", function(){
    hardApplySelection();
    patchStart();
    patchShopRender();
  });

  window.addEventListener("load", function(){
    hardApplySelection();
    patchStart();
    patchShopRender();
  });

  setInterval(function(){
    patchStart();
    patchShopRender();
  }, 500);
})();
</script>

          x: x + (Math.random() - .5) * 30,
          y: y + (Math.random() - .5) * 30,
          tx: t.x + (Math.random() - .5) * 10,
          ty: t.y + (Math.random() - .5) * 10,
          p: Math.random() * .08,
          size: 5 + Math.random() * 7,
          spin: Math.random() * Math.PI * 2,
          curve: -20 - Math.random() * 35
        });
      }

      // golden shock ring
      window.__skinCoinFx.push({
        type: "goldRing",
        x: x,
        y: y,
        p: 0,
        size: 10
      });
      return;
    }

    if (skin === "blackhole") {
      for (let i = 0; i < 13; i++) {
        window.__skinCoinFx.push({
          type: "blackhole",
          x: x + (Math.random() - .5) * 30,
          y: y + (Math.random() - .5) * 30,
          tx: t.x,
          ty: t.y,
          p: Math.random() * .06,
          size: 4 + Math.random() * 5,
          spin: Math.random() * Math.PI * 2,
          radius: 20 + Math.random() * 34
        });
      }
      return;
    }

    if (skin === "plasma") {
      for (let i = 0; i < 14; i++) {
        window.__skinCoinFx.push({
          type: "plasma",
          x: x + (Math.random() - .5) * 28,
          y: y + (Math.random() - .5) * 28,
          tx: t.x + (Math.random() - .5) * 10,
          ty: t.y + (Math.random() - .5) * 10,
          p: Math.random() * .08,
          size: 4 + Math.random() * 6,
          curve: -32 - Math.random() * 38
        });
      }
      return;
    }

    // default clean coin pull
    for (let i = 0; i < 9; i++) {
      window.__skinCoinFx.push({
        type: "default",
        x: x + (Math.random() - .5) * 24,
        y: y + (Math.random() - .5) * 24,
        tx: t.x + (Math.random() - .5) * 8,
        ty: t.y + (Math.random() - .5) * 8,
        p: Math.random() * .08,
        size: 4 + Math.random() * 5,
        curve: -24 - Math.random() * 30
      });
    }
  }

  function drawStar(ctx, r){
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 === 0 ? r : r * .42;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawFx(){
    if (!window.__skinCoinFx.length) return;

    for (let i = window.__skinCoinFx.length - 1; i >= 0; i--) {
      const f = window.__skinCoinFx[i];
      f.p += 0.055;
      const p = Math.min(1, f.p);
      const ease = 1 - Math.pow(1 - p, 3);
      const alpha = Math.max(0, 1 - p);

      gameCtx.save();
      gameCtx.globalAlpha = alpha;

      if (f.type === "goldRing") {
        gameCtx.globalAlpha = alpha * .85;
        gameCtx.strokeStyle = "rgba(255,216,90,.95)";
        gameCtx.lineWidth = 4 * (1 - p);
        gameCtx.shadowColor = "#ffd85a";
        gameCtx.shadowBlur = 18;
        gameCtx.beginPath();
        gameCtx.arc(f.x, f.y, 12 + p * 46, 0, Math.PI * 2);
        gameCtx.stroke();
        gameCtx.restore();
        if (p >= 1) window.__skinCoinFx.splice(i, 1);
        continue;
      }

      let x, y;
      if (f.type === "blackhole") {
        const tt = target();
        const angle = f.spin + p * Math.PI * 4.5;
        const radius = f.radius * (1 - ease);
        x = tt.x + Math.cos(angle) * radius;
        y = tt.y + Math.sin(angle) * radius;
      } else {
        x = f.x + (f.tx - f.x) * ease;
        y = f.y + (f.ty - f.y) * ease + Math.sin(p * Math.PI) * f.curve;
      }

      const s = Math.max(1, f.size * (1 - p * .75));
      gameCtx.translate(x, y);
      gameCtx.rotate((f.spin || 0) + p * 8);

      if (f.type === "rainbow") {
        const hue = (f.hue + p * 360) % 360;
        gameCtx.shadowColor = "hsl(" + hue + " 100% 60%)";
        gameCtx.shadowBlur = 18;
        gameCtx.fillStyle = "hsl(" + hue + " 100% 60%)";
        drawStar(gameCtx, s * 1.25);
        gameCtx.fill();

        gameCtx.strokeStyle = "rgba(255,255,255,.75)";
        gameCtx.lineWidth = 1.4;
        gameCtx.stroke();
      } else if (f.type === "gold") {
        gameCtx.shadowColor = "#ffd85a";
        gameCtx.shadowBlur = 18;

        const g = gameCtx.createRadialGradient(-s*.3, -s*.3, 1, 0, 0, s*1.3);
        g.addColorStop(0, "#fff8c7");
        g.addColorStop(.35, "#ffd85a");
        g.addColorStop(1, "#b77900");
        gameCtx.fillStyle = g;

        gameCtx.beginPath();
        gameCtx.arc(0, 0, s, 0, Math.PI * 2);
        gameCtx.fill();

        gameCtx.fillStyle = "#6b4300";
        gameCtx.font = "bold " + Math.max(7, s*1.1) + "px Arial";
        gameCtx.textAlign = "center";
        gameCtx.textBaseline = "middle";
        gameCtx.fillText("$", 0, 0.5);
      } else if (f.type === "blackhole") {
        gameCtx.shadowColor = "#a855f7";
        gameCtx.shadowBlur = 18;

        gameCtx.strokeStyle = "rgba(255,216,90,.85)";
        gameCtx.lineWidth = Math.max(1.5, s*.35);
        gameCtx.beginPath();
        gameCtx.arc(0, 0, s * 1.4, 0, Math.PI * 2);
        gameCtx.stroke();

        gameCtx.fillStyle = "#020617";
        gameCtx.beginPath();
        gameCtx.arc(0, 0, s, 0, Math.PI * 2);
        gameCtx.fill();
      } else if (f.type === "plasma") {
        gameCtx.shadowColor = "#7df9ff";
        gameCtx.shadowBlur = 20;

        gameCtx.fillStyle = "rgba(125,249,255,.85)";
        gameCtx.beginPath();
        gameCtx.moveTo(-s, -s*.4);
        gameCtx.lineTo(s*.25, -s);
        gameCtx.lineTo(s, s*.4);
        gameCtx.lineTo(-s*.25, s);
        gameCtx.closePath();
        gameCtx.fill();

        gameCtx.strokeStyle = "rgba(255,255,255,.75)";
        gameCtx.stroke();
      } else {
        gameCtx.shadowColor = "#ffd85a";
        gameCtx.shadowBlur = 14;
        gameCtx.strokeStyle = "#ffd85a";
        gameCtx.lineWidth = Math.max(1.5, s*.28);
        gameCtx.beginPath();
        gameCtx.moveTo(-s, 0);
        gameCtx.lineTo(s, 0);
        gameCtx.moveTo(0, -s);
        gameCtx.lineTo(0, s);
        gameCtx.stroke();
      }

      gameCtx.restore();

      if (p >= 1) window.__skinCoinFx.splice(i, 1);
    }
  }

  function install(){
    try {
      if (typeof update === "function" && !window.__skinSpecificCoinUpdatePatched) {
        const oldUpdate = update;
        update = function(dt){
          let before = [];
          try {
            if (Array.isArray(coins)) before = coins.map(c => ({ x: c.x, y: c.y }));
          } catch(e){}

          const res = oldUpdate.apply(this, arguments);

          try {
            if (state === "play" && before.length && Array.isArray(coins) && coins.length < before.length) {
              const after = new Set(coins.map(c => Math.round(c.x) + ":" + Math.round(c.y)));
              before.forEach(c => {
                const key = Math.round(c.x) + ":" + Math.round(c.y);
                if (!after.has(key)) addCoinFx(c.x, c.y);
              });
            }
          } catch(e){}

          return res;
        };
        window.__skinSpecificCoinUpdatePatched = true;
      }
    } catch(e){}

    try {
      if (typeof drawGame === "function" && !window.__skinSpecificCoinDrawPatched) {
        const oldDraw = drawGame;
        drawGame = function(){
          const res = oldDraw.apply(this, arguments);
          drawFx();
          return res;
        };
        window.__skinSpecificCoinDrawPatched = true;
      }
    } catch(e){}
  }

  install();
  window.addEventListener("load", install);
  document.addEventListener("click", function(){ setTimeout(install, 40); }, true);
})();
</script>

<script id="coin-magnet-ability-script">
(function(){
  const SHOP_KEY = "final_shop_patch_v2";
  const MAGNET_ID = "coinmagnet";
  const MAGNET_PRICE = 250;

  function loadJson(key){
    try { return JSON.parse(localStorage.getItem(key)) || {}; }
    catch(e){ return {}; }
  }

  function saveJson(key, obj){
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e){}
  }

  function coins(){
    try {
      if (typeof save !== "undefined" && typeof save.totalCoins === "number") return save.totalCoins;
    } catch(e){}
    const shop = loadJson(SHOP_KEY);
    return Number(shop.coins || 0);
  }

  function setCoins(v){
    v = Math.max(0, Math.floor(v));
    try {
      if (typeof save !== "undefined") {
        save.totalCoins = v;
        if (typeof saveGame === "function") saveGame();
      }
    } catch(e){}
    const shop = loadJson(SHOP_KEY);
    shop.coins = v;
    saveJson(SHOP_KEY, shop);
  }

  function ownsMagnet(){
    try {
      if (typeof save !== "undefined" && save.ownedAbilities && save.ownedAbilities[MAGNET_ID]) return true;
    } catch(e){}
    const shop = loadJson(SHOP_KEY);
    return !!(shop.abilities && shop.abilities[MAGNET_ID]);
  }

  function setOwnsMagnet(){
    const shop = loadJson(SHOP_KEY);
    shop.abilities = shop.abilities || {};
    shop.abilities[MAGNET_ID] = true;
    saveJson(SHOP_KEY, shop);

    try {
      if (typeof save !== "undefined") {
        save.ownedAbilities = save.ownedAbilities || {};
        save.ownedAbilities[MAGNET_ID] = true;
        if (typeof saveGame === "function") saveGame();
      }
    } catch(e){}
  }

  function ensureState(){
    window.magnetAbility = window.magnetAbility || {
      cooldown: 0,
      active: 0,
      duration: 5,
      cooldownMax: 16,
      range: 260,
      pullSpeed: 560
    };
    return window.magnetAbility;
  }

  function abilityText(seconds){
    return seconds > 0 ? seconds.toFixed(1) + "s" : "Ready";
  }

  function buildHud(){
    const app = document.getElementById("app");
    if (!app || document.getElementById("abilityHudBar")) return;

    const bar = document.createElement("div");
    bar.id = "abilityHudBar";
    bar.innerHTML = `
      <div class="abilityHudPill" id="pillDash"><div class="aName">Dash</div><div class="aValue" id="pillDashVal">Ready</div></div>
      <div class="abilityHudPill" id="pillShield"><div class="aName">Shield Q</div><div class="aValue" id="pillShieldVal">-</div></div>
      <div class="abilityHudPill" id="pillTeleport"><div class="aName">Teleport E</div><div class="aValue" id="pillTeleportVal">-</div></div>
      <div class="abilityHudPill" id="pillSpeed"><div class="aName">Speed Shift</div><div class="aValue" id="pillSpeedVal">-</div></div>
      <div class="abilityHudPill" id="pillMagnet"><div class="aName">Magnet M</div><div class="aValue" id="pillMagnetVal">-</div></div>
    `;
    app.appendChild(bar);
  }

  function addTouchButton(){
    const touch = document.getElementById("touchAbilities");
    if (!touch || document.getElementById("magnetTouchBtn")) return;

    const btn = document.createElement("button");
    btn.id = "magnetTouchBtn";
    btn.className = "touchAbilityBtn";
    btn.type = "button";
    btn.textContent = "Magnet (M)";
    btn.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      useMagnet();
    }, true);
    btn.addEventListener("touchstart", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      useMagnet();
    }, {passive:false});

    touch.appendChild(btn);
  }

  function updateHudBar(){
    buildHud();
    addTouchButton();
    const bar = document.getElementById("abilityHudBar");
    if (!bar) return;

    let inGame = false;
    try { inGame = state === "play"; } catch(e){}
    bar.style.display = inGame ? "flex" : "none";

    const m = ensureState();

    const dashCd = (() => {
      try { return player && player.dashCooldown ? player.dashCooldown : 0; } catch(e){ return 0; }
    })();

    setPill("pillDash", "pillDashVal", dashCd <= 0 ? "Ready" : dashCd.toFixed(1)+"s", dashCd <= 0, false);

    let shieldOwned = false, teleportOwned = false, speedOwned = false;
    try {
      shieldOwned = !!(save.ownedAbilities && save.ownedAbilities.shield);
      teleportOwned = !!(save.ownedAbilities && save.ownedAbilities.teleport);
      speedOwned = !!(save.ownedAbilities && save.ownedAbilities.speed);
    } catch(e){}

    let shieldCd = 0, shieldActive = 0, teleportCd = 0, speedCd = 0, speedActive = 0;
    try {
      shieldCd = abilityState.shieldCooldown || 0;
      shieldActive = abilityState.shieldActive || 0;
      teleportCd = abilityState.teleportCooldown || 0;
      speedCd = abilityState.speedCooldown || 0;
      speedActive = abilityState.speedActive || 0;
    } catch(e){}

    setPill("pillShield", "pillShieldVal", shieldOwned ? (shieldActive > 0 ? "Active" : abilityText(shieldCd)) : "Locked", shieldOwned && shieldCd <= 0, shieldActive > 0);
    setPill("pillTeleport", "pillTeleportVal", teleportOwned ? abilityText(teleportCd) : "Locked", teleportOwned && teleportCd <= 0, false);
    setPill("pillSpeed", "pillSpeedVal", speedOwned ? (speedActive > 0 ? "Active" : abilityText(speedCd)) : "Locked", speedOwned && speedCd <= 0, speedActive > 0);
    setPill("pillMagnet", "pillMagnetVal", ownsMagnet() ? (m.active > 0 ? "Active" : abilityText(m.cooldown)) : "Locked", ownsMagnet() && m.cooldown <= 0, m.active > 0);

    const mb = document.getElementById("magnetTouchBtn");
    if (mb) {
      mb.disabled = !inGame || !ownsMagnet() || m.cooldown > 0;
      mb.textContent = m.active > 0 ? "Magnet Active" : ("Magnet " + (m.cooldown > 0 ? m.cooldown.toFixed(1)+"s" : "(M)"));
      mb.classList.toggle("activeAbility", m.active > 0);
    }
  }

  function setPill(id, valId, txt, ready, active){
    const p = document.getElementById(id);
    const v = document.getElementById(valId);
    if (!p || !v) return;
    v.textContent = txt;
    p.classList.toggle("ready", !!ready);
    p.classList.toggle("active", !!active);
  }

  function useMagnet(){
    let playing = false;
    try { playing = state === "play"; } catch(e){}
    if (!playing || !ownsMagnet()) return;

    const m = ensureState();
    if (m.cooldown > 0) return;

    m.active = m.duration;
    m.cooldown = m.cooldownMax;

    try {
      for (let i=0;i<22;i++) {
        if (typeof makeParticle === "function") makeParticle(player.x, player.y, "#ffd85a", 260);
      }
    } catch(e){}

    updateHudBar();
  }

  function updateMagnet(dt){
    const m = ensureState();

    if (m.cooldown > 0) m.cooldown = Math.max(0, m.cooldown - dt);
    if (m.active > 0) m.active = Math.max(0, m.active - dt);

    let playing = false;
    try { playing = state === "play"; } catch(e){}
    if (!playing || m.active <= 0 || !ownsMagnet()) {
      updateHudBar();
      return;
    }

    try {
      if (Array.isArray(coins) && player) {
        for (const c of coins) {
          const dx = player.x - c.x;
          const dy = player.y - c.y;
          const dist = Math.hypot(dx, dy) || 1;
          if (dist <= m.range) {
            const power = 1 + (1 - dist / m.range) * 2.4;
            c.x += (dx / dist) * m.pullSpeed * power * dt;
            c.y += (dy / dist) * m.pullSpeed * power * dt;
          }
        }
      }
    } catch(e){}

    updateHudBar();
  }

  function drawMagnetRing(){
    const m = ensureState();
    if (m.active <= 0 || !ownsMagnet()) return;

    try {
      if (!player) return;

      const pulse = 0.5 + Math.sin(performance.now()/120) * 0.5;
      gameCtx.save();

      gameCtx.strokeStyle = "rgba(255,216,90," + (0.22 + pulse * 0.18) + ")";
      gameCtx.lineWidth = 3;
      gameCtx.setLineDash([12, 10]);
      gameCtx.beginPath();
      gameCtx.arc(player.x, player.y, m.range, 0, Math.PI * 2);
      gameCtx.stroke();

      gameCtx.setLineDash([]);
      const grad = gameCtx.createRadialGradient(player.x, player.y, 0, player.x, player.y, m.range);
      grad.addColorStop(0, "rgba(255,216,90,.12)");
      grad.addColorStop(0.45, "rgba(255,216,90,.045)");
      grad.addColorStop(1, "rgba(255,216,90,0)");
      gameCtx.fillStyle = grad;
      gameCtx.beginPath();
      gameCtx.arc(player.x, player.y, m.range, 0, Math.PI * 2);
      gameCtx.fill();

      gameCtx.restore();
    } catch(e){}
  }

  function addMagnetToShop(){
    const grid = document.getElementById("patchGrid");
    const tabs = document.querySelector(".shopPatchTabs");
    if (!grid || !tabs) return;

    const activeAbilities =
      document.getElementById("patchTabAbs") &&
      document.getElementById("patchTabAbs").classList.contains("active");

    if (!activeAbilities) return;
    if (document.getElementById("magnetShopCard")) return;

    const owned = ownsMagnet();
    const card = document.createElement("div");
    card.id = "magnetShopCard";
    card.className = "shopPatchItem";
    card.innerHTML = `
      <div class="shopPatchPreview" style="background:radial-gradient(circle,#fff,#ffd85a 22%,#7c3aed 52%,#06111d 100%)"></div>
      <div class="shopPatchName">Coin Magnet</div>
      <div class="shopPatchDesc">Zieht Coins 5 Sekunden lang automatisch an. Taste: M</div>
      <button class="${owned ? "active" : ""}" ${owned ? "disabled" : ""}>${owned ? "Bought" : MAGNET_PRICE + " Coins"}</button>
    `;

    card.querySelector("button").onclick = function(){
      if (ownsMagnet()) return;
      if (coins() < MAGNET_PRICE) return;
      setCoins(coins() - MAGNET_PRICE);
      setOwnsMagnet();

      try {
        if (typeof updateHud === "function") updateHud();
      } catch(e){}

      if (typeof window.renderShopWithAds === "function") window.renderShopWithAds("abs");
      else if (typeof window.finalShopRender === "function") window.finalShopRender("abs");
      else addMagnetToShop();
    };

    grid.appendChild(card);
  }

  function install(){
    buildHud();
    addTouchButton();
    addMagnetToShop();

    try {
      if (typeof update === "function" && !window.__coinMagnetUpdatePatched) {
        const oldUpdate = update;
        update = function(dt){
          const result = oldUpdate.apply(this, arguments);
          updateMagnet(dt || 0);
          return result;
        };
        window.__coinMagnetUpdatePatched = true;
      }
    } catch(e){}

    try {
      if (typeof drawGame === "function" && !window.__coinMagnetDrawPatched) {
        const oldDraw = drawGame;
        drawGame = function(){
          const result = oldDraw.apply(this, arguments);
          drawMagnetRing();
          return result;
        };
        window.__coinMagnetDrawPatched = true;
      }
    } catch(e){}

    try {
      if (!window.__coinMagnetKeyPatched) {
        document.addEventListener("keydown", function(e){
          if (e.code === "KeyM") useMagnet();
        }, true);
        window.__coinMagnetKeyPatched = true;
      }
    } catch(e){}

    ["finalShopRender", "renderShopWithAds", "openFinalShop"].forEach(function(name){
      try {
        const fn = window[name];
        if (typeof fn === "function" && !fn.__magnetShopWrapped) {
          const wrapped = function(){
            const result = fn.apply(this, arguments);
            setTimeout(addMagnetToShop, 0);
            setTimeout(addMagnetToShop, 80);
            return result;
          };
          wrapped.__magnetShopWrapped = true;
          window[name] = wrapped;
        }
      } catch(e){}
    });
  }

  install();

  document.addEventListener("click", function(){
    setTimeout(function(){
      install();
      updateHudBar();
      addMagnetToShop();
    }, 60);
  }, true);

  document.addEventListener("DOMContentLoaded", install);
  window.addEventListener("load", install);

  setInterval(function(){
    updateHudBar();
    addMagnetToShop();
  }, 300);
})();
</script>
