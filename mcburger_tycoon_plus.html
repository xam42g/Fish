<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McBurger Tycoon Plus</title>
  <style>
    :root{
      --sky1:#7bd7ff; --sky2:#effcff; --grass1:#97e16f; --grass2:#62bc49;
      --panel:#102033ee; --panel2:#182a40f0; --line:#ffffff16; --line2:#ffffff10;
      --text:#f4fbff; --muted:#a9bbcd; --gold:#ffd54f; --gold2:#ffb62a; --green:#8dffb1;
      --red:#d63f31; --cream:#efe7da; --shadow:0 18px 50px rgba(0,0,0,.20);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(var(--sky1),var(--sky2));color:var(--text)}
    canvas{display:block;width:100vw;height:100vh}
    .topbar{position:fixed;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
    .brand,.money,.sidebar,.log{pointer-events:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .brand{border-radius:18px;padding:10px 14px;max-width:360px}
    .brand h1{margin:0;font-size:18px;line-height:1.1}
    .brand .mc{color:var(--gold);font-weight:900}
    .money{border-radius:999px;min-width:170px;text-align:center;padding:10px 14px;font-size:20px;font-weight:900;color:var(--green)}
    .money small{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#c2d7c8;margin-bottom:2px}
    .sidebar{position:fixed;left:14px;top:86px;width:210px;border-radius:20px;padding:10px}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .stat{background:linear-gradient(180deg,#1a2d46,#111c2b);border:1px solid var(--line2);border-radius:14px;padding:9px}
    .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
    .stat .v{font-size:22px;font-weight:900}
    .shop{display:grid;gap:8px}
    .buy{border:1px solid var(--line2);background:linear-gradient(180deg,#1a2c45,#101a28);border-radius:14px;padding:9px;display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center}
    .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(180deg,#263b5a,#172537);border:1px solid var(--line2);font-size:18px}
    .buyTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
    .buyTitle b{font-size:12px}
    .price{font-size:11px;font-weight:900;color:#ffd979;background:#0d1723;border:1px solid var(--line2);border-radius:999px;padding:4px 7px;white-space:nowrap}
    .buy button{width:100%;margin-top:2px}
    button{appearance:none;border:none;cursor:pointer;border-radius:10px;padding:8px 10px;font-weight:900;font-size:12px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#241a04;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15), 0 8px 18px rgba(0,0,0,.16);transition:.14s transform,.14s filter,.14s opacity}
    button:hover{transform:translateY(-1px);filter:brightness(1.03)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
    .resetBtn{width:100%;margin-top:8px;background:linear-gradient(180deg,#2a3b54,#192335);color:var(--text);border:1px solid var(--line2);box-shadow:none}
    .log{position:fixed;right:14px;top:86px;width:205px;border-radius:18px;padding:10px 12px}
    .log h3{margin:0 0 8px;font-size:13px}
    .log ul{margin:0;padding-left:16px;max-height:180px;overflow:auto;color:var(--muted);font-size:11px;line-height:1.35}
    .tip{position:fixed;right:14px;bottom:14px;background:rgba(10,16,25,.72);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:11px;backdrop-filter:blur(8px)}
  </style>
</head>
<body>
<canvas id="game"></canvas>

<div class="topbar">
  <div class="brand"><h1><span class="mc">McBurger</span> Tycoon</h1></div>
  <div class="money"><small>Kontostand</small><span id="money">$500</span></div>
</div>

<div class="sidebar">
  <div class="stats">
    <div class="stat"><div class="k">Burger</div><div class="v" id="burgers">0</div></div>
    <div class="stat"><div class="k">Kunden</div><div class="v" id="customers">0</div></div>
    <div class="stat"><div class="k">Maschinen</div><div class="v" id="machines">2</div></div>
    <div class="stat"><div class="k">Level</div><div class="v" id="level">1</div></div>
  </div>
  <div class="shop">
    <div class="buy"><div class="ico">⚙️</div><div><div class="buyTitle"><b>Maschine</b><span class="price" id="machineCost">$260</span></div><button id="btnMachine">Kaufen</button></div></div>
    <div class="buy"><div class="ico">🚀</div><div><div class="buyTitle"><b>Effizienz</b><span class="price" id="effCost">$480</span></div><button id="btnEff">Upgrade</button></div></div>
    <div class="buy"><div class="ico">🧍</div><div><div class="buyTitle"><b>Kunden</b><span class="price" id="custCost">$220</span></div><button id="btnCust">Kaufen</button></div></div>
    <div class="buy"><div class="ico">💳</div><div><div class="buyTitle"><b>Kasse</b><span class="price" id="cashCost">$340</span></div><button id="btnCash">Upgrade</button></div></div>
  </div>
  <button class="resetBtn" id="btnReset">Reset</button>
</div>

<div class="log">
  <h3>Log</h3>
  <ul id="events"></ul>
</div>

<div class="tip">Klick auf Fabrik = Turbo · Klick auf Kasse = Sofortverkauf</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const ui = {
    money: document.getElementById('money'),
    burgers: document.getElementById('burgers'),
    customers: document.getElementById('customers'),
    machines: document.getElementById('machines'),
    level: document.getElementById('level'),
    machineCost: document.getElementById('machineCost'),
    effCost: document.getElementById('effCost'),
    custCost: document.getElementById('custCost'),
    cashCost: document.getElementById('cashCost'),
    events: document.getElementById('events'),
    btnMachine: document.getElementById('btnMachine'),
    btnEff: document.getElementById('btnEff'),
    btnCust: document.getElementById('btnCust'),
    btnCash: document.getElementById('btnCash'),
    btnReset: document.getElementById('btnReset'),
  };

  const world = {
    w: 1780, h: 980,
    factory:{x:220,y:245,w:540,h:320},
    machineSlots:[
      {x:280,y:360},{x:430,y:360},{x:580,y:360},
      {x:280,y:460},{x:430,y:460},{x:580,y:460}
    ],
    belt:{x1:700,x2:1030,y:405},
    restaurant:{x:1030,y:220,w:560,h:370},
    entrance:{x:1390,y:590},
    road:{x:120,y:700,w:1540,h:120},
    plaza:{x:1000,y:650,w:640,h:100},
    factoryHotspot:{x:220,y:245,w:540,h:320},
    cashHotspot:{x:1135,y:430,w:210,h:80}
  };

  const state = {
    money:500, machineCount:2, efficiency:1, customerBoost:1, cashierLevel:1,
    totalCustomers:0, readyBurgers:10, burgers:[], customers:[], particles:[],
    machineTimers:[], customerTimer:0, turbo:0, level:1, events:[], time:0,
    camX:0, camY:0, targetCamX:0, targetCamY:0, zoom:1, targetZoom:1,
    mouseWorldX:0, mouseWorldY:0, lastSellBurst:0
  };

  const fmt = n => '$' + Math.floor(n).toLocaleString('de-DE');
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const lerp = (a,b,t) => a + (b-a)*t;
  const pointIn = (x,y,r) => x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h;

  function rr(x,y,w,h,r,fill,stroke){
    ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
  }
  function shadow(x,y,rx,ry,a=.16){
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function addEvent(text){
    state.events.unshift(text); state.events = state.events.slice(0,7);
    ui.events.innerHTML = state.events.map(e => `<li>${e}</li>`).join('');
  }

  const getMachineCost = () => Math.floor(260 * Math.pow(1.58, state.machineCount-1));
  const getEffCost = () => Math.floor(480 * Math.pow(1.75, state.efficiency-1));
  const getCustCost = () => Math.floor(220 * Math.pow(1.62, state.customerBoost-1));
  const getCashCost = () => Math.floor(340 * Math.pow(1.74, state.cashierLevel-1));

  function updateUI(){
    state.level = 1 + Math.floor((state.machineCount-2)*0.7 + (state.efficiency-1)*1.1 + (state.customerBoost-1)*0.8 + (state.cashierLevel-1)*0.8);
    ui.money.textContent = fmt(state.money);
    ui.burgers.textContent = state.readyBurgers + state.burgers.length;
    ui.customers.textContent = state.totalCustomers;
    ui.machines.textContent = state.machineCount;
    ui.level.textContent = state.level;
    ui.machineCost.textContent = fmt(getMachineCost());
    ui.effCost.textContent = fmt(getEffCost());
    ui.custCost.textContent = fmt(getCustCost());
    ui.cashCost.textContent = fmt(getCashCost());
    ui.btnMachine.disabled = state.money < getMachineCost() || state.machineCount >= world.machineSlots.length;
    ui.btnEff.disabled = state.money < getEffCost();
    ui.btnCust.disabled = state.money < getCustCost();
    ui.btnCash.disabled = state.money < getCashCost();
  }

  function burst(x,y,count,color,text=''){
    for(let i=0;i<count;i++){
      state.particles.push({x,y,vx:(Math.random()-0.5)*2.6,vy:(Math.random()-0.5)*2.2-0.7,life:34+Math.random()*18,color,text:i===0?text:''});
    }
  }

  function ensureTimers(){
    while(state.machineTimers.length < state.machineCount){ state.machineTimers.push(Math.random()*0.5); }
  }

  function resetGame(){
    state.money = 500; state.machineCount = 2; state.efficiency = 1; state.customerBoost = 1; state.cashierLevel = 1;
    state.totalCustomers = 0; state.readyBurgers = 10; state.burgers = []; state.customers = []; state.particles = [];
    state.customerTimer = 0; state.machineTimers = Array.from({length:state.machineCount}, (_,i)=>0.2 + i*0.18 + Math.random()*0.2);
    state.turbo = 0; state.events = []; addEvent('Spiel gestartet.'); updateUI();
  }

  function spawnBurger(machineIndex){
    const slot = world.machineSlots[machineIndex];
    state.burgers.push({x:slot.x+20,y:slot.y+6,phase:'toBelt',targetX:world.belt.x1,targetY:world.belt.y,t:0});
    burst(slot.x,slot.y,3,'#ffd26b');
  }

  function spawnCustomer(){
    const sx = world.entrance.x + Math.random()*40;
    const sy = world.entrance.y + Math.random()*20;
    state.customers.push({
      x:sx,y:sy, tx:0,ty:0, wait:0, leave:false, state:'entering',
      tone:['#ffd1b7','#d89972','#8c5b3d','#f0d7c6'][Math.floor(Math.random()*4)],
      shirt:['#ff6f73','#4fc7ff','#84ec7f','#ffd66b','#c39bff','#ff9fcb'][Math.floor(Math.random()*6)]
    });
  }

  function sellOne(manual=false){
    if(state.readyBurgers <= 0) return false;
    const price = 16 + state.cashierLevel*3 + Math.floor(Math.random()*4);
    state.readyBurgers--; state.money += price; state.totalCustomers++; state.lastSellBurst = 0.18;
    burst(world.restaurant.x + 215, world.restaurant.y + 270, 7, '#8cff9d', '+' + price);
    if(manual) addEvent('Sofortverkauf.');
    return true;
  }

  function update(dt){
    state.time += dt; state.turbo = Math.max(0, state.turbo - dt); state.lastSellBurst = Math.max(0, state.lastSellBurst - dt);
    state.camX = lerp(state.camX, state.targetCamX, 0.05); state.camY = lerp(state.camY, state.targetCamY, 0.05); state.zoom = lerp(state.zoom, state.targetZoom, 0.08);
    ensureTimers();
    let prodDelay = Math.max(0.34, 1.05 - state.machineCount*0.03 - state.efficiency*0.04);
    if(state.turbo > 0) prodDelay *= 0.42;

    for(let i=0;i<state.machineTimers.length;i++){
      state.machineTimers[i] -= dt;
      if(state.machineTimers[i] <= 0){
        spawnBurger(i);
        if(state.efficiency >= 2 && Math.random() < Math.min(0.8, 0.16 + state.efficiency * 0.11)) spawnBurger(i);
        state.machineTimers[i] = prodDelay + Math.random()*0.22;
      }
    }

    for(const b of state.burgers){
      if(b.phase === 'toBelt'){
        b.x = lerp(b.x, b.targetX, 0.1 * dt * 60); b.y = lerp(b.y, b.targetY, 0.1 * dt * 60);
        if(Math.hypot(b.x-b.targetX, b.y-b.targetY) < 5){ b.phase='belt'; b.t=0; }
      } else if(b.phase === 'belt'){
        b.t += dt * (0.16 + state.efficiency*0.015 + (state.turbo>0 ? 0.12 : 0));
        b.x = lerp(world.belt.x1, world.belt.x2, b.t); b.y = world.belt.y + Math.sin(b.t*14)*2;
        if(b.t >= 1){ b.phase='counter'; b.targetX = world.restaurant.x + 185 + Math.random()*90; b.targetY = world.restaurant.y + 245 + Math.random()*16; }
      } else if(b.phase === 'counter'){
        b.x = lerp(b.x, b.targetX, 0.14 * dt * 60); b.y = lerp(b.y, b.targetY, 0.14 * dt * 60);
        if(Math.hypot(b.x-b.targetX, b.y-b.targetY) < 6){ b.done = true; state.readyBurgers++; }
      }
    }
    state.burgers = state.burgers.filter(b => !b.done).slice(-120);

    state.customerTimer -= dt;
    const rate = Math.max(0.28, 1.8 - state.customerBoost*0.22);
    if(state.customerTimer <= 0){
      state.customerTimer = rate * (0.75 + Math.random()*0.45);
      spawnCustomer();
    }

    for(let i=0;i<state.customers.length;i++){
      const c = state.customers[i];
      // first, all customers enter through the right-side entrance and walk into the store
      if(i < 6){
        c.tx = world.restaurant.x + 470 - (i%2)*20;
        c.ty = world.restaurant.y + 345 + Math.floor(i/2)*16;
      } else {
        c.tx = world.restaurant.x + 188 + (i % 3)*42;
        c.ty = world.restaurant.y + 315 + Math.floor((i-6) / 3)*22;
      }
      c.x = lerp(c.x, c.tx, 0.05 * dt * 60);
      c.y = lerp(c.y, c.ty, 0.05 * dt * 60);

      if(i===0){
        c.wait -= dt;
        if(c.wait <= 0){
          c.wait = Math.max(0.18, 0.88 - state.cashierLevel*0.12);
          if(sellOne(false)) c.leave = true;
        }
      }
    }

    // leaving customers visibly walk out to the entrance
    for(const c of state.customers){
      if(c.leave){
        c.x = lerp(c.x, world.entrance.x + 20, 0.06 * dt * 60);
        c.y = lerp(c.y, world.entrance.y + 10, 0.06 * dt * 60);
        if(Math.hypot(c.x-(world.entrance.x+20), c.y-(world.entrance.y+10)) < 8) c.gone = true;
      }
    }
    state.customers = state.customers.filter(c => !c.gone).slice(0,18);

    for(const p of state.particles){
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.02 * dt * 60; p.life -= dt * 60;
    }
    state.particles = state.particles.filter(p => p.life > 0);
    updateUI();
  }

  function drawBurger(x,y,s=1){
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    rr(-17,-12,34,10,5,'#efc24b'); rr(-13,-1,26,7,3,'#6e401f'); rr(-15,6,30,3,1,'#55b85d'); rr(-17,11,34,10,5,'#efc24b');
    ctx.restore();
  }

  function drawGround(){
    const g = ctx.createLinearGradient(0,0,0,world.h); g.addColorStop(0,'#95e06f'); g.addColorStop(1,'#61bc48');
    ctx.fillStyle = g; ctx.fillRect(0,0,world.w,world.h);
    for(let y=0;y<world.h;y+=46){ ctx.fillStyle = y%92===0 ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.03)'; ctx.fillRect(0,y,world.w,22); }
    rr(110,175,1490,430,26,'#d0d8de'); rr(125,190,1460,400,22,'#9be176');
  }

  function drawRoad(){
    const r = world.road; shadow(r.x+r.w/2, r.y+r.h+8, 350, 16, .12); rr(r.x,r.y,r.w,r.h,28,'#59616a');
    for(let x=r.x+55; x<r.x+r.w-60; x+=78){ ctx.fillStyle = '#f0e3a0'; ctx.fillRect(x, r.y + r.h/2 - 4, 38, 8); }
  }

  function drawTrees(){
    const pts = [[120,120],[210,92],[1550,112],[1590,220],[135,880],[1540,880],[1320,860],[820,875]];
    for(const [x,y] of pts){
      shadow(x,y+26,28,8,.17); rr(x-6,y+10,12,24,4,'#7e512e');
      ctx.fillStyle='#2d9342'; ctx.beginPath(); ctx.arc(x,y,29,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#41b55d'; ctx.beginPath(); ctx.arc(x-14,y-7,17,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+14,y-6,16,0,Math.PI*2); ctx.fill();
    }
  }

  function drawFactory(){
    const f = world.factory;
    shadow(f.x+f.w/2, f.y+f.h+18, 220, 20, .16); rr(f.x,f.y,f.w,f.h,28,'#dce4ea'); rr(f.x+18,f.y+18,f.w-36,92,22,'#cb3126'); rr(f.x+140,f.y+44,215,34,16,'#f5ca43');
    ctx.fillStyle='#8f241d'; ctx.font='900 26px Arial'; ctx.fillText('FABRIK', f.x+205, f.y+68);
    for(let i=0;i<4;i++) rr(f.x+36+i*106, f.y+34, 64, 44, 10, '#d5f3ff');
    rr(f.x+28,f.y+145,f.w-56,26,12,'#bdc7cf'); rr(f.x+28,f.y+188,372,115,18,'#a8b7c4'); rr(f.x+28,f.y+316,372,90,18,'#9fb0bc'); rr(f.x+420,f.y+188,92,218,18,'#91a4b2');

    // slots
    for(let i=0;i<world.machineSlots.length;i++){
      const slot = world.machineSlots[i];
      if(i < state.machineCount){
        drawMachine(slot.x-40, slot.y-22, i);
      } else {
        shadow(slot.x, slot.y+18, 34, 8, .09);
        rr(slot.x-44, slot.y-26, 88, 60, 14, 'rgba(255,255,255,.18)');
        ctx.strokeStyle = 'rgba(255,255,255,.45)';
        ctx.setLineDash([8,6]);
        ctx.lineWidth = 3;
        rr(slot.x-44, slot.y-26, 88, 60, 14, null, 'rgba(255,255,255,.45)');
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,255,255,.82)';
        ctx.font = '900 12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('NÄCHSTE', slot.x, slot.y-1);
        ctx.fillText('MASCHINE', slot.x, slot.y+14);
      }
    }
    if(state.turbo > 0) rr(f.x-4,f.y-4,f.w+8,f.h+8,30,null,'rgba(125,255,173,.9)');
  }

  function drawMachine(x,y,i){
    shadow(x+40,y+54,28,7,.11); rr(x,y,82,52,14,'#f0c242'); rr(x+8,y+7,24,15,5,'#7c572a'); rr(x+40,y+8,32,18,6,'#eef4fb'); rr(x+14,y+34,54,8,4,'#8597a6');
    ctx.fillStyle = Math.sin(state.time*4+i) > 0 ? '#6fff98' : '#ff6565'; ctx.beginPath(); ctx.arc(x+70,y+12,4,0,Math.PI*2); ctx.fill();
  }

  function drawBelt(){
    const y = world.belt.y, x1 = world.belt.x1, x2 = world.belt.x2, w = x2 - x1;
    shadow(x1+w/2,y+18,180,10,.14); rr(x1-28,y-18,w+56,36,16,'#8e9ba7'); rr(x1-21,y-11,w+42,22,12,'#313840');
    for(let x=x1-5;x<x2+8;x+=30){ ctx.fillStyle='#5d6670'; ctx.fillRect(x,y-9,15,18); }
  }

  function drawRestaurant(){
    const r = world.restaurant;
    shadow(r.x+r.w/2, r.y+r.h+18, 220, 20, .16); rr(r.x,r.y,r.w,r.h,28,'#f0e8db'); rr(r.x+18,r.y+18,r.w-36,100,22,'#ce3327'); rr(r.x+135,r.y+48,250,36,16,'#f7cc43');
    ctx.fillStyle='#93251d'; ctx.font='900 34px Arial'; ctx.fillText('McBurger', r.x+165, r.y+76);
    for(let i=0;i<4;i++) rr(r.x+36+i*108, r.y+142, 72, 86, 10, '#b8e8ff');
    rr(r.x+104, r.y+235, 265, 92, 18, '#cf694a'); rr(r.x+124, r.y+253, 225, 17, 8, '#e48a6d'); rr(r.x+140, r.y+285, 195, 19, 8, '#b85439');
    ctx.fillStyle='#fff4d0'; ctx.font='900 20px Arial'; ctx.fillText('KASSE', r.x+196, r.y+311);
    rr(r.x+120, r.y+325, 270, 62, 16, '#8e9ba6'); rr(r.x+415, r.y+240, 110, 110, 18, '#f8f3ea');
    // entrance path/door
    rr(r.x+448, r.y+340, 62, 80, 12, '#a56d4a');
    rr(r.x+455, r.y+348, 48, 62, 10, '#bde6ff');
    rr(r.x+470, r.y+590, 72, 18, 8, '#909da8');
    if(state.lastSellBurst > 0){ ctx.save(); ctx.globalAlpha = state.lastSellBurst * 2.7; rr(r.x+96, r.y+228, 280, 105, 20, 'rgba(255,220,120,.45)'); ctx.restore(); }
    drawBurger(r.x+82, r.y+68, 1.2);
  }

  function drawQueueRails(){
    const sx = world.restaurant.x + 185, sy = world.restaurant.y + 310;
    ctx.strokeStyle='#8a97a2'; ctx.lineWidth=6;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(sx + i*42, sy); ctx.lineTo(sx + i*42, sy + 72); ctx.stroke(); }
  }

  function drawPlaza(){ const p = world.plaza; rr(p.x,p.y,p.w,p.h,20,'#d8dfe5'); rr(p.x+14,p.y+14,p.w-28,p.h-28,16,'#bac3cb'); }
  function drawCars(){
    const cars=[[290,760,'#da3f31'],[450,760,'#39a8ff'],[1260,762,'#ffd44f'],[1420,762,'#67d78f']];
    for(const [x,y,c] of cars){
      shadow(x,y+16,28,7,.15); rr(x-26,y-10,52,20,8,c); rr(x-14,y-8,16,11,4,'#edf6ff'); rr(x+6,y-8,14,11,4,'#dbe8f1');
      ctx.fillStyle='#282828'; ctx.beginPath(); ctx.arc(x-13,y+11,5.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+13,y+11,5.5,0,Math.PI*2); ctx.fill();
    }
  }

  function drawCustomers(){
    for(const c of state.customers){
      shadow(c.x,c.y+13,11,4,.13);
      rr(c.x-9,c.y-5,18,18,6,c.shirt);
      ctx.fillStyle=c.tone; ctx.beginPath(); ctx.arc(c.x,c.y-11,7,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#3a414b'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(c.x-4,c.y+13); ctx.lineTo(c.x-6,c.y+18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(c.x+4,c.y+13); ctx.lineTo(c.x+6,c.y+18); ctx.stroke();
    }
  }

  function drawParticles(){
    ctx.save(); ctx.textAlign='center';
    for(const p of state.particles){
      ctx.globalAlpha = clamp(p.life/40,0,1);
      if(p.text){ ctx.fillStyle=p.color; ctx.font='bold 16px Arial'; ctx.fillText(p.text,p.x,p.y); }
      else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,Math.PI*2); ctx.fill(); }
    }
    ctx.restore();
  }

  function drawBurgers(){
    for(const b of state.burgers) drawBurger(b.x,b.y,0.78);
    const count = Math.min(10, state.readyBurgers);
    for(let i=0;i<count;i++){
      const x = world.restaurant.x + 145 + (i%5)*40, y = world.restaurant.y + 223 - Math.floor(i/5)*16;
      drawBurger(x,y,0.7);
    }
  }

  function setWorldTransform(){
    ctx.translate(innerWidth/2 + state.camX + 50, innerHeight/2 + state.camY + 5);
    ctx.scale(state.zoom, state.zoom);
    ctx.translate(-world.w/2, -world.h/2);
  }

  function drawScene(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    const sky = ctx.createLinearGradient(0,0,0,innerHeight); sky.addColorStop(0,'#79d6ff'); sky.addColorStop(1,'#effcff');
    ctx.fillStyle=sky; ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.save(); setWorldTransform();
    drawGround(); drawTrees(); drawRoad(); drawFactory(); drawBelt(); drawRestaurant(); drawQueueRails(); drawPlaza(); drawCars(); drawBurgers(); drawCustomers(); drawParticles();
    if(pointIn(state.mouseWorldX,state.mouseWorldY,world.factoryHotspot)) rr(world.factory.x-4,world.factory.y-4,world.factory.w+8,world.factory.h+8,30,null,'rgba(255,255,255,.55)');
    else if(pointIn(state.mouseWorldX,state.mouseWorldY,world.cashHotspot)) rr(world.cashHotspot.x-3,world.cashHotspot.y-3,world.cashHotspot.w+6,world.cashHotspot.h+6,18,null,'rgba(255,255,255,.55)');
    ctx.restore();
  }

  function screenToWorld(clientX, clientY){
    const sx = clientX - innerWidth/2 - state.camX - 50, sy = clientY - innerHeight/2 - state.camY - 5;
    return {x: sx / state.zoom + world.w/2, y: sy / state.zoom + world.h/2};
  }

  function resize(){ canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }

  canvas.addEventListener('mousemove', (e) => {
    state.targetCamX = (e.clientX / innerWidth - 0.5) * 70; state.targetCamY = (e.clientY / innerHeight - 0.5) * 40;
    const p = screenToWorld(e.clientX, e.clientY); state.mouseWorldX = p.x; state.mouseWorldY = p.y;
    canvas.style.cursor = pointIn(p.x,p.y,world.factoryHotspot) || pointIn(p.x,p.y,world.cashHotspot) ? 'pointer' : 'default';
  });

  canvas.addEventListener('click', (e) => {
    const p = screenToWorld(e.clientX, e.clientY);
    if(pointIn(p.x,p.y,world.factoryHotspot)){ state.turbo = 5; burst(p.x,p.y,14,'#7dffaf'); addEvent('Turbo an.'); }
    else if(pointIn(p.x,p.y,world.cashHotspot)){ if(sellOne(true)) burst(p.x,p.y,10,'#ffe38a'); }
  });

  window.addEventListener('wheel', (e) => { e.preventDefault(); state.targetZoom = clamp(state.targetZoom + (e.deltaY > 0 ? -0.05 : 0.05), 0.92, 1.12); }, {passive:false});

  ui.btnMachine.onclick = () => {
    const c = getMachineCost();
    if(state.money < c || state.machineCount >= world.machineSlots.length) return;
    state.money -= c; state.machineCount++; ensureTimers();
    const slot = world.machineSlots[state.machineCount-1];
    burst(slot.x,slot.y,12,'#ffd36a'); addEvent('Maschine gekauft.'); updateUI();
  };
  ui.btnEff.onclick = () => { const c = getEffCost(); if(state.money < c) return; state.money -= c; state.efficiency++; burst(world.factory.x+440,world.factory.y+170,12,'#7ce1ff'); addEvent('Effizienz erhöht.'); updateUI(); };
  ui.btnCust.onclick = () => { const c = getCustCost(); if(state.money < c) return; state.money -= c; state.customerBoost++; burst(world.restaurant.x+480,world.restaurant.y+350,12,'#9affad'); addEvent('Mehr Kunden.'); updateUI(); };
  ui.btnCash.onclick = () => { const c = getCashCost(); if(state.money < c) return; state.money -= c; state.cashierLevel++; burst(world.restaurant.x+220,world.restaurant.y+280,10,'#fff1a8'); addEvent('Kasse besser.'); updateUI(); };
  ui.btnReset.onclick = resetGame;

  resize(); resetGame(); addEvent('Maschinenplätze markiert.'); addEvent('Kunden laufen jetzt rein.'); updateUI();

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now; update(dt); drawScene(); requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
