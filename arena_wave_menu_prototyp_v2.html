<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Arena Wave – Überarbeitet</title>
  <style>
    :root{
      --bg:#000;
      --panel:#102132;
      --panel2:#18304a;
      --text:#f4f7fb;
      --muted:#bdc9d7;
      --accent:#29b8ff;
      --accent2:#79deff;
      --danger:#ff5c55;
      --wood:#ba6d27;
      --wood-dark:#8f501c;
      --metal:#e8eef1;
      --metal-dark:#97a9b4;
      --tile-a:#efad7b;
      --tile-b:#d69387;
      --block-top:#847085;
      --block-side:#53445d;
      --shadow:rgba(0,0,0,.28);
      --ink:#0a0c10;
      --gold:#efdf6d;
    }
    html,body{
      margin:0;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      touch-action:none;
      -webkit-user-select:none;
      user-select:none;
    }
    canvas{display:block;width:100vw;height:100vh}
    #screen{
      position:fixed; inset:0; z-index:20;
      display:flex; align-items:center; justify-content:center;
      padding:20px;
      background:linear-gradient(rgba(5,10,18,.72),rgba(5,10,18,.78));
    }
    .card{
      width:min(92vw,720px);
      background:linear-gradient(180deg, rgba(20,36,55,.98), rgba(14,26,40,.98));
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      padding:26px;
      box-shadow:0 26px 90px rgba(0,0,0,.46);
    }
    .title{font-size:38px; margin:0 0 10px 0}
    .subtitle{margin:0 0 18px 0; color:var(--muted); line-height:1.5; font-size:17px}
    .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
    .choice,.panel{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      border-radius:18px;
      padding:16px;
    }
    .choice h3,.panel h3{margin:0 0 8px 0; font-size:22px}
    .choice p,.panel p,.list{margin:0; color:var(--muted); line-height:1.5}
    .row{display:flex; gap:12px; flex-wrap:wrap; margin-top:16px}
    .btn{
      appearance:none; -webkit-appearance:none; border:none; cursor:pointer;
      border-radius:16px; padding:14px 18px; min-width:160px;
      font-size:17px; font-weight:700; touch-action:manipulation;
      background:#fff; color:#111;
    }
    .btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent)); color:#072134}
    .btn.alt{background:#22364e; color:var(--text)}
    .btn.danger{background:linear-gradient(180deg,#ff978f,var(--danger)); color:#2e0705}
    .pill{
      display:inline-block; margin:6px 6px 0 0; padding:6px 10px;
      border-radius:999px; background:rgba(255,255,255,.08); color:#dce7f5;
      font-size:12px; font-weight:700;
    }
    #hud{
      position:fixed; top:max(14px, env(safe-area-inset-top)); left:max(14px, env(safe-area-inset-left));
      z-index:12; min-width:220px; display:none;
      background:rgba(12,22,34,.88); border:1px solid rgba(255,255,255,.08);
      border-radius:18px; padding:12px 14px; backdrop-filter:blur(8px);
    }
    #hud .small{font-size:13px; color:var(--muted); margin-top:4px}
    #hudActions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
    #hud button{
      appearance:none; -webkit-appearance:none; border:none; cursor:pointer; touch-action:manipulation;
      border-radius:12px; padding:10px 12px; font-size:14px; font-weight:700;
      background:#22364e; color:#fff;
    }
    #hud button.primary{background:linear-gradient(180deg,var(--accent2),var(--accent)); color:#072134}
    #toast{
      position:fixed; left:50%; top:max(18px, env(safe-area-inset-top));
      transform:translateX(-50%); z-index:15; display:none;
      background:rgba(8,13,20,.88); border:1px solid rgba(255,255,255,.08);
      border-radius:999px; padding:12px 16px; font-weight:700;
      box-shadow:0 18px 32px rgba(0,0,0,.35); white-space:nowrap;
    }
    @media (max-width:700px){
      .title{font-size:32px}
      .row{flex-direction:column}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="screen"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const screen = document.getElementById("screen");
const hud = document.getElementById("hud");
const toast = document.getElementById("toast");
const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
const TAU = Math.PI * 2;

const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const touch = {active:false, sx:0, sy:0, dx:0, dy:0};

const game = {
  screen:"menu",
  mode:"bots",
  fillBots:true,
  queueTimer:0,
  running:false,
  observing:false,
  board:null,
  round:1,
  phase:"idle", // intro wait attack recover
  phaseTime:0,
  side:"left",
  player:null,
  actors:[],
  botCount:3,
  toastTimer:0
};

function showToast(text, seconds=1.4){
  toast.textContent = text;
  toast.style.display = "block";
  game.toastTimer = seconds;
}

function renderScreen(html){
  screen.innerHTML = html;
  screen.style.display = "flex";
}

function bindButton(id, fn){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener("click", fn);
  el.addEventListener("touchend", e => { e.preventDefault(); fn(); }, {passive:false});
}

function renderMainMenu(){
  game.screen = "menu";
  game.running = false;
  game.observing = false;
  hud.style.display = "none";
  renderScreen(`
    <div class="card">
      <h1 class="title">Arena Wave</h1>
      <p class="subtitle">
        Menü, ruhigerer Start, flüssigeres Movement und sauberere Angriffsstämme.
        Online-Spiel ist hier als Lobby-/Matchmaking-Prototyp vorbereitet: Spieler suchen oder mit Bots auffüllen.
      </p>
      <div class="grid">
        <div class="choice">
          <h3>Online-Spiel</h3>
          <p>Spiel suchen. Wenn nicht genug Leute da sind, wird automatisch mit Bots aufgefüllt.</p>
          <div>
            <span class="pill">Matchmaking</span>
            <span class="pill">Bots auffüllen</span>
            <span class="pill">Lobby Flow</span>
          </div>
          <div class="row">
            <button class="btn primary" id="queueBtn">Spiel suchen</button>
          </div>
        </div>
        <div class="choice">
          <h3>Sofort spielen</h3>
          <p>Direkt ins Match mit 3 Bots. Gut zum Testen von Grafik, Flow und Deckungsmechanik.</p>
          <div>
            <span class="pill">1 Spieler</span>
            <span class="pill">3 Bots</span>
            <span class="pill">Schnellstart</span>
          </div>
          <div class="row">
            <button class="btn alt" id="soloBtn">Mit Bots starten</button>
          </div>
        </div>
      </div>
      <div class="panel" style="margin-top:14px">
        <h3>Verbessert in dieser Version</h3>
        <p class="list">
          - Beobachten hat jetzt einen Exit zurück ins Menü.<br>
          - Die Kreise mit Punktestand / „ENDE“ sind entfernt.<br>
          - Spieler laufen flüssiger und etwas schneller.<br>
          - Die Angriffsspitzen stoppen sauber an Blockkanten.
        </p>
      </div>
    </div>
  `);
  bindButton("queueBtn", renderQueueMenu);
  bindButton("soloBtn", () => beginMatch("bots"));
}

function renderQueueMenu(){
  game.screen = "queue";
  renderScreen(`
    <div class="card">
      <h1 class="title">Spielersuche</h1>
      <p class="subtitle">
        Das ist ein HTML-Prototyp ohne echten Server, aber der Ablauf ist schon wie für ein Online-Spiel gedacht.
      </p>
      <div class="panel">
        <h3>Lobby-Einstellungen</h3>
        <p>Gesucht werden 4 Spieler. Falls nicht genug Leute gefunden werden, kann mit Bots aufgefüllt werden.</p>
        <div class="row">
          <button class="btn primary" id="findFillBtn">Spiel suchen + Bots auffüllen</button>
          <button class="btn alt" id="botsOnlyBtn">Nur mit Bots starten</button>
          <button class="btn alt" id="backBtn">Zurück</button>
        </div>
      </div>
    </div>
  `);
  bindButton("findFillBtn", () => startQueue(true));
  bindButton("botsOnlyBtn", () => beginMatch("bots"));
  bindButton("backBtn", renderMainMenu);
}

function startQueue(fillBots){
  game.screen = "queueing";
  game.fillBots = fillBots;
  game.queueTimer = 0;
  renderScreen(`
    <div class="card">
      <h1 class="title">Suche läuft …</h1>
      <p class="subtitle">Es werden Spieler gesucht. Wenn nicht genug da sind, wird mit Bots aufgefüllt.</p>
      <div class="panel">
        <div id="queueStatus" class="list" style="font-size:18px">Suche nach Spielern …</div>
        <div class="row">
          <button class="btn alt" id="cancelQueueBtn">Abbrechen</button>
        </div>
      </div>
    </div>
  `);
  bindButton("cancelQueueBtn", renderQueueMenu);
}

function finishQueue(){
  beginMatch("queue");
}

function makeActor(kind, color, crown=false){
  return {
    kind, color, crown,
    x:0, y:0, vx:0, vy:0, r:18,
    alive:true,
    facing:-Math.PI/2,
    handsKick:0,
    trail:[]
  };
}

function resize(){
  canvas.width = Math.floor(innerWidth * DPR);
  canvas.height = Math.floor(innerHeight * DPR);
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutBoard();
}
addEventListener("resize", resize);

function layoutBoard(){
  const size = Math.min(innerWidth * 0.58, innerHeight * 0.76, 620);
  const x = (innerWidth - size) / 2;
  const y = (innerHeight - size) / 2;
  const wall = size * 0.08;
  const pad = size * 0.05;
  const inner = size - wall * 2 - pad * 2;
  const tile = inner / 4;

  game.board = {
    x,y,size,wall,pad,inner,tile,
    innerX:x+wall+pad,
    innerY:y+wall+pad
  };
  game.board.blocks = [
    tileRect(0,0),
    tileRect(2,1),
    tileRect(3,3)
  ];

  if(game.running) seedActors();
}

function tileRect(c,r){
  const b = game.board;
  const p = b.tile * 0.05;
  return {x:b.innerX+c*b.tile+p, y:b.innerY+r*b.tile+p, w:b.tile-p*2, h:b.tile-p*2, c,r};
}
function tileCenter(c,r){
  const b = game.board;
  return {x:b.innerX+(c+0.5)*b.tile, y:b.innerY+(r+0.5)*b.tile};
}

function seedActors(){
  const player = makeActor("player", "#12b7ff", true);
  const pp = tileCenter(1,2);
  player.x = pp.x; player.y = pp.y;

  const bots = [];
  const spawns = [tileCenter(2,2), tileCenter(3,1), tileCenter(1,3)];
  const colors = ["#ff5b56","#f1a41b","#5fd689"];
  for(let i=0;i<game.botCount;i++){
    const b = makeActor("bot", colors[i], false);
    b.x = spawns[i].x;
    b.y = spawns[i].y;
    b.facing = Math.PI;
    bots.push(b);
  }
  game.player = player;
  game.actors = [player, ...bots];
}

function beginMatch(mode){
  game.mode = mode;
  game.round = 1;
  game.running = true;
  game.observing = false;
  game.side = randomSide();
  game.phase = "intro";
  game.phaseTime = 2.2;
  layoutBoard();
  hud.style.display = "block";
  screen.style.display = "none";
  if(mode === "queue") showToast("Lobby erstellt: 1 Spieler + 3 Bots", 1.8);
  else showToast("Runde startet", 1.2);
}

function randomSide(){
  const arr = ["left","right","top","bottom"];
  return arr[(Math.random()*arr.length)|0];
}

function point(e){
  const p = e.touches ? e.touches[0] : e;
  return {x:p.clientX, y:p.clientY};
}
canvas.addEventListener("mousedown", e => {
  if(!game.running || game.observing || !game.player || !game.player.alive) return;
  const p = point(e);
  touch.active = true; touch.sx = p.x; touch.sy = p.y; touch.dx = 0; touch.dy = 0;
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if(!touch.active) return;
  const p = point(e);
  touch.dx = p.x - touch.sx; touch.dy = p.y - touch.sy;
});
window.addEventListener("mouseup", () => { touch.active = false; touch.dx = 0; touch.dy = 0; });
canvas.addEventListener("touchstart", e => {
  if(!game.running || game.observing || !game.player || !game.player.alive) return;
  const p = point(e);
  touch.active = true; touch.sx = p.x; touch.sy = p.y; touch.dx = 0; touch.dy = 0;
  e.preventDefault();
},{passive:false});
window.addEventListener("touchmove", e => {
  if(!touch.active) return;
  const p = point(e);
  touch.dx = p.x - touch.sx; touch.dy = p.y - touch.sy;
  e.preventDefault();
},{passive:false});
window.addEventListener("touchend", () => { touch.active = false; touch.dx = 0; touch.dy = 0; });

function clampActor(a){
  const b = game.board;
  a.x = Math.max(b.innerX+a.r, Math.min(b.innerX+b.inner-a.r, a.x));
  a.y = Math.max(b.innerY+a.r, Math.min(b.innerY+b.inner-a.r, a.y));
}
function circleRect(ax,ay,ar,r){
  const nx = Math.max(r.x, Math.min(ax, r.x+r.w));
  const ny = Math.max(r.y, Math.min(ay, r.y+r.h));
  const dx = ax-nx, dy = ay-ny;
  return dx*dx + dy*dy < ar*ar;
}
function resolveBlocks(a){
  for(const b of game.board.blocks){
    if(!circleRect(a.x,a.y,a.r,b)) continue;
    const left = Math.abs((a.x+a.r)-b.x);
    const right = Math.abs((b.x+b.w)-(a.x-a.r));
    const top = Math.abs((a.y+a.r)-b.y);
    const bottom = Math.abs((b.y+b.h)-(a.y-a.r));
    const m = Math.min(left,right,top,bottom);
    if(m===left) a.x = b.x-a.r;
    else if(m===right) a.x = b.x+b.w+a.r;
    else if(m===top) a.y = b.y-a.r;
    else a.y = b.y+b.h+a.r;
  }
  clampActor(a);
}
function pushActors(){
  const alive = game.actors.filter(a => a.alive);
  for(let i=0;i<alive.length;i++){
    for(let j=i+1;j<alive.length;j++){
      const a = alive[i], b = alive[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.hypot(dx,dy) || 0.001;
      const minD = a.r+b.r+8;
      if(d < minD){
        const nx = dx/d, ny = dy/d;
        const ov = minD-d;
        a.x -= nx*ov*.5; a.y -= ny*ov*.5;
        b.x += nx*ov*.5; b.y += ny*ov*.5;
        a.vx -= nx*ov*20; a.vy -= ny*ov*20;
        b.vx += nx*ov*20; b.vy += ny*ov*20;
        a.handsKick = .1; b.handsKick = .1;
      }
    }
  }
}
function safeSpot(side, block){
  const pad = game.board.tile * 0.30;
  if(side==="left") return {x:block.x+block.w+pad, y:block.y+block.h*.5};
  if(side==="right") return {x:block.x-pad, y:block.y+block.h*.5};
  if(side==="top") return {x:block.x+block.w*.5, y:block.y+block.h+pad};
  return {x:block.x+block.w*.5, y:block.y-pad};
}
function actorSafe(a){
  for(const b of game.board.blocks){
    if(game.side==="left" && a.x>=b.x+b.w && a.y>=b.y && a.y<=b.y+b.h) return true;
    if(game.side==="right" && a.x<=b.x && a.y>=b.y && a.y<=b.y+b.h) return true;
    if(game.side==="top" && a.y>=b.y+b.h && a.x>=b.x && a.x<=b.x+b.w) return true;
    if(game.side==="bottom" && a.y<=b.y && a.x>=b.x && a.x<=b.x+b.w) return true;
  }
  return false;
}
function chooseBotTarget(bot){
  const spots = game.board.blocks.map(b => safeSpot(game.side,b));
  let best = spots[0], bestD = 1e9;
  for(const s of spots){
    const d = Math.hypot(bot.x-s.x, bot.y-s.y);
    if(d < bestD){ bestD = d; best = s; }
  }
  return best;
}
function killActor(a){
  a.alive = false;
  a.vx = 0; a.vy = 0;
  if(a.kind === "player"){
    renderDeathMenu();
  }
}
function renderDeathMenu(){
  game.observing = false;
  renderScreen(`
    <div class="card">
      <h1 class="title">Du bist raus</h1>
      <p class="subtitle">Du kannst beobachten oder direkt zurück ins Menü.</p>
      <div class="panel">
        <p>Runde <strong>${game.round}</strong></p>
        <div class="row">
          <button class="btn primary" id="observeBtn">Beobachten</button>
          <button class="btn alt" id="backMenuBtn">Menü</button>
        </div>
      </div>
    </div>
  `);
  bindButton("observeBtn", () => {
    game.observing = true;
    screen.style.display = "none";
    showToast("Beobachter-Modus", 1.1);
  });
  bindButton("backMenuBtn", renderMainMenu);
}

function updateActors(dt){
  const p = game.player;
  if(p && p.alive && !game.observing){
    let mx = 0, my = 0;
    if(keys["w"]||keys["arrowup"]) my -= 1;
    if(keys["s"]||keys["arrowdown"]) my += 1;
    if(keys["a"]||keys["arrowleft"]) mx -= 1;
    if(keys["d"]||keys["arrowright"]) mx += 1;
    if(touch.active){
      mx += Math.max(-1, Math.min(1, touch.dx/42));
      my += Math.max(-1, Math.min(1, touch.dy/42));
    }
    const len = Math.hypot(mx,my);
    if(len > 0){
      p.facing = Math.atan2(my/len, mx/len);
      p.vx += (mx/len) * 820 * dt;
      p.vy += (my/len) * 820 * dt;
    }
  }

  for(const a of game.actors){
    if(!a.alive || a.kind !== "bot") continue;
    const t = chooseBotTarget(a);
    const dx = t.x-a.x, dy = t.y-a.y;
    const len = Math.hypot(dx,dy);
    if(len > 1){
      a.facing = Math.atan2(dy/len, dx/len);
      a.vx += (dx/len) * 660 * dt;
      a.vy += (dy/len) * 660 * dt;
    }
  }

  pushActors();

  for(const a of game.actors){
    if(!a.alive) continue;
    a.handsKick = Math.max(0, a.handsKick-dt);
    a.x += a.vx*dt;
    a.y += a.vy*dt;
    a.vx *= 0.80;
    a.vy *= 0.80;
    if(Math.hypot(a.vx,a.vy) > 8) a.facing = Math.atan2(a.vy,a.vx);
    resolveBlocks(a);

    a.trail.push({x:a.x, y:a.y, t:.20});
    if(a.trail.length > 6) a.trail.shift();
    for(const tr of a.trail) tr.t -= dt;
    a.trail = a.trail.filter(tr => tr.t > 0);
  }
}

function updateQueueing(dt){
  if(game.screen !== "queueing") return;
  game.queueTimer += dt;
  const el = document.getElementById("queueStatus");
  if(!el) return;
  if(game.queueTimer < 1.2) el.innerHTML = "Suche nach Spielern …<br><strong>1 / 4 gefunden</strong>";
  else if(game.queueTimer < 2.2) el.innerHTML = "Suche nach Spielern …<br><strong>2 / 4 gefunden</strong>";
  else if(game.queueTimer < 3.2) el.innerHTML = "Nicht genug Spieler gefunden.<br><strong>Fülle mit Bots auf …</strong>";
  else finishQueue();
}

function updateGame(dt){
  if(!game.running) return;
  updateActors(dt);
  game.phaseTime -= dt;

  if(game.phase === "intro"){
    if(game.phaseTime <= 0){
      game.phase = "wait";
      game.phaseTime = 1.35;
      showToast("Such Deckung", 1.0);
    }
  } else if(game.phase === "wait"){
    if(game.phaseTime <= 0){
      game.phase = "attack";
      game.phaseTime = 0.95;
    }
  } else if(game.phase === "attack"){
    if(game.phaseTime <= 0.16){
      for(const a of game.actors){
        if(a.alive && !actorSafe(a)) killActor(a);
      }
    }
    if(game.phaseTime <= 0){
      game.phase = "recover";
      game.phaseTime = 0.75;
    }
  } else if(game.phase === "recover"){
    if(game.phaseTime <= 0){
      game.round += 1;
      game.side = randomSide();
      game.phase = "wait";
      game.phaseTime = 1.15;
    }
  }
}

function update(dt){
  if(game.toastTimer > 0){
    game.toastTimer -= dt;
    if(game.toastTimer <= 0) toast.style.display = "none";
  }
  updateQueueing(dt);
  updateGame(dt);
  renderHud();
}

function renderHud(){
  if(!game.running){ hud.style.display = "none"; return; }
  hud.style.display = "block";
  const aliveBots = game.actors.filter(a => a.kind==="bot" && a.alive).length;
  const status = game.player && game.player.alive ? (game.observing ? "Beobachten" : "Aktiv") : "Raus";
  const phaseText = game.phase === "intro" ? "Start" : game.phase === "wait" ? "Warnung" : game.phase === "attack" ? "Angriff" : "Pause";
  const canExitObserve = game.observing;
  hud.innerHTML = `
    <div><strong>Runde:</strong> ${game.round}</div>
    <div><strong>Status:</strong> ${status}</div>
    <div><strong>Bots:</strong> ${aliveBots}</div>
    <div><strong>Phase:</strong> ${phaseText}</div>
    <div class="small">WASD / Pfeile / Touch ziehen</div>
    <div id="hudActions">
      ${canExitObserve ? `<button id="leaveObserveBtn" class="primary">Beobachten verlassen</button>` : ``}
      <button id="menuHudBtn">Menü</button>
    </div>
  `;
  const menuHudBtn = document.getElementById("menuHudBtn");
  if(menuHudBtn){
    menuHudBtn.addEventListener("click", renderMainMenu);
    menuHudBtn.addEventListener("touchend", e => { e.preventDefault(); renderMainMenu(); }, {passive:false});
  }
  const leaveObserveBtn = document.getElementById("leaveObserveBtn");
  if(leaveObserveBtn){
    const fn = () => renderMainMenu();
    leaveObserveBtn.addEventListener("click", fn);
    leaveObserveBtn.addEventListener("touchend", e => { e.preventDefault(); fn(); }, {passive:false});
  }
}

function drawBackground(){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,innerWidth,innerHeight);
}
function rr(x,y,w,h,r,fill=true,stroke=false){
  r = Math.min(r,w*.5,h*.5);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill) ctx.fill();
  if(stroke) ctx.stroke();
}
function drawBoard(){
  const b = game.board;
  const off = b.size * .03;

  ctx.fillStyle = "#223a55";
  ctx.fillRect(b.x+off, b.y+off, b.size, b.size);
  ctx.fillStyle = "#3c6484";
  ctx.fillRect(b.x, b.y, b.size, b.size);
  ctx.fillStyle = "#000";
  ctx.fillRect(b.x+b.wall, b.y+b.wall, b.size-b.wall*2, b.size-b.wall*2);

  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const x = b.innerX + c*b.tile;
      const y = b.innerY + r*b.tile;
      ctx.fillStyle = ((r+c)%2===0) ? "#f3ad7b" : "#d79288";
      ctx.fillRect(x,y,b.tile,b.tile);
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.fillRect(x+b.tile*.12,y+b.tile*.12,b.tile*.6,b.tile*.6);
      ctx.fillStyle = "rgba(0,0,0,.08)";
      ctx.beginPath();
      ctx.moveTo(x+b.tile*.72,y+b.tile*.1);
      ctx.lineTo(x+b.tile*.9,y+b.tile*.1);
      ctx.lineTo(x+b.tile*.9,y+b.tile*.28);
      ctx.closePath();
      ctx.fill();
    }
  }
}
function drawBlock(rect){
  const sh = game.board.tile * .13;
  ctx.fillStyle = "rgba(0,0,0,.25)";
  rr(rect.x+sh,rect.y+sh,rect.w,rect.h,rect.w*.2,true,false);
  ctx.fillStyle = "#4d3d57";
  rr(rect.x,rect.y+rect.h*.12,rect.w,rect.h*.88,rect.w*.2,true,false);
  ctx.fillStyle = "#7d687f";
  rr(rect.x,rect.y,rect.w,rect.h*.9,rect.w*.2,true,false);
}
function drawBlocks(){
  for(const b of game.board.blocks) drawBlock(b);
}

function drawTrail(a){
  for(const tr of a.trail){
    const alpha = Math.max(0,tr.t/.20)*.16;
    ctx.fillStyle = "rgba(130,95,70,"+alpha+")";
    ctx.save();
    ctx.translate(tr.x,tr.y);
    ctx.rotate(a.facing + Math.PI/4);
    ctx.fillRect(-4,-4,8,8);
    ctx.restore();
  }
}
function drawCrown(x,y){
  ctx.fillStyle = "#efe16a";
  ctx.strokeStyle = "#0d0d11";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x-10,y+12);
  ctx.lineTo(x-7,y-1);
  ctx.lineTo(x+1,y+6);
  ctx.lineTo(x+8,y-4);
  ctx.lineTo(x+15,y+12);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}
function drawActor(a){
  if(!a.alive) return;
  drawTrail(a);

  const x=a.x, y=a.y, r=a.r;
  const dx=Math.cos(a.facing), dy=Math.sin(a.facing);
  const px=-dy, py=dx;
  const kick=a.handsKick>0?4:0;

  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();
  ctx.ellipse(x+2,y+r*.93,r*.86,r*.48,0,0,TAU);
  ctx.fill();

  const armBaseX=x+dx*(r*.52), armBaseY=y+dy*(r*.52);
  const handDist=r*.94+kick, spread=r*.47;
  const h1x=x+dx*handDist+px*spread, h1y=y+dy*handDist+py*spread;
  const h2x=x+dx*handDist-px*spread, h2y=y+dy*handDist-py*spread;

  ctx.strokeStyle="#0c0c10";
  ctx.lineWidth=4;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(armBaseX+px*4,armBaseY+py*4); ctx.lineTo(h1x,h1y);
  ctx.moveTo(armBaseX-px*4,armBaseY-py*4); ctx.lineTo(h2x,h2y);
  ctx.stroke();

  ctx.fillStyle=a.color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,TAU);
  ctx.fill();
  ctx.lineWidth=5;
  ctx.strokeStyle="#0b0b0f";
  ctx.stroke();

  // face area closer to sample
  ctx.fillStyle="#0c0c10";
  ctx.beginPath();
  ctx.ellipse(x+dx*3,y+dy*3,r*.60,r*.46,a.facing,0,TAU);
  ctx.fill();

  // bigger eyes
  ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.arc(x+dx*6-px*2.6,y+dy*6-py*2.6,3.4,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x+dx*6+px*2.6,y+dy*6+py*2.6,3.4,0,TAU); ctx.fill();
  ctx.fillStyle="#0a0c10";
  ctx.beginPath(); ctx.arc(x+dx*7.3-px*2.1,y+dy*7.3-py*2.1,1.35,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x+dx*7.3+px*2.1,y+dy*7.3+py*2.1,1.35,0,TAU); ctx.fill();

  for(const hand of [[h1x,h1y],[h2x,h2y]]){
    ctx.fillStyle=a.color;
    ctx.beginPath();
    ctx.arc(hand[0],hand[1],r*.32,0,TAU);
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle="#0c0c10";
    ctx.stroke();
  }

  if(a.crown) drawCrown(x-1,y-r-7);
}
function drawActors(){
  for(const a of game.actors) drawActor(a);
}

function getLaneSpan(side, lane){
  const b = game.board, t = b.tile;
  if(side==="left" || side==="right"){
    return {x:b.innerX, y:b.innerY + lane*t + t*.16, w:b.inner, h:t*.68};
  }
  return {x:b.innerX + lane*t + t*.16, y:b.innerY, w:t*.68, h:b.inner};
}
function laneBlockLimit(side, lane){
  const span = getLaneSpan(side, lane);
  const hits = game.board.blocks.filter(b => {
    if(side==="left" || side==="right"){
      return !(span.y+span.h <= b.y || span.y >= b.y+b.h);
    }
    return !(span.x+span.w <= b.x || span.x >= b.x+b.w);
  });
  if(!hits.length) return null;
  if(side==="left") return Math.min(...hits.map(b => b.x));
  if(side==="right") return Math.max(...hits.map(b => b.x + b.w));
  if(side==="top") return Math.min(...hits.map(b => b.y));
  return Math.max(...hits.map(b => b.y + b.h));
}
function logProgress(){
  if(game.phase !== "attack") return 0;
  return 1 - (game.phaseTime / 0.95);
}
function drawLog(side, lane, active){
  const b = game.board, t = b.tile;
  const bodyLen = t*1.22, tip = t*.29;
  const retract = 0;
  const p = active ? logProgress() : 0;

  let baseX, baseY, w, h;
  if(side==="left" || side==="right"){
    h=t*.68; w=bodyLen;
    baseY=b.innerY + lane*t + t*.16;
    baseX = side==="left" ? b.x - w*.18 : b.x + b.size - w*.82;
  } else {
    w=t*.68; h=bodyLen;
    baseX=b.innerX + lane*t + t*.16;
    baseY = side==="top" ? b.y - h*.18 : b.y + b.size - h*.82;
  }

  let x=baseX, y=baseY, drawW=w, drawH=h, tipPath=null;

  if(active){
    const maxTravel = t*1.34*p;
    const limit = laneBlockLimit(side, lane);
    if(side==="left"){
      const target = limit===null ? (b.innerX + maxTravel) : Math.min(limit, b.innerX + maxTravel);
      const tipX = target;
      const bodyEnd = tipX - tip;
      drawW = Math.max(0, bodyEnd - x);
      tipPath = [[bodyEnd,y+h*.08],[tipX,y+h*.5],[bodyEnd,y+h*.92]];
    } else if(side==="right"){
      const target = limit===null ? (b.innerX+b.inner-maxTravel) : Math.max(limit, b.innerX+b.inner-maxTravel);
      const tipX = target;
      const bodyStart = tipX + tip;
      x = bodyStart;
      drawW = Math.max(0, baseX + w - bodyStart);
      tipPath = [[bodyStart,y+h*.08],[tipX,y+h*.5],[bodyStart,y+h*.92]];
    } else if(side==="top"){
      const target = limit===null ? (b.innerY + maxTravel) : Math.min(limit, b.innerY + maxTravel);
      const tipY = target;
      const bodyEnd = tipY - tip;
      drawH = Math.max(0, bodyEnd - y);
      tipPath = [[x+w*.08,bodyEnd],[x+w*.5,tipY],[x+w*.92,bodyEnd]];
    } else {
      const target = limit===null ? (b.innerY+b.inner-maxTravel) : Math.max(limit, b.innerY+b.inner-maxTravel);
      const tipY = target;
      const bodyStart = tipY + tip;
      y = bodyStart;
      drawH = Math.max(0, baseY + h - bodyStart);
      tipPath = [[x+w*.08,bodyStart],[x+w*.5,tipY],[x+w*.92,bodyStart]];
    }
  }

  if(drawW <= 0 || drawH <= 0) return;

  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.fillRect(x+8,y+9,drawW,drawH);

  ctx.fillStyle="#8d4b1d";
  rr(x,y,drawW,drawH,9,true,false);

  ctx.fillStyle="#b76726";
  if(side==="left"||side==="right") rr(x+8,y+2,Math.max(0,drawW-12),Math.max(0,drawH-4),7,true,false);
  else rr(x+2,y+8,Math.max(0,drawW-4),Math.max(0,drawH-12),7,true,false);

  ctx.strokeStyle="rgba(133,72,28,.38)";
  ctx.lineWidth=7;
  ctx.lineCap="round";
  if(side==="left"||side==="right"){
    for(const pr of [.18,.61]){
      const xx=x+drawW*pr;
      ctx.beginPath(); ctx.moveTo(xx,y+drawH*.26); ctx.lineTo(xx+drawW*.06,y+drawH*.26); ctx.stroke();
    }
    ctx.fillStyle="rgba(132,71,26,.4)";
    for(const pr of [.22,.73]){
      ctx.beginPath(); ctx.arc(x+drawW*pr,y+drawH*.63,6,0,TAU); ctx.fill();
    }
  } else {
    for(const pr of [.18,.61]){
      const yy=y+drawH*pr;
      ctx.beginPath(); ctx.moveTo(x+drawW*.28,yy); ctx.lineTo(x+drawW*.28,yy+drawH*.06); ctx.stroke();
    }
    ctx.fillStyle="rgba(132,71,26,.4)";
    for(const pr of [.22,.73]){
      ctx.beginPath(); ctx.arc(x+drawW*.63,y+drawH*pr,6,0,TAU); ctx.fill();
    }
  }

  // metal collar at front
  ctx.fillStyle="#1f232a";
  if(side==="left" && tipPath){
    rr(tipPath[0][0]-12,y-2,12,drawH+4,4,true,false);
  } else if(side==="right" && tipPath){
    rr(x,y-2,12,drawH+4,4,true,false);
  } else if(side==="top" && tipPath){
    rr(x-2,tipPath[0][1]-12,drawW+4,12,4,true,false);
  } else if(side==="bottom" && tipPath){
    rr(x-2,y,drawW+4,12,4,true,false);
  }

  if(tipPath){
    ctx.fillStyle="#eef5f5";
    ctx.strokeStyle="#9baab2";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(tipPath[0][0], tipPath[0][1]);
    ctx.lineTo(tipPath[1][0], tipPath[1][1]);
    ctx.lineTo(tipPath[2][0], tipPath[2][1]);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}
function drawLogs(){
  for(let i=0;i<4;i++){
    drawLog("left",i,game.side==="left");
    drawLog("right",i,game.side==="right");
    drawLog("top",i,game.side==="top");
    drawLog("bottom",i,game.side==="bottom");
  }
}
function drawWarning(){
  if(game.phase !== "wait") return;
  const b = game.board;
  const pulse = .45 + .55*Math.sin(performance.now()*0.013);
  ctx.save();
  ctx.globalAlpha = .85*pulse;
  ctx.fillStyle = "#ff312f";
  if(game.side==="left") ctx.fillRect(b.x+b.wall*.18,b.innerY,b.wall*.48,b.inner);
  else if(game.side==="right") ctx.fillRect(b.x+b.size-b.wall*.66,b.innerY,b.wall*.48,b.inner);
  else if(game.side==="top") ctx.fillRect(b.innerX,b.y+b.wall*.18,b.inner,b.wall*.48);
  else ctx.fillRect(b.innerX,b.y+b.size-b.wall*.66,b.inner,b.wall*.48);
  ctx.restore();
}
function drawIntroText(){
  if(!game.running) return;
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.textAlign = "center";
  if(game.phase === "intro"){
    ctx.font = "bold 34px Arial";
    ctx.fillText("Runde startet …", innerWidth*.5, Math.max(48, game.board.y-28));
  } else if(game.phase === "wait"){
    ctx.font = "bold 30px Arial";
    ctx.fillText("Such Deckung", innerWidth*.5, Math.max(48, game.board.y-28));
  }
}
function drawTouch(){
  if(!touch.active || game.observing || !game.player || !game.player.alive) return;
  ctx.save();
  ctx.globalAlpha=.22; ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.arc(touch.sx,touch.sy,34,0,TAU); ctx.fill();
  ctx.globalAlpha=.34;
  ctx.beginPath(); ctx.arc(touch.sx+Math.max(-28,Math.min(28,touch.dx)),touch.sy+Math.max(-28,Math.min(28,touch.dy)),20,0,TAU); ctx.fill();
  ctx.restore();
}
function draw(){
  drawBackground();
  if(game.board){
    drawBoard();
    drawLogs();
    drawWarning();
    drawBlocks();
    drawActors();
    drawIntroText();
    drawTouch();
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(.033, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
renderMainMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
